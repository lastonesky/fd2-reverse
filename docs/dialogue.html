<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>FD2 对白全文</title>
<style>
:root { --bg:#fafafa; --fg:#222; --muted:#777; --line:#e0e0e0; --card:#fff; --accent:#1565c0; }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.7 "Microsoft JhengHei","PingFang TC",sans-serif; color:var(--fg); background:var(--bg); }
#wrap { display:flex; height:100vh; }
#side { width:250px; overflow-y:auto; border-right:1px solid var(--line); background:var(--card); padding:12px 10px 40px; flex:none; }
#side h1 { font-size:15px; margin:0 0 10px; }
#side h4 { font-size:12px; color:var(--muted); margin:14px 0 4px; font-weight:600; }
#side a.nav { display:block; padding:3px 6px; color:var(--fg); text-decoration:none; border-radius:4px; font-size:12px; }
#side a.nav:hover { background:#eef4fb; }
#side a.nav .n { color:var(--muted); font-size:11px; float:right; }
.sp { display:flex; align-items:center; gap:4px; padding:2px 6px; border-radius:4px; font-size:12px; cursor:pointer; }
.sp:hover { background:#eef4fb; }
.sp.on { background:#e3f2fd; font-weight:600; }
.sp .n { color:var(--muted); font-size:11px; margin-left:auto; }
#main { flex:1; overflow-y:auto; padding:14px 26px 80px; }
#bar { position:sticky; top:0; background:var(--bg); padding:8px 0; z-index:5; display:flex; gap:10px; align-items:center; }
#q { flex:0 0 330px; padding:6px 10px; font-size:14px; border:1px solid var(--line); border-radius:6px; }
#cnt { color:var(--muted); font-size:12px; }
#clear { font-size:12px; color:var(--accent); cursor:pointer; display:none; }
.scene { margin-top:18px; }
.scene > h2 { font-size:16px; border-bottom:2px solid var(--accent); padding-bottom:4px; margin:0 0 8px; }
.block { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin:10px 0; }
.block .id { color:#bbb; font-size:11px; }
.row { display:flex; gap:8px; margin:3px 0; }
.badge { flex:none; display:inline-block; min-width:62px; max-width:96px; text-align:center; color:#fff;
         border-radius:4px; font-size:12px; padding:1px 5px; height:22px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
.badge.slot { background:#9e9e9e !important; }
.badge.keep { background:#bdbdbd !important; }
.txt { flex:1; }
.plain { color:var(--muted); }
mark { background:#ffe082; }
table.terms { border-collapse:collapse; font-size:13px; }
table.terms td { border:1px solid var(--line); padding:2px 8px; }
.hidden { display:none !important; }
#legend { border:1px solid var(--line); border-radius:8px; background:var(--card); padding:8px 14px; margin:4px 0 10px; font-size:12px; color:var(--muted); }
</style>
</head>

<script>
const DATA = {"scenes": [{"res": 1, "n": 12, "head": "累死了,大家休息一下吧!", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『累死了,大家休息一下吧!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『聽說再越過這片海洋就到馬拉大陸了,我們先在此休息一會兒,等海水漲潮適合上岸的時候船夫就會來接我們。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『好極了。悠妮,妳...,坐了這麼久的船,有點累吧？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『.,還好。海風吹起來真舒服啊..』"}, {"k": "id", "name": "蓋亞", "hint": "角色 id 30（蓋亞）", "ck": 30, "t": "『..!!!』"}]}, {"sub": 1, "sp": [{"k": "slot", "name": "場景#10", "hint": "場景記錄表槽位 10（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『瞧!竟有呆鳥在這小島上休息,真是天上掉下來的肥肉。』"}, {"k": "slot", "name": "場景#9", "hint": "場景記錄表槽位 9（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『就是說嘛!俺去通報老大支援,你們趕快把這些小伙子擺平。』"}]}, {"sub": 2, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『亞雷斯,那群傢伙在那裡鬼叫些什麼？』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『...嘿,好像是船夫提到過的海盜耶!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『海盜？是要來搶劫我們的嗎？』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『豈止搶劫而已,聽說這批海盜橫行馬拉大陸沿海,殺人越貨無所不為。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『什麼!要打架我奉陪,要搶劫嘛門都沒有。亞雷斯,好久沒活動活動筋骨了,你沒問題吧!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『豈止沒問題而已,我手癢難熬,都快受不了啦!』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『喂!小子們,乖乖的把身上的錢財和那個漂亮小妞交出來,我們就在老大面前說說好話保你們一命!不然.』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『什麼是漂亮小妞？是指我嗎？』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『不是啦!那是.』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『可惡,你們這些亂說話的海盜,我要把你們全宰了!』"}, {"k": "slot", "name": "場景#10", "hint": "場景記錄表槽位 10（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『啊呀,看來他們想抵抗呢!』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『那就殺無赦!上啊!』"}]}, {"sub": 3, "sp": [{"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『真是的,吵的要命,到底在搞什麼.』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『老爸,有人在島上打架呢!』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『什麼？待我看看.啊哈,可不是海盜在打劫旅客嗎？居然在我們門前搶人,膽子不小啊!』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『就是說啊!老爸,您說這該怎麼辦？』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『小子啊,這可是絕佳的歷練機會,我們就幫他們一個忙吧!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『老頭子,你們是來幹什麼的？若不想受傷就別過來湊熱鬧!』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『別緊張,小伙子,我們是來幫你們打退海盜的。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『什麼？就這一點海盜,還用不著你們來幫忙!回去回去!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『哎,索爾,人家是好意要幫忙,你也說幾句好聽一點的吧!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這樣嗎？好吧,那就.喂,老頭子,如果你要幫忙的話就先說聲多謝了!』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『這些年輕人真有精神啊!小子,我們上!』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『好的,老爸!』"}]}, {"sub": 4, "sp": [{"k": "slot", "name": "場景#15", "hint": "場景記錄表槽位 15（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『唉,弟兄們好像陷入苦戰呢!』"}, {"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『那還等什麼!我們上吧!』"}]}, {"sub": 5, "sp": [{"k": "id", "name": "盜賊頭目", "hint": "角色 id 97（盜賊頭目）", "ck": 97, "t": "『小子們,你們在搞些什麼!連這些小鬼都收拾不了,還要勞動老大我出馬,不怕給別人笑話嗎？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『哼,這難看又吵人的傢伙又是來幹什麼的？』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『大概是海盜首領吧!總算有個像樣的對手上場了這傢伙就交給我來處理啦!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『那怎麼可以!對付這種麻煩的傢伙,當然是非我莫屬了!讓我來!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『索爾,你真是不夠朋友!就為了在喜歡的女孩子面前逞能,竟然..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『你.你胡說些什麼!再亂說的話,我可就..』"}, {"k": "id", "name": "盜賊頭目", "hint": "角色 id 97（盜賊頭目）", "ck": 97, "t": "『喂!你們兩個到底在吵些什麼!要吵的話,等進了地獄後再吵也不遲!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『你煩什麼煩!滾一邊去!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『這傢伙討厭得很,索爾,我們不吵了,先合力宰了他再說!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『好,就這麼辦!』"}, {"k": "id", "name": "盜賊頭目", "hint": "角色 id 97（盜賊頭目）", "ck": 97, "t": "『可惡啊!這兩個小子全不把我放在眼裡!給我殺!一個都別放過!』"}]}, {"sub": 6, "sp": [{"k": "id", "name": "士兵", "hint": "角色 id 68（士兵）", "ck": 68, "t": "『唉!又有海盜在此逞凶了,現在正是我們海防隊建功的良機!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『今天可真是熱鬧啊!你們又是來幹什麼的？』"}, {"k": "id", "name": "士兵", "hint": "角色 id 68（士兵）", "ck": 68, "t": "『我們是亞克斯王國的海岸巡防隊,消滅肆虐沿海的海盜本是我們的職責,這些海盜就交給我們來處理,請各位放心!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『鬼扯,我們打的正高興,才不需要你們來攬局!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『索爾啊,我們就要踏進人家的地盤,至少對人家客氣點吧!』"}, {"k": "id", "name": "士兵", "hint": "角色 id 68（士兵）", "ck": 68, "t": "『沒關係!我們這就來幫忙了!』"}]}, {"sub": 7, "sp": [{"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『老爸,我.我不行啦!』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『小子,你先回屋子裏休息一下吧!這裡有老爸擋著!』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『老爸,那我就先回去了!』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『你們這些該死的海盜,竟敢砍傷我兒子,我和你們拼了!』"}]}, {"sub": 8, "sp": [{"k": "id", "name": "盜賊頭目", "hint": "角色 id 97（盜賊頭目）", "ck": 97, "t": "『可恨啊!今日先碰上這群棘手的小子在先,又遇上王國海防隊,真是天亡我也!啊..』"}]}, {"sub": 9, "sp": [{"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『多謝老爹和您公子的幫忙,我們才能順利打敗海盜。』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『那裡!我和小子住在這島上除了偶爾出去遊歷外,平常也閒來無事,幫你們打打海盜,不算什麼啦!對了,說到這個,老頭子我倒有個請求。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『老爹您說說看。』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『我瞧我這小子和你們滿合得來的,希望你們能帶他同行,讓他出去見識見識,歷練一番。我從小教了他不少武術,當你們有麻煩的時候,相信他也可以幫上一點忙。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這個好像有點..』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『哎!老爹您這個請求當然是沒問題的啦!悠妮妳說是不是？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『多一個同伴,路上也比較熱鬧啊!』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『真是太謝謝各位了。小子啊,來向大家打個招呼!』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『我.我叫哈諾,以後請.請大家多多指教。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『以後你就是我們的伙伴了。平時我們要好好相處,遇到危難時要同心協力,好嗎？』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『好.好的。』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『漲潮的時間也差不多到了,你們可以準備上路了。我這小子就拜託你們啦!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『老爹您放心吧!我們走囉!』"}]}, {"sub": 10, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『奈野啊捏？』"}]}, {"sub": 11, "sp": [{"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『老爸!老爸!"}]}]}, {"res": 2, "n": 17, "head": "我們已經抵達羅德鎮了。聽說這裡是沿岸最繁榮的城鎮,我", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『我們已經抵達羅德鎮了。聽說這裡是沿岸最繁榮的城鎮,我們可以在這裡歇一下,順便到酒店裡打聽一下消息.』"}]}, {"sub": 1, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『亞雷斯,我看你的情報有誤這裡連半個人都沒有,倒像是座鬼城!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『好可怕.』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『這可怪了,上次我和老爹來這裡買酒的時候,鎮上還熱鬧的很啊!怎麼會.』"}]}, {"sub": 2, "sp": [{"k": "slot", "name": "場景#5", "hint": "場景記錄表槽位 5（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『啊!強盜來了!快逃啊!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『等等!我們不是強盜!』"}, {"k": "slot", "name": "場景#5", "hint": "場景記錄表槽位 5（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『你們不是強盜,那你們是來幹什麼的？』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『我們不過是路過此地,想在鎮上休息一下而已!請把事情說個清楚,說不定我們可以助各位一臂之力!』"}, {"k": "slot", "name": "場景#5", "hint": "場景記錄表槽位 5（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『唉!你們這些小毛頭能做什麼？窮凶極惡的強盜團預告要在此時洗劫本鎮,鎮上的人都逃光了,我們是回來多帶走一些財物的,馬上也要逃離此地。你們也快逃吧,要是碰上了那群強盜就糟啦!』"}, {"k": "id", "name": "蓋亞", "hint": "角色 id 30（蓋亞）", "ck": 30, "t": "『..!!!』"}]}, {"sub": 3, "sp": [{"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『呀呼!我們照預告準時抵達!唉？居然還有不怕死的沒走？』"}, {"k": "slot", "name": "場景#5", "hint": "場景記錄表槽位 5（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『啊!強盜來了!完啦!』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『我們不是說過,我們來的時候不准有人留在鎮上嗎？你們是活的不耐煩了!』"}, {"k": "slot", "name": "場景#5", "hint": "場景記錄表槽位 5（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『.啊,強盜大人,請放我們一馬,以後不敢了.』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『這些強盜真猢狂啊!索爾,我們來教訓他們一頓!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『什麼教訓!不用給這些傢伙悔改的機會,把他們全宰了再說!』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『我贊成!』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『哎呀!那群小伙子說要把我們全宰了呢!』"}, {"k": "slot", "name": "場景#12", "hint": "場景記錄表槽位 12（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『好可怕呀!我好怕!』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『既然如此,我們就陪他們玩個兩手!上!』"}]}, {"sub": 4, "sp": [{"k": "slot", "name": "場景#21", "hint": "場景記錄表槽位 21（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『唉!弟兄們在幹什麼？他們早該把事情辦好了吧!』"}, {"k": "slot", "name": "場景#22", "hint": "場景記錄表槽位 22（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『好像和別人打的正起勁呢!』"}, {"k": "slot", "name": "場景#23", "hint": "場景記錄表槽位 23（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『我看到有漏網之魚向這裡逃來呢!我們先打發了他們再說!』"}, {"k": "slot", "name": "場景#8", "hint": "場景記錄表槽位 8（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『救命啊!這裡又有強盜出現了!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『可惡,沒想到敵人居然兵分兩路..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『不管怎樣,得想辦法援救那些無辜的居民!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『怎麼辦呢？索爾..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『喂!你們,往東南邊逃吧!』"}, {"k": "slot", "name": "場景#7", "hint": "場景記錄表槽位 7（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『好的!大伙兒往東南邊逃吧!』"}]}, {"sub": 5, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『奈野啊捏？』"}]}, {"sub": 6, "sp": [{"k": "slot", "name": "場景#6", "hint": "場景記錄表槽位 6（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『謝謝各位的幫助,這是我們的一點小意思,請收下吧。』"}]}, {"sub": 7, "sp": [{"k": "slot", "name": "場景#6", "hint": "場景記錄表槽位 6（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『謝謝各位的幫助,讓我們逃過一劫。』"}]}, {"sub": 8, "sp": [{"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『好棒!好棒!打的真漂亮!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『唉？哪裡蹦出來的野丫頭？』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『說話客氣點,我可不是野丫頭。剛才你們在打的時候,我一直都躲在屋子裡看,真是看了一場好戲。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『小姐,妳的膽量可真大。有什麼我們能效勞的嗎？』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『也沒什麼啦,只是想問問你們,你們這麼好的身手,應該不只是來這裡打強盜的吧？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『是這樣的,我們想醫治這個女孩子的失憶症,並且送她回家。』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『這是怎麼一回事呢？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『簡單的來說,我們在森林撿到了悠妮這女孩...』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『撿？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『不對不對,是找到了悠妮,雖然失去了記憶,但是我們相信她是這馬拉大陸的人,甚至是某王國的公主也說不定,因此設法渡海送她回來。』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『奇怪了,這大陸上就只有一個亞克斯王國,而這個王國的公主就..』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『就怎樣？』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『沒.沒什麼啦。這樣吧,我知道哪裡有人能醫治失憶症,我可以帶你們去,不過.要附帶一個條件喔。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『先說來聽聽,我們會盡量想辦法的。』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『其實也很簡單,就是要帶我一起去。』"}]}, {"sub": 9, "sp": [{"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『這..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『小姐,這可不是好玩的,妳一個年輕女孩子跟著我們,恐怕會倒大楣喔。』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『小看我的本領,你才準備倒大楣呢。怎樣？接不接受我的條件啊？』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『索爾大哥,現在強盜也不知道何時會再來,把一個女孩子就這樣丟在這裡太危險了,我看還是先帶她離開的好。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『是啊,索爾,悠妮的事必須盡快解決,了不起我們多為她操份心就是了。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『好吧!不過小姐妳給我聽好,妳是負責帶路的,別給我們添麻煩。知道嗎？』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『沒問題!走吧走吧,我來帶路!往這邊!』"}]}, {"sub": 10, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『真是沒辦法,唉!』"}]}, {"sub": 11, "sp": [{"k": "slot", "name": "場景#5", "hint": "場景記錄表槽位 5（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『啊..!』"}]}, {"sub": 12, "sp": [{"k": "slot", "name": "場景#6", "hint": "場景記錄表槽位 6（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『哇.啊..!』"}]}, {"sub": 13, "sp": [{"k": "slot", "name": "場景#7", "hint": "場景記錄表槽位 7（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『啊..!』"}]}, {"sub": 14, "sp": [{"k": "slot", "name": "場景#8", "hint": "場景記錄表槽位 8（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『哇.啊..!』"}]}, {"sub": 15, "sp": [{"k": "slot", "name": "場景#9", "hint": "場景記錄表槽位 9（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『啊..!』"}]}, {"sub": 16, "sp": [{"k": "slot", "name": "場景#10", "hint": "場景記錄表槽位 10（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『哇.啊..!』"}]}]}, {"res": 3, "n": 10, "head": "過了這座橋,就快到以醫術聞名的賽拉村了。這村子中的祭", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『過了這座橋,就快到以醫術聞名的賽拉村了。這村子中的祭司醫療法術非常神奇,應該能治好悠妮的失憶症。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『希望如此.唉.』"}]}, {"sub": 1, "sp": [{"k": "id", "name": "鐵諾", "hint": "角色 id 2（鐵諾）", "ck": 2, "t": "『.呼,這回大概是追不上了..』"}]}, {"sub": 2, "sp": [{"k": "slot", "name": "場景#7", "hint": "場景記錄表槽位 7（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『鐵諾,總算追上你了吧!這下子看你怎麼逃!』"}, {"k": "id", "name": "鐵諾", "hint": "角色 id 2（鐵諾）", "ck": 2, "t": "『你們到底和我有什麼仇恨,非得要殺死我不可？!』"}, {"k": "slot", "name": "場景#7", "hint": "場景記錄表槽位 7（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『若你能活到我們隊長趕到的時候,你再自己去問他吧!』"}, {"k": "id", "name": "鐵諾", "hint": "角色 id 2（鐵諾）", "ck": 2, "t": "『可惡!我和你們拼了!』"}]}, {"sub": 3, "sp": [{"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『唉呀!看,橋上有人準備要打架耶!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『以多打少,這太不公平了!走,亞雷斯,我們去幫那個落單的人!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『索爾,我們還沒搞清楚這是怎麼一回事,這太.』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『看那些士兵蠻不講理的樣子,就知道他一定是好人!亞雷斯,你到底去不去？』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『去,去!我總不能看著你一個人去拼命,認識你算我倒楣!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『我也去!我也去!』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『既然如此,那麼大家都去吧!走囉!』"}]}, {"sub": 4, "sp": [{"k": "id", "name": "精英戰士", "hint": "角色 id 77（精英戰士）", "ck": 77, "t": "『鐵諾,你果然很耐命!怪不得頭子一定要我親自來看看..不過,你的好運也到此為止了!』"}, {"k": "id", "name": "鐵諾", "hint": "角色 id 2（鐵諾）", "ck": 2, "t": "『如果不是這些年輕人幫忙的話,我早就沒命了!不過既然我還活著,我還是要問你一個問題：到底是誰命令你來殺我？』"}, {"k": "id", "name": "精英戰士", "hint": "角色 id 77（精英戰士）", "ck": 77, "t": "『告訴你也不要緊,是葛雷大人命令我們來除掉你的!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『葛雷？那個心胸狹窄的禁衛軍統領？是為了三年前爭奪卡蘿那女孩的事吧!』"}, {"k": "id", "name": "鐵諾", "hint": "角色 id 2（鐵諾）", "ck": 2, "t": "『妳.妳怎麼會知道這件事？』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『秘密!不過你可以放心,我們都會幫你的。』"}, {"k": "id", "name": "精英戰士", "hint": "角色 id 77（精英戰士）", "ck": 77, "t": "『可惡!幫他的都得死,何況你們已經知道了這個秘密,那就別怪我不留情!給我殺!』"}]}, {"sub": 5, "sp": [{"k": "id", "name": "精英戰士", "hint": "角色 id 77（精英戰士）", "ck": 77, "t": "『我竟然會敗在一批小鬼的手下..葛雷大人..』"}]}, {"sub": 6, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『真遺憾,我們已經盡力了,結果還是幫不了他..』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『也好,讓他到地下和愛人相聚,也不用再四處躲避別人的追殺..』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『希莉亞,妳的真實身份究竟是什麼？』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『秘密!總之,我們安葬他之後就趕快離開這裡吧,要不然的話,麻煩可能還在後頭呢!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『就這麼辦吧!』"}]}, {"sub": 7, "sp": [{"k": "id", "name": "鐵諾", "hint": "角色 id 2（鐵諾）", "ck": 2, "t": "『多謝各位的幫助,我才能逃過這次追殺。不過葛雷是不會就此罷手的,我在這片土地上,還是找不到安居之所..』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『那你可以加入我們啊!像你這樣老練的戰士,對我們來說是不可多得的伙伴,而我們一群人在一起,我保證葛雷不敢隨便對你下手。』"}, {"k": "id", "name": "鐵諾", "hint": "角色 id 2（鐵諾）", "ck": 2, "t": "『小姐,妳為什麼會知道這些事,我.』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『秘密!反正你加入我們就是了。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『哼!一副故作神秘的樣子,真是個古靈精怪的丫頭。』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『你說什麼？我可是在為你們增加有力的伙伴呢!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『不希罕!』"}, {"k": "id", "name": "鐵諾", "hint": "角色 id 2（鐵諾）", "ck": 2, "t": "『我已經決定了,如果各位不嫌棄我的話,以後就請多多關照。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『歡迎!不過,我們還是趕快離開此地,剩下的事以後再說了!』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『說得對,我們上路吧!』"}]}, {"sub": 8, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這..這是什麼碗糕!』"}]}, {"sub": 9, "sp": [{"k": "slot", "name": "場景#6", "hint": "場景記錄表槽位 6（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『卡蘿那...!』"}]}]}, {"res": 4, "n": 7, "head": "快到賽拉村啦!抄這條近路很快就到了。怎樣？還是帶著我", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『快到賽拉村啦!抄這條近路很快就到了。怎樣？還是帶著我比較好吧？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『老是走這種小道,搞不好會碰上強盜喔!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『誰說的,這條路隱密的很,只有我才知道.』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『看,前面好像有人呢!』"}]}, {"sub": 1, "sp": [{"k": "id", "name": "盜賊頭目", "hint": "角色 id 97（盜賊頭目）", "ck": 97, "t": "『你們想到賽拉村嗎？你們是來幹什麼的？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『干你屁事!不要礙路!』"}, {"k": "id", "name": "盜賊頭目", "hint": "角色 id 97（盜賊頭目）", "ck": 97, "t": "『首領說得沒錯,果然有人抄小路來偷襲了!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『什麼偷襲？把話講清楚!』"}, {"k": "id", "name": "盜賊頭目", "hint": "角色 id 97（盜賊頭目）", "ck": 97, "t": "『少裝了!死吧!』"}]}, {"sub": 2, "sp": [{"k": "slot", "name": "場景#24", "hint": "場景記錄表槽位 24（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『嗷嗚!.是誰在這裡大吵大鬧？』"}, {"k": "slot", "name": "場景#25", "hint": "場景記錄表槽位 25（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『吼.好像是人類在打架。』"}, {"k": "slot", "name": "場景#26", "hint": "場景記錄表槽位 26（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『呼.好像很有趣,我們去打人少的那一邊!』"}, {"k": "slot", "name": "場景#27", "hint": "場景記錄表槽位 27（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『贊成!贊成!』"}]}, {"sub": 3, "sp": [{"k": "id", "name": "獸人", "hint": "角色 id 102（獸人）", "ck": 102, "t": "『好可怕!不玩了!不玩了!』"}]}, {"sub": 4, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『奇怪了,在這大陸上到處都遇得上強盜!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『不對,賽拉村可能出事了!我們趕快趕過去看看!』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『打了一場大戰,不休息一下嗎？』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『放心,途中有個小村落可以稍事休息。走吧!』"}]}, {"sub": 5, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這..這是什麼碗糕!』"}]}, {"sub": 6, "sp": [{"k": "id", "name": "盜賊頭目", "hint": "角色 id 97（盜賊頭目）", "ck": 97, "t": "『哇.啊..!』"}]}]}, {"res": 5, "n": 12, "head": "喔呵呵呵!擺平了這些士兵,塞拉村就是我的啦!", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "卡特那", "hint": "角色 id 117（卡特那）", "ck": 117, "t": "『喔呵呵呵!擺平了這些士兵,塞拉村就是我的啦!』"}, {"k": "id", "name": "士兵", "hint": "角色 id 68（士兵）", "ck": 68, "t": "『別作夢了!我們的援軍再過一會兒就到了,等著瞧吧!』"}, {"k": "id", "name": "卡特那", "hint": "角色 id 117（卡特那）", "ck": 117, "t": "『那就要看你們能不能活到那個時候了!』"}]}, {"sub": 1, "sp": [{"k": "id", "name": "瑪琳", "hint": "角色 id 10（瑪琳）", "ck": 10, "t": "『可惡的強盜,連這個神聖的村莊都敢侵犯,我不會放過你們的!』"}, {"k": "id", "name": "卡特那", "hint": "角色 id 117（卡特那）", "ck": 117, "t": "『小女孩來湊什麼熱鬧,若不想受傷就快回家去!』"}, {"k": "id", "name": "瑪琳", "hint": "角色 id 10（瑪琳）", "ck": 10, "t": "『可惡,妳敢輕視我!我的護衛們很快就到了,那時後就..』"}]}, {"sub": 2, "sp": [{"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『哎呀呀呀!果然出事了!』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『好大群的盜賊啊!這下子有得打了.』"}, {"k": "id", "name": "卡特那", "hint": "角色 id 117（卡特那）", "ck": 117, "t": "『喔呵呵呵!這些就是妳的護衛嗎？怎麼看起來都是些小毛頭？』"}, {"k": "id", "name": "瑪琳", "hint": "角色 id 10（瑪琳）", "ck": 10, "t": "『這個..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『誰是小毛頭!老女人,妳說話最好小心點!』"}, {"k": "id", "name": "卡特那", "hint": "角色 id 117（卡特那）", "ck": 117, "t": "『不知死活的小鬼,讓你吃些苦頭,你才會知道大姐我的厲害。通通都給我殺了!』"}, {"k": "id", "name": "瑪琳", "hint": "角色 id 10（瑪琳）", "ck": 10, "t": "『喂!你們來幫個忙吧!打退這個盜賊團,我可以付你們不低的酬金..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『要打架嗎？我興致可高得很,亞雷斯,我們上!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『敵人數量很多,大家小心了!』"}]}, {"sub": 3, "sp": [{"k": "id", "name": "卡特那", "hint": "角色 id 117（卡特那）", "ck": 117, "t": "『就幾個小鬼還打發不掉嗎？好,第二隊,第三隊上!』"}]}, {"sub": 4, "sp": [{"k": "id", "name": "騎兵", "hint": "角色 id 69（騎兵）", "ck": 69, "t": "『無法無天的盜賊,竟然侵犯受神所庇護的神聖之村,難道不怕遭天罰嗎？我們王國正規軍這就來替天行道!』"}, {"k": "id", "name": "卡特那", "hint": "角色 id 117（卡特那）", "ck": 117, "t": "『你們來的正好,還來得及幫你們的伙伴收屍。喔呵呵呵!』"}, {"k": "id", "name": "騎兵", "hint": "角色 id 69（騎兵）", "ck": 69, "t": "『可惡,大家上啊!和這些傢伙拼了!』"}]}, {"sub": 5, "sp": [{"k": "slot", "name": "場景#48", "hint": "場景記錄表槽位 48（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『嗚吼~好吵啊!』"}, {"k": "slot", "name": "場景#49", "hint": "場景記錄表槽位 49（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『嗚吼~又發生什麼事了？』"}, {"k": "slot", "name": "場景#50", "hint": "場景記錄表槽位 50（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『嗚吼~又有人類在打架了!』"}, {"k": "slot", "name": "場景#51", "hint": "場景記錄表槽位 51（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『有趣有趣!我們再去打人少的那一邊!』"}]}, {"sub": 6, "sp": [{"k": "id", "name": "獸人", "hint": "角色 id 102（獸人）", "ck": 102, "t": "『吼.等等,那好像是我們上次遇到的那一批人耶!』"}]}, {"sub": 7, "sp": [{"k": "id", "name": "獸人", "hint": "角色 id 102（獸人）", "ck": 102, "t": "『好可怕,不要和他們打!快逃快逃!』"}]}, {"sub": 8, "sp": [{"k": "id", "name": "卡特那", "hint": "角色 id 117（卡特那）", "ck": 117, "t": "『.啊.我居然就這樣被一群小鬼打敗了,我不甘心..』"}]}, {"sub": 9, "sp": [{"k": "id", "name": "瑪琳", "hint": "角色 id 10（瑪琳）", "ck": 10, "t": "『多謝大家幫我們打敗盜賊,我代表村中的祭司們向各位致謝。除了我答應的酬勞外,各位是否還需要任何醫療與協助？相信祭司們會很樂意幫忙的。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『酬勞可以免啦,幫我們醫好這位小姐的失憶症就可以了。』"}, {"k": "id", "name": "瑪琳", "hint": "角色 id 10（瑪琳）", "ck": 10, "t": "『失憶症？這個.這種病,他們恐怕是幫不上忙喔!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『為什麼？』"}, {"k": "id", "name": "瑪琳", "hint": "角色 id 10（瑪琳）", "ck": 10, "t": "『我曾跟著村中的祭司學過一陣子神術,據我所知,神術能醫治的都是腋骨肉體上的疾病,失憶症算是一種心病,神術並不會對心靈記憶等產生影響,所以也無從治起。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『嗄？那豈不是.白忙一場了？希.希莉亞!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『這.這不是我的錯啊!我本來也以為祭司們醫術高超,一定能治好悠妮的失憶症的.』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『索爾,現在怪希莉亞也沒用,還是想想下一步該怎麼做吧。』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『索爾,我也不好意思再麻煩你們了,不如..』"}, {"k": "id", "name": "瑪琳", "hint": "角色 id 10（瑪琳）", "ck": 10, "t": "『別急嘛!我還知道有另一個方法可以醫治悠妮小姐的失憶症,想不想試試看啊？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『有附帶條件吧？』"}, {"k": "id", "name": "瑪琳", "hint": "角色 id 10（瑪琳）", "ck": 10, "t": "『別說這麼難聽嘛!是這樣的啦,有個叫約拿的賢者住在南部的大港普里茲,他見多識廣,應該知道怎麼醫治悠妮小姐的失憶症吧!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『所以妳就.』"}, {"k": "id", "name": "瑪琳", "hint": "角色 id 10（瑪琳）", "ck": 10, "t": "『我正好也要到普里茲港去找約拿,這一帶最近都不怎麼安寧,所以我想和你們結伴而行,如此就可以互相照顧啦。你們放心,我自己有帶護衛隨行,不會太麻煩你們的。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『這樣妥當嗎？』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『既然是要治好悠妮的失憶症,我想什麼辦法都值得一試。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『說的也是。那我們就一起去找約拿吧!還有,希莉亞,妳今後打算怎麼辦呢？』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『我還是跟著你們吧,多少也可以幫上一些忙。而且和你們同行,總是會遇到不少有趣的事呢!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這個瘋丫頭真是.不管了,我們上路吧!』"}]}, {"sub": 10, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這..這是什麼碗糕!』"}]}, {"sub": 11, "sp": [{"k": "id", "name": "盜賊", "hint": "角色 id 96（盜賊）", "ck": 96, "t": "『糟啦!首領被打倒了!快逃啊!』"}]}]}, {"res": 6, "n": 8, "head": "奇怪了,約拿好像不在城裡,只好先來這裡找找看了.", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "瑪琳", "hint": "角色 id 10（瑪琳）", "ck": 10, "t": "『奇怪了,約拿好像不在城裡,只好先來這裡找找看了.』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『前面好像有士兵在巡邏,大家要小心點!』"}, {"k": "slot", "name": "場景#13", "hint": "場景記錄表槽位 13（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『喂!你們站住!這裡不是禁止進入了嗎？你們來這裡幹什麼？』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『真抱歉,我們是來找人的.』"}, {"k": "slot", "name": "場景#13", "hint": "場景記錄表槽位 13（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『找什麼找,這裡什麼人都沒有!回去回去!..唉？等等,你們通通給我站住!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『又怎麼了？』"}, {"k": "slot", "name": "場景#13", "hint": "場景記錄表槽位 13（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『你是艾迪•沙林斯吧!自從上次你們一夥搶劫了維克勒城之後,我們一直在找你,想不到你居然跑去當別人的護衛了!』"}, {"k": "id", "name": "傭兵", "hint": "角色 id 70（傭兵）", "ck": 70, "t": "『....』"}, {"k": "slot", "name": "場景#13", "hint": "場景記錄表槽位 13（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『所以啊,我看你還是乖乖束手就擒,跟我們回去,這樣對你比較好。.？』"}, {"k": "id", "name": "瑪琳", "hint": "角色 id 10（瑪琳）", "ck": 10, "t": "『等一下!護衛是爸爸派給我的,你們要抓走他,叫我回去怎麼交代？』"}, {"k": "slot", "name": "場景#13", "hint": "場景記錄表槽位 13（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『那可不干我們的事!再無理取鬧的話,就連妳也一起逮捕!』"}, {"k": "id", "name": "瑪琳", "hint": "角色 id 10（瑪琳）", "ck": 10, "t": "『你敢!』"}, {"k": "slot", "name": "場景#8", "hint": "場景記錄表槽位 8（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『那邊在吵什麼吵？』"}, {"k": "slot", "name": "場景#13", "hint": "場景記錄表槽位 13（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『隊長,我在這群人中發現一個通緝犯,但他的主人拒絕讓我們逮捕他。』"}, {"k": "slot", "name": "場景#8", "hint": "場景記錄表槽位 8（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『那就全部抓起來!拒捕者格殺勿論!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『看來我們又有麻煩了,索爾,怎麼辦？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這些士兵也太蠻橫了!亞雷斯,我們上!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『這下子想不打都不行噫!』"}]}, {"sub": 1, "sp": [{"k": "slot", "name": "場景#8", "hint": "場景記錄表槽位 8（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『看你們的身手不像是普通人,你們到底是誰？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『剛剛說過了,我們只是普通了旅行者罷了』"}, {"k": "slot", "name": "場景#8", "hint": "場景記錄表槽位 8（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『不可能!你們絕對不是普通的旅行者!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『信不信由你了!』"}]}, {"sub": 2, "sp": [{"k": "slot", "name": "場景#8", "hint": "場景記錄表槽位 8（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『可恨!這些人還真強!,弟兄們再撐一會兒萊汀大人就來了,再撐一會兒!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『看他們的樣子似乎還有援軍!大家,先把小隊長打倒吧!』"}]}, {"sub": 3, "sp": [{"k": "id", "name": "萊汀", "hint": "角色 id 118（萊汀）", "ck": 118, "t": "『小隊長,這是怎麼一回事？』"}, {"k": "slot", "name": "場景#8", "hint": "場景記錄表槽位 8（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『萊.萊汀大人!這一群匪徒公然拒捕,他們戰技高超,我們正嘗試要拿下他.』"}, {"k": "id", "name": "萊汀", "hint": "角色 id 118（萊汀）", "ck": 118, "t": "『原來不過是些匪徒而已,通通給我抓起來!』"}]}, {"sub": 4, "sp": [{"k": "slot", "name": "場景#8", "hint": "場景記錄表槽位 8（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『你.你們不是一般匪徒,你們.到底有何目的？.』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這一切只是誤會而已,我們—』"}]}, {"sub": 5, "sp": [{"k": "slot", "name": "場景#33", "hint": "場景記錄表槽位 33（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『隊.隊長!這.這是怎麼回事？!』"}, {"k": "slot", "name": "場景#8", "hint": "場景記錄表槽位 8（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『史恩!快去通報邊境守衛隊,叫他們追捕這批匪徒,我.我已經盡力了..』"}, {"k": "slot", "name": "場景#33", "hint": "場景記錄表槽位 33（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『隊.隊長!你放心,這件事我一定辦到!』"}]}, {"sub": 6, "sp": [{"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『天啊!你們居然攻擊王國派來的調查隊,還把小隊長給殺了,難道你們不怕被全王國軍通緝嗎？』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『這只是一場誤會,可是他們不肯聽我們解釋..』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『唉,現在說什麼都沒用啦!你們到底是來幹什麼的？』"}, {"k": "id", "name": "瑪琳", "hint": "角色 id 10（瑪琳）", "ck": 10, "t": "『我們來此找賢者約拿.』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『你們是來找約拿的？約拿兩天前就已經離開此地了。』"}, {"k": "id", "name": "瑪琳", "hint": "角色 id 10（瑪琳）", "ck": 10, "t": "『為什麼？聽說他近年來很少離開普里茲港的啊!』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『是沒錯。不過這個港城最近夜裡發生不少樁失蹤事件,狀況嚴重到連王國都派守備隊來調查了,想必你們還不知道吧!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『怪不得碼頭一帶到處都是士兵。』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『我叫做貝克威,和約拿算是滿熟的朋友。前兩天他來找我,說他發現一件大陰謀,和連日來的失蹤事件有關,必須立刻前去調查。他委託我一些事之後就離開了.』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『真倒楣,那這趙不就又白跑了嗎？還因此和王國軍結了怨.』"}, {"k": "id", "name": "瑪琳", "hint": "角色 id 10（瑪琳）", "ck": 10, "t": "『你是在指我嗎？這又不全是我的錯!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『妳還敢說,要不是因為妳爸爸派給妳的護衛.』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『好啦好啦!吵架解決不了事情,這樣吧,約拿約了我兩天後到亞克斯王國的王城去和他碰面,既然你們有事找他,就和我一起去好了。』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『嗄？到王城去？那我們不是自投羅網嗎？』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『這個你們倒可以不用擔心,我保證一定不會有事的。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『希莉亞,妳為什麼敢做這種保證？』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『這是秘密,不告訴你!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『好,既然如此,我們就準備上路吧!貝克威先生,您怎樣呢？』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『先和我回城裏一趙,等我收拾一下東西,待會兒就可以啟程了。走吧!』"}]}, {"sub": 7, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『奈野啊捏？』"}]}]}, {"res": 7, "n": 6, "head": "這條路是通往王城的要道,雖然走這條路較快,但遇到王國", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『這條路是通往王城的要道,雖然走這條路較快,但遇到王國守備軍的機會也較高..』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『你說的沒錯,我已經看到了。』"}]}, {"sub": 1, "sp": [{"k": "id", "name": "突擊騎兵", "hint": "角色 id 83（突擊騎兵）", "ck": 83, "t": "『前面那批人一定就是在普里茲港逞凶的匪徒,通通給我拿下!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『等等,大家都是自己人,這是一場誤會..』"}, {"k": "id", "name": "突擊騎兵", "hint": "角色 id 83（突擊騎兵）", "ck": 83, "t": "『少玩弄詭計想拖延時間了。乖乖的受死吧!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『唉,說不通,只好先打再說了。索爾,我們上!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『啊？我沒問題,妳自己可要小心點,不要太勉強!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『索爾,謝謝你!』"}]}, {"sub": 2, "sp": [{"k": "id", "name": "凱麗", "hint": "角色 id 12（凱麗）", "ck": 12, "t": "『哎呀!一大群男人追殺一個小姑娘,不覺得丟臉嗎？』"}, {"k": "slot", "name": "場景#34", "hint": "場景記錄表槽位 34（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『妳的一拳讓我的部下得療養三個月,無故毆打王國駐軍可是重罪,乖乖的跟我回去說個明白吧!』"}, {"k": "id", "name": "凱麗", "hint": "角色 id 12（凱麗）", "ck": 12, "t": "『誰教他對我亂瞄!你們王國軍都是這個樣子的嗎？』"}, {"k": "slot", "name": "場景#34", "hint": "場景記錄表槽位 34（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『哼..不和妳吵了,給我抓起來!』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『唉!那邊有王國軍在圍攻一個小女孩,這是怎麼一回事？』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『喂,我們自己都顧不了了,不要再去湊熱鬧..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『什麼!你能眼睜睜的看著一群王國軍欺負一個小女孩？我自己去收拾他們好了。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『好啦好啦,我陪你去就是了,反正不差這幾個..』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『好吧,那就上吧!』"}]}, {"sub": 3, "sp": [{"k": "slot", "name": "場景#33", "hint": "場景記錄表槽位 33（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『可惡.國王陛下,我不能再護衛您了.請原諒屬下的無能.』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『你弄錯了,我們不是來加害國王的!』"}, {"k": "slot", "name": "場景#33", "hint": "場景記錄表槽位 33（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『是嗎？.那麼.前些日子到底是誰..啊..』"}]}, {"sub": 4, "sp": [{"k": "id", "name": "凱麗", "hint": "角色 id 12（凱麗）", "ck": 12, "t": "『多謝你們的幫忙!連王國的精銳部隊也不是你們對手,你們到底是什麼來歷？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這個說起來很麻煩,此地又很危險,我看妳還是回家睡覺好了。』"}, {"k": "id", "name": "凱麗", "hint": "角色 id 12（凱麗）", "ck": 12, "t": "『什麼,你竟敢小看我!若是聽到我老師的名字,包準你嚇一大跳..』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『凱麗小姐,妳的身手的確是很不錯,可以請問妳的老師是哪一位嗎？』"}, {"k": "id", "name": "凱麗", "hint": "角色 id 12（凱麗）", "ck": 12, "t": "『這個.還是不能告訴你!不過,如果你們願意讓我加入的話,我可以考慮透露一點。』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『歡迎!我們就要和王國軍大戰,正愁人手不夠,有妳加入真是再好不過了。』"}, {"k": "id", "name": "凱麗", "hint": "角色 id 12（凱麗）", "ck": 12, "t": "『以後我們就是伙伴了,請大家多多指教!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『此地不宜久留,凱麗小姐,我們這就上路吧!』"}]}, {"sub": 5, "sp": [{"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『看來我們又被人家誤會了,索爾,現在我們該怎麼辦？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『那還用說,當然是殺進王城去弄個明白!』"}, {"k": "id", "name": "瑪琳", "hint": "角色 id 10（瑪琳）", "ck": 10, "t": "『.,夠氣魄!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『我們快上路吧!這件事不弄個清楚,更麻煩的事還在後頭呢!』"}]}]}, {"res": 8, "n": 5, "head": "看!城堡就在眼前了!", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『看!城堡就在眼前了!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『可是,我們一路上居然都沒遇到敵軍,莫非..』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『你說對啦,他們都在這裡等我們呢!』"}, {"k": "id", "name": "突擊騎兵", "hint": "角色 id 83（突擊騎兵）", "ck": 83, "t": "『大膽的盜匪,不管你們有多厲害,這裡就是你們的葬身之處了!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『等等!大家聽我說,不要再打了!我們不是敵人..』"}, {"k": "id", "name": "突擊騎兵", "hint": "角色 id 83（突擊騎兵）", "ck": 83, "t": "『你們以為這種話我會相信？你們當我是白癡嗎？』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『無禮者!好吧,你瞧瞧這是什麼？』"}, {"k": "id", "name": "突擊騎兵", "hint": "角色 id 83（突擊騎兵）", "ck": 83, "t": "『唉!這是.這是歷代王后所擁有的「女神之淚」首帥!這首帥應該是在公主的手中,難道..』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『沒錯,我就是亞克斯王國的公主希莉亞,我以公主之名命令你們立刻收起武器!』"}, {"k": "id", "name": "突擊騎兵", "hint": "角色 id 83（突擊騎兵）", "ck": 83, "t": "『可.可是.殿下您們攻擊我軍的探查隊與士兵,此事證據確鑒,為何殿下您會.』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『我們和他們間發生了點誤會這些士兵極為蠻橫,不肯聽我說明,只好先把他們打發掉啦!』"}, {"k": "id", "name": "洛娜", "hint": "角色 id 5（洛娜）", "ck": 5, "t": "『隊長,這的確是公主殿下沒錯!我們先迎接公主進城,餘事以後再說..』"}, {"k": "id", "name": "突擊騎兵", "hint": "角色 id 83（突擊騎兵）", "ck": 83, "t": "『這.這怎麼行!陛下親自吩咐,要我把這些亂黨消滅,我若沒有做到,就是違抗王命!』"}, {"k": "id", "name": "洛娜", "hint": "角色 id 5（洛娜）", "ck": 5, "t": "『可是..』"}, {"k": "id", "name": "突擊騎兵", "hint": "角色 id 83（突擊騎兵）", "ck": 83, "t": "『不用多說了!誰敢違抗王命,一律殺無赦!弟兄們上啊!』"}]}, {"sub": 1, "sp": [{"k": "id", "name": "洛娜", "hint": "角色 id 5（洛娜）", "ck": 5, "t": "『公主,妳放心!我身為史卡迪家的人,一定會捨命保護妳的!』"}, {"k": "id", "name": "突擊騎兵", "hint": "角色 id 83（突擊騎兵）", "ck": 83, "t": "『洛娜,妳竟敢違逆我的命令!妳也準備死吧!』"}]}, {"sub": 2, "sp": [{"k": "id", "name": "突擊騎兵", "hint": "角色 id 83（突擊騎兵）", "ck": 83, "t": "『公主殿下..屬下也是遵命行事,冒犯之處,請您原諒..啊..』"}]}, {"sub": 3, "sp": [{"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『唉!事情為什麼會變成這樣..我得去見父王一面,把事情弄個清楚才行。』"}, {"k": "id", "name": "洛娜", "hint": "角色 id 5（洛娜）", "ck": 5, "t": "『公主殿下,現在宮中情勢混亂,請容屬下隨行,以保護殿下的安全。』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『剛才妳說妳是史卡迪家的人..可是指騎士世家的史卡迪家族？』"}, {"k": "id", "name": "洛娜", "hint": "角色 id 5（洛娜）", "ck": 5, "t": "『是的!我史卡迪家的族人世代都擔負保護王族的使命,如今雖然我家族只剩下我一個人,屬下仍會盡忠職守,誓以性命保護殿下的安全。』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『我明白了,妳就跟我來吧..索爾,亞雷斯,以後我還要借重你們的力量,你們也和我一起進城吧!』"}]}, {"sub": 4, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『希莉亞..是王國公主？那悠妮的身份又是怎麼一回事？』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『很簡單,是我們搞錯啦。現在該怎麼辦？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『事到如今,也只有跟著希莉亞進去看看了。走吧!』"}]}]}, {"res": 9, "n": 5, "head": "希莉亞,看來妳父王的大軍已經在等我們了!", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『希莉亞,看來妳父王的大軍已經在等我們了!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『放心,交給我就是了。』"}]}, {"sub": 1, "sp": [{"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『殿下,以您王國公主的身份怎可和這些盜匪為伍？陛下已下令逮捕這幫盜賊,讓屬下迎接殿下回宮,這些盜匪交給禁衛軍處理就可以了。』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『萊汀,我一直以為你是個聰明人,難道連你也不相信我嗎？趕快把這些禁衛軍撤走我要去見父王,把事情說個清楚。』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『公主殿下,陛下有令在先,把這幫匪徒通通抓起來再說,如果您還是要護著他們的話,那屬下就得罪了。』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『萊汀,你敢對我動手!』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『公主殿下,請原諒屬下的無禮。來人,把這群盜匪都給我抓起來!』"}]}, {"sub": 2, "sp": [{"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『唔.公主殿下,您為何.為何要帶這些人來加害陛下..』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『萊汀,我怎麼會想要加害父王!宮中到底發生了什麼事？』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『.前幾天有刺客夜襲陛下的寢宮,想要抓走陛下,幸好打鬥聲驚動了侍衛,衛兵衝進來救駕,陛下才悴免於難.』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『有這種事？!說下去!』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『刺客臨走前還揚言,幾天之內一定會再來..陛下遭到這種驚嚇,幾天來一直在床上休養.』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這件事又為何會扯到我們身上？』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『為了搜查可疑份子,我們在王國各地派出調查隊,結果又發現了不少怪事,例如普里茲港的失蹤事件,而你們又惹上了調查隊,結果.』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『大臣們一致認為我們就是刺客？這太荒謬了!』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『葛雷大人相當支持這種說法所以命令我們禁衛軍派兵攻擊你們..』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『不是父王下令的嗎？怎麼又變成葛雷了？』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『陛下多日來一直臥病在床,軍令方面都是經由葛雷大人發佈.』"}]}, {"sub": 3, "sp": [{"k": "slot", "name": "場景#34", "hint": "場景記錄表槽位 34（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『禁衛軍隊長萊汀,想不到你竟敢和盜匪勾結,我們奉葛雷大人之命將你逮捕!趕快束手就擒吧!』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『可惡,我明白了,葛雷這個該死的叛徒..』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『萊汀,照這樣看來,父王處境危險,我們先設法殺進去再說!』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『殿下,屬下被奸人所騙,有負保護陛下的使命,請讓屬下和你們一起去!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『你受傷這麼重,還是先..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『喂!希莉亞,現在情況緊急我看這傢伙蠻能打的,叫瑪琳用法術給他治一下傷就可以上陣了,應該可以多少幫上點忙吧!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『索爾,你說話也客氣點..』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『公主殿下,請給屬下一個將功購罪的機會!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這不就好了嗎？』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『好吧,容我再借重一次大家的力量!我們上!』"}]}, {"sub": 4, "sp": [{"k": "id", "name": "士兵", "hint": "角色 id 76（士兵）", "ck": 76, "t": "『不得了了!葛雷大人被殺了!』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『把話講清楚一點!倒底是怎麼一回事？』"}, {"k": "id", "name": "士兵", "hint": "角色 id 76（士兵）", "ck": 76, "t": "『我.我是葛雷大人房外的衛兵,剛才忽然聽到房內傳出一陣慘叫聲,我衝進去一看葛雷大人已經倒在地上不省人事了..』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『有這種事!公主殿下,看來王城內情勢險惡,我先進去探查一番,再回來向殿下報告!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『小心點!』"}]}]}, {"res": 10, "n": 6, "head": "哇塞,好大的洞窟!", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『哇塞,好大的洞窟!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『若沒有人提供消息的話還真想不到瀑布後面會有這麼一個地方呢!』"}, {"k": "id", "name": "萊汀", "hint": "角色 id 6（萊汀）", "ck": 6, "t": "『公主殿下,屬下已將事情查清楚了,禁衛軍統領葛雷和敵方勾結,他想謀害陛下然後自立為王。事實上,陛下在那一睌遇襲時就已經被擄走了,之後葛雷就偽稱陛下在寢宮中養傷,然後假借陛下的名義發號施令。』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『他還想藉著我們惹上王國軍的機會,利用你們把我除掉,以後他就可以高枕無憂了。』"}, {"k": "id", "name": "萊汀", "hint": "角色 id 6（萊汀）", "ck": 6, "t": "『都怪屬下愚昧。還好葛雷的一名手下曾替他傳遮信件到此地,我們才能找到這個所在,相信陛下可能被軟禁在此地。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『那還等什麼？我們快把那個作怪的傢伙找出來痛打一頓,這件事就可以做個了結了。』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『不知死活的傢伙們,你們真是天真的可以!』"}, {"k": "id", "name": "萊汀", "hint": "角色 id 6（萊汀）", "ck": 6, "t": "『你就是幕後主使者嗎？快把陛下交還給我們,不然王國禁衛軍是不會放過你的!』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『你是說卡納恩三世那個老頭嗎？別擔心,等我把你們送上西天,我會讓他和你們在天上相見的。哈哈哈哈!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『哼,難看的傢伙,先打上一場再來說大話吧!』"}, {"k": "id", "name": "萊汀", "hint": "角色 id 6（萊汀）", "ck": 6, "t": "『敵人數量不少,大家小心應戰!援軍很快就會到了,所以大家量力而為,不要太勉強!』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『儘管放馬過來吧!今天你們一個都別想活著出去!哇哈哈哈!』"}]}, {"sub": 1, "sp": [{"k": "id", "name": "騎兵", "hint": "角色 id 69（騎兵）", "ck": 69, "t": "『萊汀大人!屬下來遲了真是罪該萬死..』"}, {"k": "id", "name": "萊汀", "hint": "角色 id 6（萊汀）", "ck": 6, "t": "『沒關係!陛下確是被軟禁在此,憑著王國禁衛軍的名譽,大家要努力作戰,將陛下平安救回!』"}, {"k": "id", "name": "騎兵", "hint": "角色 id 69（騎兵）", "ck": 69, "t": "『遵命!』"}]}, {"sub": 2, "sp": [{"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『我不得不承認,你們比我預想的還難纏,不過我沒有耐性再和你們玩下去了,來人,殺了卡納恩三世。』"}]}, {"sub": 3, "sp": [{"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『.怎.怎麼可能.我居然被你們這些無名小卒給打敗了.主人.救救我.』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『少討斃了!快告訴我們,你綁架國王、惹起這一切事端究竟有何目的？』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『.為了.為了得到王家的至寶「黃金徽章」.那是.』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『怎樣!快說啊!』"}, {"k": "slot", "name": "場景#11", "hint": "場景記錄表槽位 11（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『.飛天的.戰車.鑰匙.啊..』"}]}, {"sub": 4, "sp": [{"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『父王,您沒事吧!我好擔心..』"}, {"k": "slot", "name": "場景#50", "hint": "場景記錄表槽位 50（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『乖女兒放心,我平安無事。這可要多謝妳的朋友們,不然這回我真的是難逃劫數了。』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『國王陛下,令我們納悶的是敵方為何要對您下手？您可知道其中的原因？』"}, {"k": "slot", "name": "場景#50", "hint": "場景記錄表槽位 50（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『簡單來說,他們是為了王家至寶「黃金徽章」。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『黃金徽章？那是什麼？』"}, {"k": "slot", "name": "場景#51", "hint": "場景記錄表槽位 51（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『這個就讓我來回答吧。黃金徽章是亞克斯王家的祖傳之寶,據說它有著莫大的神秘力量,所以幾代以來都一直小心的收藏著,但是它究竟有什麼功用,也一直都沒有人知道。』"}, {"k": "slot", "name": "場景#50", "hint": "場景記錄表槽位 50（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『他們把我綁到這裡來,就是要逼我交出黃金徽章。後來我被拷問得受不了了,終於告訴他們黃金徽章的所在,還連累了執掌神殿的索菲亞..』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『原來如此。約拿果然料得沒錯..』"}, {"k": "slot", "name": "場景#51", "hint": "場景記錄表槽位 51（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『賢者約拿？你認識他嗎？』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『我和他算是舊識了,這回就是他要我到王城和他碰面,才會遇上這些事情的。』"}, {"k": "slot", "name": "場景#51", "hint": "場景記錄表槽位 51（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『前幾天他也曾經來找我,他說幾天後會有一個朋友來王城找他,希望我能把黃金徽章借給他,看來他說的就是你了。』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『妳果然見過約拿!那麼.黃金徽章的事,妳能夠答應嗎？』"}, {"k": "slot", "name": "場景#51", "hint": "場景記錄表槽位 51（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『這要看陛下的決定..』"}, {"k": "slot", "name": "場景#50", "hint": "場景記錄表槽位 50（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『沒關係,我早已聽說過賢者約拿的大名,他要借用黃金徽章,一定是有重要的用途索菲亞,等我們回城後,便把黃金之徽交給他。』"}, {"k": "slot", "name": "場景#51", "hint": "場景記錄表槽位 51（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『陛下,我有一個請求,希望您也能一併答應..』"}, {"k": "slot", "name": "場景#50", "hint": "場景記錄表槽位 50（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『什麼請求？』"}, {"k": "slot", "name": "場景#51", "hint": "場景記錄表槽位 51（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『據約拿所言,最近有邪惡之徒正在進行一樁陰謀,他自己先動身去調查此事,但希望我也能前去幫忙,貢獻我自己對神的虔誠與神聖的力量,來阻止邪徒的惡行。所以我可能不能再擔任神殿司祭一職,請陛下您答應..』"}, {"k": "slot", "name": "場景#50", "hint": "場景記錄表槽位 50（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『這樣嗎？好吧,我也不能勉強妳..妳就去吧!要好好保重!』"}, {"k": "slot", "name": "場景#51", "hint": "場景記錄表槽位 51（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『感激不盡!願聖靈與陛下同在!』"}]}, {"sub": 5, "sp": [{"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『父王,我也有一個請求..』"}, {"k": "slot", "name": "場景#50", "hint": "場景記錄表槽位 50（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『希莉亞,難道妳也..』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『父王,這些天來,我都和這些朋友們一起冒險,覺得自己長大了不少。如今邪徒的陰謀已經威脅到我們亞克斯王國,我身為王國第一公主跟著他們去冒險,多少也可以盡一點責任..』"}, {"k": "slot", "name": "場景#50", "hint": "場景記錄表槽位 50（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『.希莉亞,妳瘦了不少,這些天來吃了不少苦吧？』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『不會啊,大家都對我很好,和敵人戰鬥時,索爾和亞雷斯也總是擋在我前面,不讓我受到傷害。』"}, {"k": "slot", "name": "場景#50", "hint": "場景記錄表槽位 50（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『這樣嗎？索爾,亞雷斯,多謝你們照顧我的女兒,如果時間充裕的話,希望能有機會好好謝謝你們。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『多謝陛下,我們不敢當。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『是呀!想當初我們就沒料到希莉亞會是公主..』"}, {"k": "slot", "name": "場景#50", "hint": "場景記錄表槽位 50（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『哈哈哈!希莉亞,妳的保密功夫還真到家。我答應妳的請求,不過為了妳的安全起見,由禁衛隊長萊汀與妳隨行,妳沒有異議吧？』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『沒有,沒有!謝謝父王!』"}, {"k": "id", "name": "萊汀", "hint": "角色 id 6（萊汀）", "ck": 6, "t": "『屬下必以生命保護公主,請陛下放心。』"}, {"k": "slot", "name": "場景#50", "hint": "場景記錄表槽位 50（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『好!其他的事,等我們回到城中再說,我們趕快離開這個陰森的洞窟。』"}, {"k": "id", "name": "萊汀", "hint": "角色 id 6（萊汀）", "ck": 6, "t": "『屬下這就安排禁衛軍前來迎接。諸位,我們走吧!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『看來事情越鬧越大了。索爾,這場熱鬧我們還要繼續湊下去嗎？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『不管怎樣,先找到賢者約拿治好悠妮的失憶症再說。亞雷斯,你會幫我吧!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『那還用說!我們走吧!』"}]}]}, {"res": 11, "n": 4, "head": "索菲亞,妳確定約拿是往這裡走的嗎？", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『索菲亞,妳確定約拿是往這裡走的嗎？』"}, {"k": "id", "name": "索菲亞", "hint": "角色 id 11（索菲亞）", "ck": 11, "t": "『他說他會一路往北,經由冰海的冰原到黑森林去,走這段行程的話,我想這條路應該不會錯.』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『不知怎的,我總覺得氣氛不大對.會不會是走錯路了？』"}, {"k": "id", "name": "索菲亞", "hint": "角色 id 11（索菲亞）", "ck": 11, "t": "『..這附近的景色看起來是頗為陌生。早知道不該抄近路的..』"}, {"k": "id", "name": "洛娜", "hint": "角色 id 5（洛娜）", "ck": 5, "t": "『小心!附近有人!』"}, {"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『吼嗚!.我看到前面有人類!怎麼辦？』"}, {"k": "slot", "name": "場景#17", "hint": "場景記錄表槽位 17（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『呼.知道這裡有寶物的應該只有我們啊!』"}, {"k": "slot", "name": "場景#19", "hint": "場景記錄表槽位 19（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『吼.管他的,妨礙我們的都得死!』"}, {"k": "slot", "name": "場景#21", "hint": "場景記錄表槽位 21（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『對!先宰了他們再說!』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『麻煩了,這種獸人低智商又不講理,我們準備應戰吧!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『不過,他們提到的寶物是什麼？』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『不知道。此地應該離艾爾夫森林不遠,可是這裡的景色我郎從未看過..』"}]}, {"sub": 1, "sp": [{"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『唉？你不是貝克威嗎？你怎麼會跑到這裡來了？』"}]}, {"sub": 2, "sp": [{"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『妳是以前住在我家隔壁的珊嘛!好久不見啦,聽說妳後來跟著大法師穆勒學法術去了.對了,妳在這裡幹什麼？』"}, {"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『這裡就是我們精靈族歷代長老的藏寶之處,以前叫做「迷霧森林」的地方.』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『對,我想起來了.這裡一向有大霧籠罩,我們從小就被告誡不準接近..這又怎麼了？』"}, {"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『最近天地異變,千年來保護此地的結界不知怎的失效了,這些獸人得知此地有寶物,就伺機前來搶奪。』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『有這種事!』"}, {"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『吼..原來這些人都是妳帶來的!都給我一起殺了!』"}, {"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『貝克威,和我一起保護這些寶物吧!至少不要讓它們落入獸人的手中..』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『可是我們還要趕路..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『沒關係,趁此機會活動活動筋骨,也沒什麼不好啊!』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『謝了,索爾!珊,妳要多小心點!』"}, {"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『不要緊,我躲在你後面就可以了,我知道你會保護我的!』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『說不過妳..好,大家上吧!』"}]}, {"sub": 3, "sp": [{"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『有賴各位的幫助,終於把這些獸人驅離此地..我代表精靈族謝謝各位。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『小事一樁!對了,貝克威先生,你難得遇見一個童年舊友,不留下來和她..好好聚聚嗎？』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『約拿囑咐的事情非常緊急雖然這愛爾夫森林是我的家鄉,我想我沒時間在此停留.』"}, {"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『非常緊急的事？快告訴我!一定很有趣吧!』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『珊!這是很正經的事,可不是小孩時代的玩意.』"}, {"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『什麼!你以為我在開玩笑!好,我就和你一起去一趙,看看到底是什麼大事!』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『別亂來!這趙旅程相當危險,妳還是乖乖待在這裡.』"}, {"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『既然旅程危險,我就不會擔心你嗎？至少我也是大法師穆勒的高徒耶!』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『唉!說不過妳..反正妳在家鄉八成也一樣不安分,就跟著我去好啦!』"}, {"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『太棒了,謝謝你!我叫做珊,請大家以後多多指教!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『歡迎加入!那麼,現在請妳當嚮導帶我們走過這片森林吧!』"}, {"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『沒問題!大家跟我來吧!』"}]}]}, {"res": 12, "n": 5, "head": "過了這山道,就到我們位在北森林的城鎮了。你們可以先在", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『過了這山道,就到我們位在北森林的城鎮了。你們可以先在那裡休息一下..』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『瞧,前面有人呢!』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『唉？又是一大群獸人,還有..』"}, {"k": "id", "name": "米亞斯多德", "hint": "角色 id 17（米亞斯多德）", "ck": 17, "t": "『哎呀,有救了有救了!救命啊!』"}, {"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『你為什麼會被獸人追殺呢？我好想知道,趕快告訴我!』"}, {"k": "id", "name": "米亞斯多德", "hint": "角色 id 17（米亞斯多德）", "ck": 17, "t": "『如果你能打敗這些獸人救我一命,我不但告訴你為什麼還可以額外告訴你一個大秘密!』"}, {"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『呀!聽起來很有趣,我答應..』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『喂!不要給大夥兒找麻煩..』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『沒關係,反正我們急著要過這山道,順便擺平這些獸人也沒什麼不好。索爾,我說的沒錯吧？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『亞雷斯,你越來越睬解我了不過何必這麼囉唸—咱們說上就上!殺啊!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『這小子真是..』"}]}, {"sub": 1, "sp": [{"k": "slot", "name": "場景#15", "hint": "場景記錄表槽位 15（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『可惡.但是還沒有結束..』"}]}, {"sub": 2, "sp": [{"k": "id", "name": "米亞斯多德", "hint": "角色 id 17（米亞斯多德）", "ck": 17, "t": "『..我不甘心..寶石的秘密....啊..』"}]}, {"sub": 3, "sp": [{"k": "id", "name": "米亞斯多德", "hint": "角色 id 17（米亞斯多德）", "ck": 17, "t": "『我叫做米亞斯多德。感謝各位的幫忙,我才能撿回一命。』"}, {"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『米亞.好囉唸的名字,你不是說,救了你你就會告訴我們什麼大秘密嗎？快說吧!』"}, {"k": "id", "name": "米亞斯多德", "hint": "角色 id 17（米亞斯多德）", "ck": 17, "t": "『嘿,其實這個秘密你們不一定會有興趣,不過我還是說出來好了。昨天夜裡我偷聽到獸人部隊的談話,牠們要進攻精靈城鎮哈斯米爾..』"}]}, {"sub": 4, "sp": [{"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『什麼!那不是我們的故鄉嗎？』"}, {"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『糟了,我們要趕快回去擎告鎮民們才行!』"}, {"k": "id", "name": "索菲亞", "hint": "角色 id 11（索菲亞）", "ck": 11, "t": "『哈斯米爾不是位在北森林的精靈都城嗎？這可奇怪了獸人族什麼時候有膽量攻打精靈族了？』"}, {"k": "id", "name": "米亞斯多德", "hint": "角色 id 17（米亞斯多德）", "ck": 17, "t": "『但我確實看到相當龐大的獸人部隊集結,牠們總該不是在大露營吧？』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『這不重要,我們趕快前往哈斯米爾,幫精靈族打退獸人大軍。』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『不好意思,這回又要麻煩你們了..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『既然是朋友的事,我們怎能袖手旁鶴呢!我們快上路吧,要不然就真的來不及了!』"}]}]}, {"res": 13, "n": 12, "head": "糟了!我們果然來遲了一步!", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『糟了!我們果然來遲了一步!』"}, {"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『不要緊,村中的居民好像都已經先撤走了,只剩下一些戰士還在抵擋獸人的攻勢..』"}, {"k": "id", "name": "米亞斯多德", "hint": "角色 id 17（米亞斯多德）", "ck": 17, "t": "『好極了,寶箱好像都還安然無恙,不知道「火焰之眼」是否..』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『你說什麼？』"}, {"k": "id", "name": "米亞斯多德", "hint": "角色 id 17（米亞斯多德）", "ck": 17, "t": "『.沒事!沒事!我們趕快去幫忙吧!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『沒錯!把那些獸人殺個落花流水!我們上吧!』"}]}, {"sub": 1, "sp": [{"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『我的天啊!這是怎麼一回事？』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『老.老爹!您怎麼來了？』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『怎麼？我不能來嗎？我只是來看個老朋友而已.怎麼會變成這樣子？』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『獸人大軍來攻,村內的居民好像都逃光了,我們正在迎戰敵軍..』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『獸人？這些傢伙是活的不耐煩了？我先來給牠們幾斧頭再說!小子啊,你也要好好幹!』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『是的,老爹!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『哈瓦那老爹,歡迎加入!』"}]}, {"sub": 2, "sp": [{"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『.啊,我年紀畢竟是老了,不能太逞強..哈諾,以後你要自己照顧自己了,老爹.不行了..』"}]}, {"sub": 3, "sp": [{"k": "slot", "name": "場景#15", "hint": "場景記錄表槽位 15（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『啊..』"}]}, {"sub": 4, "sp": [{"k": "slot", "name": "場景#17", "hint": "場景記錄表槽位 17（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『你們消滅不了精靈族的..啊..』"}]}, {"sub": 5, "sp": [{"k": "slot", "name": "場景#19", "hint": "場景記錄表槽位 19（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『哇啊..』"}]}, {"sub": 6, "sp": [{"k": "slot", "name": "場景#21", "hint": "場景記錄表槽位 21（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『啊..』"}]}, {"sub": 7, "sp": [{"k": "slot", "name": "場景#23", "hint": "場景記錄表槽位 23（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『哇啊..』"}]}, {"sub": 8, "sp": [{"k": "id", "name": "獸人隊長", "hint": "角色 id 103（獸人隊長）", "ck": 103, "t": "『吼嗚!宰了這些傢伙..』"}]}, {"sub": 9, "sp": [{"k": "id", "name": "精靈", "hint": "角色 id 72（精靈）", "ck": 72, "t": "『你們不是貝克威和珊嗎？還有好久不見的哈瓦那老爹幸好你們帶了幫手來,要不然我們真會抵擋不住了。』"}, {"k": "id", "name": "精靈", "hint": "角色 id 72（精靈）", "ck": 72, "t": "『不過,你們又怎麼會知道獸人大軍前來攻擊呢？』"}, {"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『湊巧啦!還好這些朋友願意幫忙。城中的居民呢？』"}, {"k": "id", "name": "精靈", "hint": "角色 id 72（精靈）", "ck": 72, "t": "『我們事先收到擎告,居民都連夜撤到安全的地方去了。不過聽說獸人大軍還在離哈斯米爾不遠的蘭迪平原駐紮眼前情勢仍然很險惡..』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『對了,獸人大軍為何要攻打哈斯米爾？我到現在還是不明白。』"}, {"k": "id", "name": "精靈", "hint": "角色 id 72（精靈）", "ck": 72, "t": "『這一點我們也不清楚,不過牠們在開戰前曾大聲宣言,要把精靈族殺戮殆盡,為何如此我們並不清楚..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『還不簡單!獸人大軍現在不是駐紮在那個什麼平原嗎？我們去把他們殺個人仰馬翻,再抓幾個來問問不就好了？』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『典型的索爾作風..不過也不失為一個好方法。』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『是啊,讓那些獸人繼續待在那裡太危險了,先把牠們在野外殲滅,免得牠們又來進攻。』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『正好老爹也來了,我們的戰力大增,要對付那些獸人相信不是難事。老爹,你會和我們一起去吧!』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『當然!就這幾隻獸人,那能讓我過癲呢!再說,我也想看看這些日子以來,小子長進了多少。哈哈哈!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『既然如此,那我們稍事休息之後就出發吧!』"}]}, {"sub": 10, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『糟糕,精靈們全被消滅了!』"}]}, {"sub": 11, "sp": [{"k": "keep", "name": "〃", "hint": "沿用上一位（FACE_KEEP=39）", "ck": "keep", "t": "『年輕人,你們年紀輕輕就有這種武藝,真是了不起!這件重要的寶物絕不能讓它落入獸人的手中,就先拜託你保管了..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『好的!這是..』"}, {"k": "keep", "name": "索爾", "hint": "沿用上一位（FACE_KEEP=39）", "ck": "keep", "t": "『你會發現它的功用的,代替我好好的使用它吧!』"}]}]}, {"res": 14, "n": 4, "head": "看到了!那裡有一大群獸人,好像還在休息呢!", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "凱麗", "hint": "角色 id 12（凱麗）", "ck": 12, "t": "『看到了!那裡有一大群獸人,好像還在休息呢!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『好極了,我們去叫醒牠們!』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『別太猴急,小子!我們先小心接近,再伺機而動!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『好,我們上吧!』"}]}, {"sub": 1, "sp": [{"k": "slot", "name": "場景#32", "hint": "場景記錄表槽位 32（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『吼嗚!注意,有人接近了!』"}, {"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『通通給我醒來!開打了!』"}, {"k": "slot", "name": "場景#17", "hint": "場景記錄表槽位 17（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『唉？對手呢？怎麼都是一堆小鬼頭..』"}, {"k": "slot", "name": "場景#18", "hint": "場景記錄表槽位 18（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『管他的,知道我們大軍在此集結而還敢接近的,一定不是一般的小鬼,先打了再說!』"}]}, {"sub": 2, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『你們來這裡幹什麼？想要命的話就趕快說!』"}, {"k": "id", "name": "獸人", "hint": "角色 id 102（獸人）", "ck": 102, "t": "『.我.我不知道啊,首領薩卡大人.四天前命令我們在此集結,準備.準備攻打精靈族的都城哈斯米爾,有一隊伙伴已經先去了,到現在還沒回來,結果.結果你們就先來了..』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『笨蛋,那一隊早就被我們宰光了!那麼,你們的首領薩卡為何要攻打哈斯米爾？趕快說清楚!』"}, {"k": "id", "name": "獸人", "hint": "角色 id 102（獸人）", "ck": 102, "t": "『.這.這.我也不太清楚,只記得首領吩咐隊長的時候有提到要殺光精靈族以及務必要搶到寶物,其它的我就沒聽清楚了..』"}, {"k": "id", "name": "米亞斯多德", "hint": "角色 id 17（米亞斯多德）", "ck": 17, "t": "『什麼寶物？』"}, {"k": "id", "name": "獸人", "hint": "角色 id 102（獸人）", "ck": 102, "t": "『.哎,我怎麼可能知道..求你們斃了我吧,我保證不會回去向首領通風報信.』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『好吧,再回答我們一個問題,我們就放你走。你們的首領薩卡現在在哪裡？』"}, {"k": "id", "name": "獸人", "hint": "角色 id 102（獸人）", "ck": 102, "t": "『首領啊.他應該是率領另一隊到拉卡湖去攻打豹人族了如果沒錯的話,他應該還在那一帶才對。..我知道的都告訴你們了可以放我走了吧？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『好,你可以走了!快滾吧!』"}, {"k": "id", "name": "獸人", "hint": "角色 id 102（獸人）", "ck": 102, "t": "『謝.謝謝!』"}]}, {"sub": 3, "sp": [{"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『索爾,你怎麼可以未經大家的同意就放他走呢!』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『不要緊,我們需要的都已經知道了,不過情況好像更加麻煩了..』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『獸人族是吃了什麼熊心豹子膽,竟敢同時攻打精靈族和豹人族!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『我看啊,一定是有人在背後指使,不然獸人族那來這麼大的膽量。』"}, {"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『豹人族的戰鬥力在這大陸的幾個種族中雖然也是數一數二的,但這種規模的攻擊他們也未必擋得住,我們還是先去拉卡湖看看吧,必要時還可以支援他們。』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『拉卡湖離此地不遠,途中好像有個小村落,我們可以先在那裡休息一下。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『那我們還等什麼？走吧!』"}]}]}, {"res": 15, "n": 14, "head": "我看到獸人軍了,他們就位在北方,更遠的地方好像是豹人", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『我看到獸人軍了,他們就位在北方,更遠的地方好像是豹人族的部隊。』"}, {"k": "id", "name": "凱麗", "hint": "角色 id 12（凱麗）", "ck": 12, "t": "『談到豹人,我就想起我的師兄賽可邦勒..唉？那不就是我師兄嗎？』"}, {"k": "id", "name": "凱麗", "hint": "角色 id 12（凱麗）", "ck": 12, "t": "『賽可邦勒師兄!是你嗎？我是凱麗啊!』"}]}, {"sub": 1, "sp": [{"k": "id", "name": "塞可邦勒", "hint": "角色 id 15（塞可邦勒）", "ck": 15, "t": "『誰在叫我？』"}]}, {"sub": 2, "sp": [{"k": "id", "name": "塞可邦勒", "hint": "角色 id 15（塞可邦勒）", "ck": 15, "t": "『唉!是凱麗啊!真是湊巧,怎麼會在這時候遇上妳.』"}, {"k": "id", "name": "凱麗", "hint": "角色 id 12（凱麗）", "ck": 12, "t": "『我聽說獸人大軍攻打豹人族就帶朋友們來幫忙,也沒預想到會在這裡遇到師兄你.』"}, {"k": "id", "name": "塞可邦勒", "hint": "角色 id 15（塞可邦勒）", "ck": 15, "t": "『既然如此,就先謝謝妳了!還有,這批獸人是由其首領薩卡所帶領,你們要特別小心!』"}, {"k": "id", "name": "凱麗", "hint": "角色 id 12（凱麗）", "ck": 12, "t": "『知道了!』"}, {"k": "id", "name": "凱麗", "hint": "角色 id 12（凱麗）", "ck": 12, "t": "『索爾,亞雷斯,大家幫我這個忙好嗎？我一個人是打不過這批獸人大軍的..』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『放心吧,我們本來就是要來幫豹人的,索爾,你說是不是？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『是啊!來這裡不就是要打架的嗎？眼前就有一大堆欠揍的傢伙,還囉唸什麼？我們上吧!』"}, {"k": "id", "name": "凱麗", "hint": "角色 id 12（凱麗）", "ck": 12, "t": "『謝謝大家!』"}, {"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『哼,又有妨礙者了嗎？通通都去死吧!給我殺的一個都不剩!』"}]}, {"sub": 3, "sp": [{"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『我看到獸人軍了,他們就位在北方,更遠的地方好像是豹人族的部隊。』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『看來豹人情勢不妙,我們趕快去助他們一臂之力!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『喂!豹人的老兄們別怕,我們來幫忙了!』"}]}, {"sub": 4, "sp": [{"k": "id", "name": "塞可邦勒", "hint": "角色 id 15（塞可邦勒）", "ck": 15, "t": "『是誰來了？是敵方援軍嗎？』"}]}, {"sub": 5, "sp": [{"k": "id", "name": "塞可邦勒", "hint": "角色 id 15（塞可邦勒）", "ck": 15, "t": "『唉!是一群年輕小伙子..此地戰況險惡,你們來這裡幹什麼？不想受傷就快走吧!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『老兄你心地不錯啊!放心,我們是來幫你們的,這些雜碎交給我們就沒錯啦!』"}, {"k": "id", "name": "塞可邦勒", "hint": "角色 id 15（塞可邦勒）", "ck": 15, "t": "『這樣嗎？看你們信心十足的樣子.好吧,我在此先謝謝你們!此外,這批獸人是由其首領薩卡所帶領,你們要特別小心!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『知道啦!各位,咱們上吧!』"}, {"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『哼,又有妨礙者了嗎？通通都去死吧!給我殺的一個都不剩!』"}]}, {"sub": 6, "sp": [{"k": "id", "name": "塞可邦勒", "hint": "角色 id 15（塞可邦勒）", "ck": 15, "t": "『沒退路了,大家跟他們拼了!』"}]}, {"sub": 7, "sp": [{"k": "slot", "name": "場景#64", "hint": "場景記錄表槽位 64（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『師父,我對不起您..』"}]}, {"sub": 8, "sp": [{"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『就這幾個人還解決不了,第二隊再上!』"}]}, {"sub": 9, "sp": [{"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『.啊.主人,救救我.你答應要給我.給我力量和.永恆的.生命的..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『糟啦,這一下打得太重了些等一下沒人可以問話了,可惜可惜。』"}]}, {"sub": 10, "sp": [{"k": "slot", "name": "場景#74", "hint": "場景記錄表槽位 74（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『哎呀,我們好像來遲啦!』"}, {"k": "slot", "name": "場景#75", "hint": "場景記錄表槽位 75（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『首領命令我們攜帶這批貴重寶物,為了避免引起注意所以繞道而行,遲到也是應該的。』"}, {"k": "slot", "name": "場景#76", "hint": "場景記錄表槽位 76（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『不知道現在戰況如何？』"}, {"k": "slot", "name": "場景#30", "hint": "場景記錄表槽位 30（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『喂!你們不是負責運送寶物的嗎？來這裡幹什麼？』"}, {"k": "slot", "name": "場景#74", "hint": "場景記錄表槽位 74（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『首領吩咐我們帶著東西,到這裡和他們會合..』"}, {"k": "slot", "name": "場景#30", "hint": "場景記錄表槽位 30（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『笨蛋!你沒看到戰況不妙嗎趕快離開這裡,把東西帶到艾斯島去!』"}, {"k": "slot", "name": "場景#74", "hint": "場景記錄表槽位 74（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『.知.知道了!』"}, {"k": "slot", "name": "場景#75", "hint": "場景記錄表槽位 75（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『趕快逃啊!』"}]}, {"sub": 11, "sp": [{"k": "id", "name": "米亞斯多德", "hint": "角色 id 17（米亞斯多德）", "ck": 17, "t": "『唉？這.這不是「光之眼」寶石嗎？為何獸人族也在收集這些東西..』"}, {"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『傳說中的「魔眼寶石」嗎？我聽老師說過,聽說它們有強大的魔力,但這和獸人族有什麼關係？..』"}, {"k": "id", "name": "米亞斯多德", "hint": "角色 id 17（米亞斯多德）", "ck": 17, "t": "『妳也知道嗎？據說它們的價值並不只是魔力而已,而是和一件古代的秘密有很大的關係..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『你們在談些什麼？好像很有趣的樣子!』"}, {"k": "id", "name": "米亞斯多德", "hint": "角色 id 17（米亞斯多德）", "ck": 17, "t": "『不聊了,先把仗打完再說!』"}]}, {"sub": 12, "sp": [{"k": "slot", "name": "場景#64", "hint": "場景記錄表槽位 64（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『感謝各位的協助,我們才能夠抵擋獸人軍的攻勢,我們代表豹人族向各位致上十二萬分的謝意。』"}, {"k": "id", "name": "凱麗", "hint": "角色 id 12（凱麗）", "ck": 12, "t": "『師兄,不用客氣了啦,我這些朋友們都是正義的熱血好漢,他們一路上已經不知道幫了多少人呢。』"}, {"k": "slot", "name": "場景#64", "hint": "場景記錄表槽位 64（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『話雖然這麼說,我還是要謝謝他們。對了,凱麗,妳可有看到獸人的軍隊在其他地方出現？』"}, {"k": "id", "name": "凱麗", "hint": "角色 id 12（凱麗）", "ck": 12, "t": "『有啊!他們先是攻打精靈族的都城哈斯米爾,然後又和我們在蘭迪平原打了一仗,最近獸人都看得都厭了。』"}, {"k": "slot", "name": "場景#64", "hint": "場景記錄表槽位 64（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『有這種事？看來陰謀之說果然是真的。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『什麼意思？』"}, {"k": "slot", "name": "場景#64", "hint": "場景記錄表槽位 64（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『最近我得到消息,說有人在背後操縱黑森林一帶的獸人族和狂戰士,準備要對精靈族和豹人族進行滅族的屠戮行動,我起初還半信半疑,兼程趕回家鄉看看,沒想到就遇上了。』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『我們精靈族也差點慘遭屠戮到底是誰在背後操縱這一切？』"}, {"k": "slot", "name": "場景#64", "hint": "場景記錄表槽位 64（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『這我也不清楚,不過據我那朋友所言,有更大群的獸人和黑暗戰士在北方的冰島一帶集結,她已經先前去調查了,我預計在解決這裡的事情之後,也會儘快趕去和她會合。』"}, {"k": "id", "name": "索菲亞", "hint": "角色 id 11（索菲亞）", "ck": 11, "t": "『.,約拿似乎也是往這個方向而去,看來這些事情似乎有所關連..』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『既然順路的話,那我們就一起去吧!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『就這麼辦吧,我倒想看看到底是誰在搞鬼!走吧!』"}]}, {"sub": 13, "sp": [{"k": "slot", "name": "場景#64", "hint": "場景記錄表槽位 64（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『感謝各位的協助,我們才能夠抵擋獸人軍的攻勢,我們代表豹人族向各位致上十二萬分的謝意。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『小事一樁!正好也可讓我們活動活動筋骨。』"}, {"k": "slot", "name": "場景#64", "hint": "場景記錄表槽位 64（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『話雖然這麼說,我還是要謝謝你們。對了,各位可有看到獸人的軍隊在其他地方出現？』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『有啊!他們先是攻打我們精靈族族的都城哈斯米爾,然後又和我們在蘭迪平原打了一仗,最近獸人真是寬張得不得了。』"}, {"k": "slot", "name": "場景#64", "hint": "場景記錄表槽位 64（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『有這種事？看來陰謀之說果然是真的。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『什麼意思？』"}, {"k": "slot", "name": "場景#64", "hint": "場景記錄表槽位 64（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『最近我得到消息,說有人在背後操縱黑森林一帶的獸人族和狂戰士,準備要對精靈族和豹人族進行滅族的屠戮行動,我起初還半信半疑,兼程趕回家鄉看看,沒想到就遇上了。』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『我們精靈族也差點慘遭屠戮到底是誰在背後操縱這一切？』"}, {"k": "slot", "name": "場景#64", "hint": "場景記錄表槽位 64（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『這我也不清楚,不過據我那朋友所言,有更大群的獸人和黑暗戰士在北方的冰島一帶集結,她已經先前去調查了,我預計在解決這裡的事情之後,也會儘快趕去和她會合。』"}, {"k": "id", "name": "索菲亞", "hint": "角色 id 11（索菲亞）", "ck": 11, "t": "『.,約拿似乎也是往這個方向而去,看來這些事情似乎有所關連..』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『既然順路的話,那我們就一起去吧!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『就這麼辦吧,我倒想看看到底是誰在搞鬼!走吧!』"}]}]}, {"res": 16, "n": 5, "head": "唔,好冷!住慣了羅特帝亞的溫暖氣候,還真有點不習慣。", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『唔,好冷!住慣了羅特帝亞的溫暖氣候,還真有點不習慣。』"}, {"k": "id", "name": "塞可邦勒", "hint": "角色 id 15（塞可邦勒）", "ck": 15, "t": "『不知道我的朋友是否已經抵達此地,照理說應該會有點徵兆的..』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『嘿,在這種地方特別容易看到遠處..唉,那可不是有人在打架嗎？』"}, {"k": "id", "name": "塞可邦勒", "hint": "角色 id 15（塞可邦勒）", "ck": 15, "t": "『啊,那不就是..』"}, {"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『賽可邦德？你來的正好,我遇上了一點小麻煩..這些是你新交的朋友嗎？』"}, {"k": "id", "name": "塞可邦勒", "hint": "角色 id 15（塞可邦勒）", "ck": 15, "t": "『是的,有一些志同道合的戰友,他們一路趕過來幫忙的。』"}, {"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『好極了,那麼這一回我可以少費點工夫,叫你的朋友們快點,趕快解決這場仗,我們還有很多事要辦。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『賽可邦德,這位女士就是你所說的朋友嗎？』"}, {"k": "id", "name": "塞可邦勒", "hint": "角色 id 15（塞可邦勒）", "ck": 15, "t": "『是的,她就是劍聖密蒂,多年來一直在山中隱居,鍛鍊更高強的劍技。』"}, {"k": "id", "name": "萊汀", "hint": "角色 id 6（萊汀）", "ck": 6, "t": "『是她啊!我記得多年前她在皇宮禁衛團中是我的前葷,後來好像因為醉心於劍術,就辭去騎士團的職務,那時大家都很惋惜呢!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『像她這樣的厲害人物,為何會突然在此出現？』"}, {"k": "id", "name": "塞可邦勒", "hint": "角色 id 15（塞可邦勒）", "ck": 15, "t": "『她似乎是受友人所託,前來調查一些事情。我和她在路上結識,她得知我要回去確認獸人的侵攻行動,就託我回來通知她結果。』"}, {"k": "id", "name": "索菲亞", "hint": "角色 id 11（索菲亞）", "ck": 11, "t": "『這樣說起來,莫非她和約拿也有什麼關連..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『算了吧!這女人一副大姐樣剛見面就對人發號施令,看了就不順眼!我才不管她是什麼劍聖呢!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『索爾,那我們就表現給她看啊!讓她知道我們羅特帝亞的劍士可也不是泛泛之葷!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『說的對!今天要大幹一場!上啊!』"}]}, {"sub": 1, "sp": [{"k": "slot", "name": "場景#65", "hint": "場景記錄表槽位 65（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『啊..我太天真了,過於倚賴劍技,沒有考慮到.單打獨鬥還是不行的..』"}]}, {"sub": 2, "sp": [{"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『.,一場不錯的仗,但是耗時太久了..賽可邦德,有關獸人的情況我已經明白了,等一下我馬上要趕到艾斯島去,如果你的朋友也想湊湊熱鬧的話,就由你帶他們去吧,我應該告訴過你艾斯島的位置。』"}, {"k": "id", "name": "塞可邦勒", "hint": "角色 id 15（塞可邦勒）", "ck": 15, "t": "『是的,我確實記得。』"}, {"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『艾斯島情勢非比尋常,叫他們量力而為,不要把小命送掉了。我走了。』"}]}, {"sub": 3, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『哼,這女人真是夠寬張了!我.』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『唉,索爾,我們技不如人,你還想怎麼樣？』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『我們還是先趕到艾斯島上鶴察一下情勢,或許還有我們可以幫忙的地方..』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『也只好這樣了!索爾,別無精打采的,我們走吧!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『可惡,我才不肯認輸呢!等著瞧!』"}]}, {"sub": 4, "sp": [{"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『各位,漂亮的一仗!真是把團隊合作的精神發揮到了極致,我個人非常佩服。』"}, {"k": "id", "name": "洛娜", "hint": "角色 id 5（洛娜）", "ck": 5, "t": "『閣下的劍技也極為高超,真是讓我們開了眼界。』"}, {"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『謝謝。那麼,我想各位會到這裡來,相信都和我有著相同的目的,現在已查明敵方部隊正集結在北方的艾斯島上,接下來就由我帶領各位前去,將敵人一舉殲滅。我想各位都沒有意見吧？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『我有意見!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『索.索爾？你怎麼了？』"}, {"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『你有什麼意見,就說出來聽聽看吧。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『既然是我們戰技高超,我們為什麼要由妳來帶領？應該是妳加入我們,然後嚮導我們到艾斯島去才對,不是嗎？』"}, {"k": "id", "name": "凱麗", "hint": "角色 id 12（凱麗）", "ck": 12, "t": "『索爾大哥,密蒂閣下也算是劍士中的前葷,你也多少敬老尊賢一下嘛.』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『哼,我才不服!會打架的才算高手,我從小就這麼認為。』"}, {"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『哄哄.小子,你年紀這麼輕就有如此的膽識和武藝,我很欣賞..也好,我一個人過了這麼多年,也好久沒有嘗過被人帶領的滋味了,我就加入你們吧!劍聖密蒂,以後請各位多多指教。』"}, {"k": "id", "name": "塞可邦勒", "hint": "角色 id 15（塞可邦勒）", "ck": 15, "t": "『我不敢相信,一向自視極高美貌而又驕傲的劍聖密蒂,居然就這樣折服在索爾的氣魄之下了..』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『這就是王者的霸氣啊!不愧是索爾,光這一點我就比不上他了。』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『那麼,密蒂閣下,這就請妳帶領我們到艾斯島去吧!』"}, {"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『我既然已經加入你們,稱呼我時閣下兩個字就可以不必了,對吧,索爾？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『哼,我才.我才不在乎這些事呢!我們快上路吧!』"}]}]}, {"res": 17, "n": 9, "head": "我所料果然不差,瞧,一大堆敵人集結在這小小的冰島上,", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『我所料果然不差,瞧,一大堆敵人集結在這小小的冰島上,一定有什麼圖謀..』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『讓我看看.哎呀!有獸人黑暗戰士和沒見過的傢伙呢聲勢似乎頗為浩大的樣子!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『密蒂前葷,我們.我們現在該怎麼辦呢？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『那還用說!把他們全宰了,事情就可以告一段落了!』"}, {"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『這樣嗎？我也同意索爾的看法.總勝於站在這裡發呆吧!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『是啊!我們千里翅翅的趕來這裡,不就是要把事情弄清楚嗎？』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『小心!敵人已經注意到我們了!』"}, {"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『劍聖密蒂嗎？妳總算來了,我知道這幾天來妳一直在調查此地的事.唔,看來妳還帶了不少陪葬的傢伙,這一來這冰島上可有得熱鬧了..』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『密蒂前葷,這奇怪的傢伙就是事件的元凶首惡嗎？』"}, {"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『我想應該是。別小看他這奇形怪狀的模樣,我感覺得到他身上有強大的魔力..總之,這是個棘手的強敵,索爾你要特別小心!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『哼,我才不怕這傢伙呢!大家上啊!』"}, {"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『真沒格調的傢伙,本來還想和你們聊聊的,只好早點送你們下地獄了.給我殺個片甲不留!』"}]}, {"sub": 1, "sp": [{"k": "id", "name": "士兵", "hint": "角色 id 68（士兵）", "ck": 68, "t": "『密蒂閣下,我們沒有來遲吧!』"}, {"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『各位來的正好!敵人兵力強大,請各位盡力作戰,我們務必取得勝利!』"}, {"k": "id", "name": "士兵", "hint": "角色 id 68（士兵）", "ck": 68, "t": "『是!我們一定不會讓閣下您失望的!』"}]}, {"sub": 2, "sp": [{"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『啊.黑暗的力量果真強大,我的修練還是不夠.剩下的只好拜託你們了..』"}]}, {"sub": 3, "sp": [{"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『為什麼.為什麼這些下賤的人類居然能打倒我？..主人,救救我..』"}]}, {"sub": 4, "sp": [{"k": "id", "name": "米亞斯多德", "hint": "角色 id 17（米亞斯多德）", "ck": 17, "t": "『唉!這可不是.「冰之眼」寶石？原來是在冰魔神的身上..』"}, {"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『你也知道「魔眼寶石」的事？』"}, {"k": "id", "name": "米亞斯多德", "hint": "角色 id 17（米亞斯多德）", "ck": 17, "t": "『.,自從我知道某個古老的傳說以來,就一直在追尋其中的秘密。但為什麼這些傢伙會擁有其中之一？..』"}, {"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『我們也正在調查這一點,目前唯一可以肯定的是,這絕對不會是什麼好事..這件事還是等打完仗再來談好了..』"}, {"k": "id", "name": "米亞斯多德", "hint": "角色 id 17（米亞斯多德）", "ck": 17, "t": "『也好,反正這場仗已是勝利在望了!』"}]}, {"sub": 5, "sp": [{"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『原來我們打倒的傢伙叫做冰魔神,看來和你們上次救出國王時遇到的地魔神是一夥的。他們真正的目的究竟為何,現在仍然是一個謎,看來我們還有好長一段路要走..各位可願意和我繼續一起追索這批邪惡之徒？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『可是.我們原先是要找到賢者約拿,請他醫治悠妮小姐的失憶症的..』"}, {"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『約拿？他就是這次調查行動的發起人啊!他以各種方法召集了馬拉大陸各地的勇士能人,一起向這個未知的陰謀和其計畫者挑戰,難道你們不知道此事？』"}, {"k": "id", "name": "索菲亞", "hint": "角色 id 11（索菲亞）", "ck": 11, "t": "『約拿確是有請我前往北方的黑森林與他會合,但他並沒有說明原因..現在我總算明白了!』"}]}, {"sub": 6, "sp": [{"k": "id", "name": "凱拉斯", "hint": "角色 id 16（凱拉斯）", "ck": 16, "t": "『小伙子們!是你們一行打敗冰魔神的嗎？』"}]}, {"sub": 7, "sp": [{"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『原來我們打倒的傢伙叫做冰魔神,看來和你們上次救出國王時遇到的地魔神是一夥的。他們真正的目的究竟為何,現在仍然是一個謎.』"}, {"k": "id", "name": "塞可邦勒", "hint": "角色 id 15（塞可邦勒）", "ck": 15, "t": "『密蒂閣下,那您往後有什麼打算？』"}, {"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『繼續追查敵人的底細。此行有多麼危險,你們現在應該很清楚了,如果愛惜性命的話,就到此為止比較好。賽可邦德,他們就交給你了時間緊迫,我得先走一步..』"}]}, {"sub": 8, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這還需要懷疑嗎？對了,你是從哪裡跑出來的？和冰魔神是一夥的嗎？』"}, {"k": "id", "name": "凱拉斯", "hint": "角色 id 16（凱拉斯）", "ck": 16, "t": "『別誤會,我是龍人族的劍士凱拉斯,奉命前來冰島調查時不小心中了這些雜碎的奸計,一直被關在地下的冰穴中;不久前我才設法掙脫繩結跑出來。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『冰魔神和其部下確實已被我們打倒了,我想你可以放心了。』"}, {"k": "id", "name": "凱拉斯", "hint": "角色 id 16（凱拉斯）", "ck": 16, "t": "『這樣嗎？能夠打倒冰魔神,真是一件了不起的成就..不過你們為何要與他們作對呢？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這哪需要理由!那些傢伙在大陸各地胡作非為,我們的目的雖然是尋找賢者約拿,但是看到他們的種種惡行,怎麼可以置之不理？』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『我們一路上與敵人交戰,不但因此交了不少朋友,戰技也大為提昇,而約拿恰巧也在調查此事,我們的方向正好與他不謀而合。』"}, {"k": "id", "name": "凱拉斯", "hint": "角色 id 16（凱拉斯）", "ck": 16, "t": "『原來如此.我族之王聖寇拉斯也受到約拿之邀出面調查此事,因此他與我分頭前往冰島和西方的沙漠,想查明敵人的底細,結果我沒料到敵人大軍聚集於此,一下子就被抓了.』"}, {"k": "id", "name": "米亞斯多德", "hint": "角色 id 17（米亞斯多德）", "ck": 17, "t": "『聖寇拉斯陛下竟然也親自出馬了,看來事態一定非同小可。』"}, {"k": "id", "name": "凱拉斯", "hint": "角色 id 16（凱拉斯）", "ck": 16, "t": "『是啊!只是我有負陛下使命被關了這麼多天,約定的日期早過了,也不知道接下來該怎麼辦..』"}, {"k": "id", "name": "米亞斯多德", "hint": "角色 id 17（米亞斯多德）", "ck": 17, "t": "『那你乾脆加入我們一行好了反正陛下遲早也會和賢者約拿會合,和我們一起去找約拿,不是也一樣可以找到陛下嗎？』"}, {"k": "id", "name": "凱拉斯", "hint": "角色 id 16（凱拉斯）", "ck": 16, "t": "『你說的有理,不過不知道這些朋友們..』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『龍人戰士是尊貴的武士,既然目的一致,我們當然歡迎你加入!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『是啊!被抓並不可恥,這筆悵以後再和敵人清算就好了。』"}, {"k": "i
