d", "name": "凱拉斯", "hint": "角色 id 16（凱拉斯）", "ck": 16, "t": "『多謝各位!劍士凱拉斯,以後請多多指教。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『好極了,又多了一個新伙伴不過,我可不想繼續待在這個光禿禿的冰島上,索菲亞我們下一步該怎麼走？』"}, {"k": "id", "name": "索菲亞", "hint": "角色 id 11（索菲亞）", "ck": 11, "t": "『應該是再往北經過山道,前往史威特平原..』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『那是條滿偏僻的山道,知道的人不多,想必往後的旅程應該會比較平靜了。哈哈哈!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『但願如此。我們這就上路吧!』"}]}]}, {"res": 18, "n": 11, "head": "好長的弔橋!在這山岳絕頂構築這麼長的弔橋,一定很不容", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『好長的弔橋!在這山岳絕頂構築這麼長的弔橋,一定很不容易吧!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這弔橋通往哪裡？』"}, {"k": "id", "name": "索菲亞", "hint": "角色 id 11（索菲亞）", "ck": 11, "t": "『過了這道弔橋,地形便急轉直下,通往史威特平原和黑暗沼澤..』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『唉!有人比我們先到此地了呢!』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『老爹,弔橋上有一個高大的騎士和一位老者,是吧？』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『老者？莫非是..』"}, {"k": "id", "name": "索菲亞", "hint": "角色 id 11（索菲亞）", "ck": 11, "t": "『是他的背影沒錯!約拿先生!』"}]}, {"sub": 1, "sp": [{"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『哎呀!可不是索菲亞和貝克威嗎？還帶了一票小朋友呢你們什麼時候來的？』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『剛剛才到的,約拿先生,真高興能遇見您.』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『呵呵呵!聽說你們一路上戰績卓著,想必法術戰技也都鍛鍊得不錯了,這對我們日後與黑暗勢力的決戰大有助益.』"}, {"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『小心,約拿先生,您的背後有人!』"}]}, {"sub": 2, "sp": [{"k": "id", "name": "魔鬼", "hint": "角色 id 108（魔鬼）", "ck": 108, "t": "『嘿嘿,由他們的話聽來,這老頭果然是約拿沒錯!』"}, {"k": "id", "name": "黑暗騎士", "hint": "角色 id 85（黑暗騎士）", "ck": 85, "t": "『大家聽清楚了,宰了他就可以獲得豐厚的賞金!大家努力作戰,回去就可以快活度日了!』"}, {"k": "id", "name": "鎧甲武士", "hint": "角色 id 78（鎧甲武士）", "ck": 78, "t": "『那還等什麼？大夥兒上吧!』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『糟啦,由他們鎧甲上的紋帥看來,我們好像有大麻煩了..』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『怎麼回事？』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『如果我沒記錯的話,這是一支叫做「死亡骷髏」的黑暗傭兵團,這些惡名昭彰的傢伙專接暗殺和劫掠的生意,為了賺血腥錢無所不為!』"}, {"k": "id", "name": "萊汀", "hint": "角色 id 6（萊汀）", "ck": 6, "t": "『我想起來了,以前我們王國騎士團曾對他們發動過一次清剿,自那之後就沒再聽過他們的消息了。』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『他們在此出現,難道是為了約拿先生而來？..糟了,約拿先生有危險!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『敵人人數不少,我們趕快過去支援!走吧!』"}, {"k": "id", "name": "蘭斯洛特", "hint": "角色 id 7（蘭斯洛特）", "ck": 7, "t": "『約拿先生,出現在橋彼端的似乎是「死亡骷髏」傭兵團這批傭兵應該是衝著我們來的。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『是麼？敵人終於下殺手了.也好,我好久沒活動這把老骨頭啦,還可以順便看看小子們的表現,蘭斯洛特,你應該沒問題吧？』"}, {"k": "id", "name": "蘭斯洛特", "hint": "角色 id 7（蘭斯洛特）", "ck": 7, "t": "『請您放心,不管情勢如何,我都誓以生命來保護您的安全。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『不用這麼客氣,這又不是我們第一次聯手..敵人來了我們小心迎戰吧!』"}]}, {"sub": 3, "sp": [{"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『唔,我畢竟是上了年紀,玩不起這種運動了..啊..』"}]}, {"sub": 4, "sp": [{"k": "slot", "name": "場景#17", "hint": "場景記錄表槽位 17（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『約拿先生,您自己要保重..我不行了..』"}]}, {"sub": 5, "sp": [{"k": "id", "name": "黑暗騎士", "hint": "角色 id 85（黑暗騎士）", "ck": 85, "t": "『可惡.我的同伴們會為我報仇的..等著瞧吧..』"}]}, {"sub": 6, "sp": [{"k": "slot", "name": "場景#53", "hint": "場景記錄表槽位 53（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『好耐命的老頭!約拿和那個騎士居然都還活著？』"}, {"k": "slot", "name": "場景#61", "hint": "場景記錄表槽位 61（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『他們好像找來了幫手,弟兄們好像死傷慘重!首領要我們來增援果然是對的。』"}, {"k": "slot", "name": "場景#53", "hint": "場景記錄表槽位 53（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『既然如此,我們就從這裡突擊他們的後方,和橋上的弟兄左右夾擊,讓他們插翅也難飛!』"}, {"k": "slot", "name": "場景#61", "hint": "場景記錄表槽位 61（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『好,就這麼辦!我們上吧!』"}]}, {"sub": 7, "sp": [{"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『多謝大家的幫助!瑪琳,索菲亞,貝克威,很高興你們能趕來此地與我會合;還有不少我認識的朋友們,我也在此向你們問好。至於幾位初次見面的.這幾位年輕的勇士們怎麼稱呼呢？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『約拿先生,我叫索爾,這兩位是我的好友亞雷斯和悠妮小姐,我們來自東方的羅特帝亞。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『啊!羅特帝亞嗎？那可真是遠道而來了。不知道你們為何大老遠前來此地？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『老實說,是想請約拿先生您醫治悠妮小姐的失憶症.』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『失憶症？這可難倒我了,如果是魔法所造成的,我或許還能幫得上忙;但若是頭部受傷或是疾病引起的,那就是僧侶分內的工作了...不過既然你們都大老遠跑來了,我還是幫她看看吧,悠妮小姐,請妳過來這邊.』"}]}, {"sub": 8, "sp": [{"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『...有趣,有趣!這種事我還是第一次見到..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『約拿先生,怎麼樣？』"}]}, {"sub": 9, "sp": [{"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『壞消息是,我無法醫治她的失憶症,這有特別的原因;好消息則是,或許我能告訴你她來自何處。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這樣也行,我們本來就是要送她回家的。約拿先生,能告訴我們地點在哪裡嗎？』"}]}, {"sub": 10, "sp": [{"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『現在還不行,因為這涉及我正在調查的古代秘密,我自己也無法確定..不過,也許在這次的事情告一段落之後,我就可以給你們一個確切的答案。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『那就是說,我們又得..唉!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『索爾,別嘆氣啦!我們不如就跟著大家完成這場痛快的大冒險,這種經驗以後也很難再有啦!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『是啊!索爾,你要是不在了,以後的戰鬥就沒人領導了!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『可是,我只是想趕快回復悠妮的記憶..』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『沒關係,索爾,我一直有種奇異的預感,我覺得.我覺得好像只要再這樣走下去,事情一定會有結果的,所以我想.我希望能繼續這段旅程..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『真.真的嗎？好極了,既然妳這麼認為,我就沒有意見了!』"}, {"k": "id", "name": "瑪琳", "hint": "角色 id 10（瑪琳）", "ck": 10, "t": "『萬歲!索爾他們會留下來了!』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『索爾,我們以後要靠你出力的地方還很多,歡迎你繼續和我們一起奮鬥。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『謝謝大家!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『呵呵呵,這裡可不是個敘舊的好地方,前面的路上有個小鎮,我們還是先離開這個危險的山崖,去那裡好好休息一下吧!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『我同意!大家上路吧!』"}]}]}, {"res": 19, "n": 4, "head": "真令人不舒服的森林!這裡是什麼地方？", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『真令人不舒服的森林!這裡是什麼地方？』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『這是大陸北方山脈之麓的黑森林,由於山脈和濃密的森林阻擋陽光,這一帶看起來總是陰森森的,一般旅人都不敢行經此處。』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『過了此地,也就快到死之沼澤了,聽說曾有人在這一帶遭怪物攻擊..』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『我有不好的預感,大家要多小心!』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『哎呀!老爹你說對啦,前面果然有人來了!』"}, {"k": "id", "name": "狂戰士", "hint": "角色 id 81（狂戰士）", "ck": 81, "t": "『約拿老頭,上次在你手裡折損了不少弟兄,今天這筆悵要一併討回來!準備受死吧!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『可惡,又是陰魂不散的死亡骷髏!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『不知死活的傢伙,你們的罪業就到此為止了!我今天絕不放過你們!』"}]}, {"sub": 1, "sp": [{"k": "id", "name": "巴拿羅西亞", "hint": "角色 id 27（巴拿羅西亞）", "ck": 27, "t": "『唉!這是惡名昭彰的「死亡骷髏」傭兵團啊!他們竟然在這裡出現,難道果真是有人在暗中..』"}, {"k": "id", "name": "凱拉斯", "hint": "角色 id 16（凱拉斯）", "ck": 16, "t": "『嘿!那可不是巴拿羅西亞閣下嗎？真巧啊!』"}, {"k": "id", "name": "巴拿羅西亞", "hint": "角色 id 27（巴拿羅西亞）", "ck": 27, "t": "『啊!你是凱拉斯嘛!好一陣子沒碰面了,想不到會在這裡遇見你..』"}, {"k": "id", "name": "凱拉斯", "hint": "角色 id 16（凱拉斯）", "ck": 16, "t": "『巴拿羅西亞閣下,現在可能不是敘舊的好時候,先讓我們解決了這幫想謀害約拿先生的惡徒再說。』"}, {"k": "id", "name": "巴拿羅西亞", "hint": "角色 id 27（巴拿羅西亞）", "ck": 27, "t": "『約拿先生也在這裡？好極了,這場仗也算上我一份!』"}]}, {"sub": 2, "sp": [{"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『.為什麼.為什麼這些小鬼竟然如此厲害..』"}]}, {"sub": 3, "sp": [{"k": "id", "name": "巴拿羅西亞", "hint": "角色 id 27（巴拿羅西亞）", "ck": 27, "t": "『這場仗打的真是漂亮!對於各位的表現,我個人真是非常佩服。』"}, {"k": "id", "name": "凱拉斯", "hint": "角色 id 16（凱拉斯）", "ck": 16, "t": "『巴拿羅西亞閣下,陛下不是和您在一起的嗎？』"}, {"k": "id", "name": "巴拿羅西亞", "hint": "角色 id 27（巴拿羅西亞）", "ck": 27, "t": "『啊,我早該想到的,原來你是聖寇拉斯的部下..』"}, {"k": "id", "name": "凱拉斯", "hint": "角色 id 16（凱拉斯）", "ck": 16, "t": "『是的,我們在行經死亡沼澤的途中發現「死亡骷髏」在此出沒,陛下擔心他們的目標可能是你們,所以命令我先來查看一番。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『原來如此..那他往哪裡去了？』"}, {"k": "id", "name": "巴拿羅西亞", "hint": "角色 id 27（巴拿羅西亞）", "ck": 27, "t": "『陛下說他已經發現了一些蛛絲馬跡,要趕往西方高塔一趙,我想現在應該還在路上吧。』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『西方高塔..那不就是「聖靈之塔」嗎？那裡是我們精靈族的發源聖地,想不到敵人也看上了那裡,不知道他們有何意圖？』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『總之,我們要儘快和聖寇拉斯會合,看來他已發現了重要的線索,往後的幾天可能得趕一下路,大家忍耐一點。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這有什麼問題!倒是約拿先生您年事已大,可不要太勉強喔!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『呵呵.索爾,謝謝你的關心,我會注意的。我們這就上路吧!』"}]}]}, {"res": 20, "n": 17, "head": "唉!一陣子沒來這裡,沼澤的面積好像又變大了.這裡本來", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『唉!一陣子沒來這裡,沼澤的面積好像又變大了.這裡本來應該還是森林的。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『沼澤會吞食森林？這種事我可沒聽過。』"}, {"k": "id", "name": "索菲亞", "hint": "角色 id 11（索菲亞）", "ck": 11, "t": "『這個死之沼澤是全大陸邪氣最重的地方,什麼事情都有可能發生,大家要特別小心..』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『安靜!我聽到前面有打鬥聲!』"}, {"k": "id", "name": "謝多", "hint": "角色 id 25（謝多）", "ck": 25, "t": "『可惡,看來傳聞果然是真的..』"}, {"k": "slot", "name": "場景#54", "hint": "場景記錄表槽位 54（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『我還是不能相信,這世界上居然真有看不見的怪物!』"}, {"k": "slot", "name": "場景#56", "hint": "場景記錄表槽位 56（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『你才剛被咬了一口而已,接受事實吧!』"}, {"k": "id", "name": "黑暗殺手", "hint": "角色 id 99（黑暗殺手）", "ck": 99, "t": "『嘿,認命吧!誰教你們誤入這片沼澤!』"}, {"k": "id", "name": "武術家", "hint": "角色 id 100（武術家）", "ck": 100, "t": "『首領有命,凡是進入這片沼澤的都得死!』"}, {"k": "slot", "name": "場景#56", "hint": "場景記錄表槽位 56（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『謝多,我們現在該怎麼辦？』"}, {"k": "id", "name": "謝多", "hint": "角色 id 25（謝多）", "ck": 25, "t": "『..跟他們拼了!』"}, {"k": "id", "name": "黑暗殺手", "hint": "角色 id 99（黑暗殺手）", "ck": 99, "t": "『那你們就受死吧!』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『從他們的話聽來,好像是遇到了看不見的隱形怪物呢!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『有這種事？這在我們度過此地時可是一大威脅,...』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『不如我們現在就出去和他們攜手作戰,強行越過這沼澤,同時也摸清楚這隱形怪物的底細。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『我贊成!坐視無辜旅人被敵方攻擊,這可不是我們的一貫作風!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『既然如此,我們就上陣吧!不過對手中有看不見的傢伙,大家要謹慎些!』"}]}, {"sub": 1, "sp": [{"k": "slot", "name": "場景#52", "hint": "場景記錄表槽位 52（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『..我不甘心.我不該輸給這些傢伙的..』"}]}, {"sub": 2, "sp": [{"k": "slot", "name": "場景#53", "hint": "場景記錄表槽位 53（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『哇..啊..』"}]}, {"sub": 3, "sp": [{"k": "slot", "name": "場景#54", "hint": "場景記錄表槽位 54（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『聖靈之塔..絕不能讓敵人侵入..』"}]}, {"sub": 4, "sp": [{"k": "slot", "name": "場景#55", "hint": "場景記錄表槽位 55（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『保.護..聖靈之塔..』"}]}, {"sub": 5, "sp": [{"k": "slot", "name": "場景#56", "hint": "場景記錄表槽位 56（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『哇..啊..』"}]}, {"sub": 6, "sp": [{"k": "slot", "name": "場景#57", "hint": "場景記錄表槽位 57（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『聖靈之塔..絕不能讓敵人侵入..』"}]}, {"sub": 7, "sp": [{"k": "slot", "name": "場景#58", "hint": "場景記錄表槽位 58（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『哇..啊..』"}]}, {"sub": 8, "sp": [{"k": "slot", "name": "場景#59", "hint": "場景記錄表槽位 59（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『保.護..聖靈之塔..』"}]}, {"sub": 9, "sp": [{"k": "slot", "name": "場景#60", "hint": "場景記錄表槽位 60（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『啊..』"}]}, {"sub": 10, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『糟糕,精靈們被全滅了!』"}]}, {"sub": 11, "sp": [{"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『這雖是一場苦戰,但感謝神庇佑我們獲得最後的勝利。對了,你們是怎麼碰上這件怪事的？』"}, {"k": "id", "name": "謝多", "hint": "角色 id 25（謝多）", "ck": 25, "t": "『我們在行經此地時,忽然就遭到這些傢伙和隱形的沼澤怪物攻擊,幸好各位趕來援助,不然我們大概已經不明不白的死在這裡了。』"}, {"k": "id", "name": "巴拿羅西亞", "hint": "角色 id 27（巴拿羅西亞）", "ck": 27, "t": "『為何那些傢伙要封鎖死之沼澤？想要阻止我們前往北方嗎？』"}, {"k": "id", "name": "精靈", "hint": "角色 id 72（精靈）", "ck": 72, "t": "『可能和來路不明的黑暗軍進攻「聖靈之塔」一事有關..』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『什麼？真有此事？』"}, {"k": "id", "name": "精靈", "hint": "角色 id 72（精靈）", "ck": 72, "t": "『是的,我們這一支精靈族住在亞述森林,世代負責守護聖地。最近集結的黑暗軍似想進攻聖靈之塔,長老深恐我們的兵力抵敵不住,所以派遣我們向哈斯米爾求救,沒想到敵方已在此布下陷阱.』"}, {"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『聖靈之塔究竟有什麼秘密,值得那些傢伙拼命進攻？』"}, {"k": "id", "name": "精靈", "hint": "角色 id 72（精靈）", "ck": 72, "t": "『我們也不知道,因為那裡已有數百年沒人進去過了..不過長老深信黑暗軍一旦攻佔聖靈之塔,後果一定不堪設想,所以嚴令我們務必死守。』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『原來如此。哈斯米爾也遭到敵方攻擊而死傷慘重,救兵可以不必去求了,我們這就去亞述森林增援。』"}, {"k": "id", "name": "精靈", "hint": "角色 id 72（精靈）", "ck": 72, "t": "『謝謝你們!這樣我們就可以放心的回去覆命了!』"}]}, {"sub": 12, "sp": [{"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『.,看來你似乎是個忍者,這個職業現在已經不多見了..你往後有何打算？』"}, {"k": "id", "name": "謝多", "hint": "角色 id 25（謝多）", "ck": 25, "t": "『我在這森林中隱居多年,這些年來的和平生活,讓我以為這一身技藝已經沒有用了,現在我發現這種想法好像是錯了.如果你們不介意的話,我願意加入你們,與黑暗軍周旋到底!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『要與黑暗軍對陣,人手再多也不會嫌夠的。歡迎加入!』"}]}, {"sub": 13, "sp": [{"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『遺憾的是,現在沒時間歡迎新人了,事態緊急,我們得立刻趕往亞述森林。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『沒問題!我們上路囉!』"}]}, {"sub": 14, "sp": [{"k": "id", "name": "達克塞", "hint": "角色 id 28（達克塞）", "ck": 28, "t": "『嘎呼吱!希哩呼喀嚕..』"}, {"k": "id", "name": "巴拿羅西亞", "hint": "角色 id 27（巴拿羅西亞）", "ck": 27, "t": "『這不是下等魔族嗎？怎麼會在此出現？』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『看起來好像沒有敵意的樣子,只可惜我不懂魔族的語言..』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『你說什麼？我聽不清楚,稍等一下。』"}]}, {"sub": 15, "sp": [{"k": "id", "name": "達克塞", "hint": "角色 id 28（達克塞）", "ck": 28, "t": "『嘎呼吱!希哩呼喀嚕..』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『.,...我明白了,我會向他們替你求情的。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮,妳懂得它們的話？』"}]}, {"sub": 16, "sp": [{"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『是的,我聽得懂牠在說些什麼,不過我不知道為何我聽得懂..』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『沒關係,悠妮小姐,牠和你說了些什麼？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『他說他叫達克塞,是下等的魔族戰士,因為對首領的命令產生了懷疑,而被處以軟禁的刑罰,原先是由「死亡骷髏」所看管,後來我們打倒了負責防守死之沼澤的敵軍,他才乘亂逃了出來。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『惡魔族也牽涉其中嗎？這比我想像的還麻煩..那麼,這位達克塞先生對我們有何指教呢？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『他說魔族已遭人以某種方式操縱,他希望能加入我們一行,拯救惡魔族免於毀滅的命運。』"}, {"k": "id", "name": "巴拿羅西亞", "hint": "角色 id 27（巴拿羅西亞）", "ck": 27, "t": "『惡魔族能夠信任嗎？何況又是下等的惡魔..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『沒關係!只要有心對抗黑暗軍者,都可以加入我們一行!我們要先能相信別人,才能得到別人的信任。不是嗎？』"}]}]}, {"res": 21, "n": 11, "head": "呼!一路都沒休息的趕來,真是累死人了..", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『呼!一路都沒休息的趕來,真是累死人了..』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『希望我們還來得及。』"}, {"k": "id", "name": "珊", "hint": "角色 id 14（珊）", "ck": 14, "t": "『這裡好像是平日的聚會場所,不過為何充滿了血腥味..』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『啊!前面好像是敵方的大軍,精靈族人被圍在中間!..』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『不要做白日夢了!我寧可葬身於此,也不願作你們的俘虜!』"}, {"k": "id", "name": "瑪爾", "hint": "角色 id 120（瑪爾）", "ck": 120, "t": "『老頭子,識時務者為俊傑,我的雇主很需要像你這樣法力高強又見識廣博的大法師,如果你願意投降,我保證他不會虧待你的。呵呵呵..』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『少囉唸了!精靈族可不是貧生怕死的種族,來一決勝負吧!』"}, {"k": "id", "name": "羅蘭", "hint": "角色 id 23（羅蘭）", "ck": 23, "t": "『有我在此,你們休想碰長老一根汗毛!』"}, {"k": "id", "name": "瑪爾", "hint": "角色 id 120（瑪爾）", "ck": 120, "t": "『既然你們不肯跟我走,我就只好把你們的屍體帶回去了.給我殺!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『可惡!又是「死亡骷髏」!..』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『看來聖靈之塔已經落入敵手,剩下的精靈族人正在做最後的頑抗.沒辦法,我們先保住他們的性命,再作其他的打算!』"}, {"k": "id", "name": "瑪爾", "hint": "角色 id 120（瑪爾）", "ck": 120, "t": "『又有其他的傻瓜來了嗎？好極了,我正嫌這些精靈太少,殺起來不過癲呢!』"}, {"k": "id", "name": "萊汀", "hint": "角色 id 6（萊汀）", "ck": 6, "t": "『瑪.瑪爾!原來是妳!沒想到妳還活著.』"}, {"k": "id", "name": "瑪爾", "hint": "角色 id 120（瑪爾）", "ck": 120, "t": "『哦,是禁衛軍的隊長大人啊!遺憾的很,「死亡骷髏」當年是被你們剿滅了,但我花了好幾年的時間又把它重建起來,現在的「死亡骷髏」已非昔日所能比了.』"}, {"k": "id", "name": "萊汀", "hint": "角色 id 6（萊汀）", "ck": 6, "t": "『早知如此,當時就不該好心放妳逃走的..』"}, {"k": "id", "name": "瑪爾", "hint": "角色 id 120（瑪爾）", "ck": 120, "t": "『是嗎？那時沒有追殺到底是你自己的疏忽,也好,我們順便清算一下當年的悵..你們都別想活著離開這裡!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這種為錢賣命的惡棍,何必和他們囉唸!我們上!』"}]}, {"sub": 1, "sp": [{"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『唔.我還不能倒下.還沒.奪回.聖靈之塔..』"}]}, {"sub": 2, "sp": [{"k": "slot", "name": "場景#17", "hint": "場景記錄表槽位 17（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『.神啊.請保佑我們精靈族.戰勝黑暗之力..』"}]}, {"sub": 3, "sp": [{"k": "id", "name": "瑪爾", "hint": "角色 id 120（瑪爾）", "ck": 120, "t": "『終於來了嗎!宰了這些傢伙!』"}]}, {"sub": 4, "sp": [{"k": "slot", "name": "場景#26", "hint": "場景記錄表槽位 26（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『.哼,小伙子們還真有一手啊..敗在你們手裏,我沒什麼話好說了.』"}, {"k": "id", "name": "萊汀", "hint": "角色 id 6（萊汀）", "ck": 6, "t": "『瑪爾!.如果那時妳改過向善,就不會有今天的結果!.為什麼..』"}, {"k": "slot", "name": "場景#26", "hint": "場景記錄表槽位 26（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『.萊汀,我對你說過,我的身上流著罪犯的血液,我們是注定不能並肩作戰的.你以後可以放心了..唔..』"}, {"k": "id", "name": "萊汀", "hint": "角色 id 6（萊汀）", "ck": 6, "t": "『瑪爾..』"}]}, {"sub": 5, "sp": [{"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『我本來以為這回死定了,還好你們前來支援,我們才能戰勝這個殺手集團,真是非常感激。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『幸好我們還趕得及,想必這是神的旨意。聖靈之塔的情形如何？』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『三天前就已經被敵人攻入了,為了減少無謂的死傷,我就命令所有守軍撤退,所以那裡的情形現在我也不很清楚。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『我明白了。此外,我先前請你進行的調查可有結果？』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『我在王城的大圖書館中花了三個月研究古代典籍,還在各地的遺跡中進行挖掘,結果只得到了這支法杖和一點結論。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『.,真是支很奇異的法杖..結論怎麼說呢？』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『根據古典籍的記載,有關你所說的「天空之鑰」,事實上是由一個黃金徽章和五顆魔法寶石所構成的,這六樣東西必須經由這法杖的魔力才能結合在一起,從而發出及強大的力量,據說這力量可以克服時間和空間的限制,將使用者移動到遙遠的未知地方去。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『很有趣的說法!你的結論呢？』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『那有什麼結論!這六件東西,早在八百年前就不知道都失落到哪裡去了,而當我開始試圖要尋找它們的蹤跡時,黑暗軍就對亞述森林發動了攻擊,我只好先中斷了這段研究。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『我一直相信天空之鑰和這一連串事端有關,既然你暫時無法完成研究,這個揣測也就只好作罷,我們得換一個新的調查方向..』"}]}, {"sub": 6, "sp": [{"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『為了避免敵人在塔中玩出什麼花樣,我們還是先消滅掉塔中的敵人再說,以免夜長夢多。羅蘭,為了增強戰力起見,妳也和我一起去吧!』"}, {"k": "id", "name": "羅蘭", "hint": "角色 id 23（羅蘭）", "ck": 23, "t": "『是的,長老!善後工作交給其他人就可以了。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『好,那我們即刻前往巨塔!事關緊要,大家稍事休息就馬上出發!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『沒問題!我們這就上路吧!』"}]}, {"sub": 7, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『等等!希爾法大師,你所說的徽章和寶石,是不是這些？..』"}]}, {"sub": 8, "sp": [{"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『啊!蘊含光、闇、火焰、冰和星星之力的五顆寶石..就是這個沒錯!你們怎麼找到這些東西的？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『路上逐一得來的,敵人似乎也對它們感興趣,所以其中幾個費了好大勁才到手。』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『好極了,我現在就試試這支法杖管不管用。大家讓開一些,這可能會有些危險..』"}]}, {"sub": 9, "sp": [{"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『未知的遠古神祇啊,履行契約的時刻到了,請給予這法杖以失落的力量,讓被遺忘的道路再次開啟..』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『馬那德拉、亞布利加、艾米西德拉、伊多卡那瓦!..』"}]}, {"sub": 10, "sp": [{"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『瞧,完成了!相信這就是你一直在找的「天空之鑰」!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『真令人不敢相信,我花了十幾年尋找的東西,竟然就這樣到手了,這是命運的安排吧..』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『約拿先生,這個「天空之鑰」有什麼特別的用途？』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『我只知道它與古代人的傳說有關,據說它可以打開往天空的道路,至於是用怎樣的方式,就沒有人知道了。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『哎,好失望,我還以為這下子可以飛上天空了呢!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『索爾,別急,我相信我們真正的敵人必定與這天空之鑰有關,我們遲早可以解開這個秘密.以及悠妮小姐的來歷之謎。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『真的嗎？.那我就放心了。』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『雖然如此,為了避免敵人在塔中玩出什麼花樣,我們還是馬上動身前往巨塔,其他的事以後再說!羅蘭,為了增強戰力起見,妳也和我一起去吧!』"}, {"k": "id", "name": "羅蘭", "hint": "角色 id 23（羅蘭）", "ck": 23, "t": "『是的,長老!善後工作交給其他人就可以了。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『好!我們這就出發囉!』"}]}]}, {"res": 22, "n": 7, "head": "一路來到了塔頂,居然都沒有遇到敵人,真是奇怪!", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『一路來到了塔頂,居然都沒有遇到敵人,真是奇怪!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『索爾,不要掉以輕心!說不定敵人都集中在塔頂等我們呢!』"}, {"k": "id", "name": "哈諾", "hint": "角色 id 1（哈諾）", "ck": 1, "t": "『亞雷斯,你好像說對了!塔頂上有一大群人耶!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『嗄？』"}, {"k": "id", "name": "風魔神", "hint": "角色 id 124（風魔神）", "ck": 124, "t": "『呼呼呼,你們來得比我預期的還早些,不過也沒關係,等我把你們都解決後再來辦事就好了..』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『你們執意要佔領這聖靈之塔的理由,想必和你們在此進行的勾當有關吧!』"}, {"k": "id", "name": "風魔神", "hint": "角色 id 124（風魔神）", "ck": 124, "t": "『哈哈哈,反正你們別想活著離開這塔頂,所以告訴你們也無妨;這座塔是大陸上最接近天空的地方,我的主人要在此建立一個傳送點,如此他才能把麾下的軍隊從居城送到這大陸來..』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『居城？你們究竟是來自何處？你的主人又是誰？』"}, {"k": "id", "name": "風魔神", "hint": "角色 id 124（風魔神）", "ck": 124, "t": "『我的主人是支配者,是創造者,也是毀滅者..其他的你們就不必知道了,準備受死吧!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『準備要死的是你吧!看劍!』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『對手的底細不明,大家要小心為戰!』"}]}, {"sub": 1, "sp": [{"k": "id", "name": "魔鬼", "hint": "角色 id 108（魔鬼）", "ck": 108, "t": "『嘎嘎...!』"}, {"k": "id", "name": "風魔神", "hint": "角色 id 124（風魔神）", "ck": 124, "t": "『來了嗎..,宰了這些傢伙!』"}, {"k": "id", "name": "魔鬼", "hint": "角色 id 108（魔鬼）", "ck": 108, "t": "『嘎嘎嘎...!』"}]}, {"sub": 2, "sp": [{"k": "id", "name": "莎拉", "hint": "角色 id 20（莎拉）", "ck": 20, "t": "『唉,這是怎麼回事？塔頂打成一片？..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『喂,這裡打的正起勁,如果不想受傷就別過來!』"}, {"k": "id", "name": "莎拉", "hint": "角色 id 20（莎拉）", "ck": 20, "t": "『別把人看扁了!我起碼也是個龍騎士耶!』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『龍騎士？好久沒聽到這個崇高的名號了..妳怎麼會恰好來到這裡呢？』"}, {"k": "id", "name": "莎拉", "hint": "角色 id 20（莎拉）", "ck": 20, "t": "『說來話長,我自從不小心被抓之後,就一直被關在所在不明的牢房中,幾天前才被轉送到這塔裡;剛才我聽到塔頂有打鬥聲,看守的人又不在,就設法打破牢門出來看看。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『原來如此,現在妳打算怎麼辦？』"}, {"k": "id", "name": "莎拉", "hint": "角色 id 20（莎拉）", "ck": 20, "t": "『當然是加入你們一行,修理那個大傢伙啊!我要好好和清算這筆悵!』"}, {"k": "id", "name": "風魔神", "hint": "角色 id 124（風魔神）", "ck": 124, "t": "『手下敗將,還不認輸嗎？這次我不會再客氣了!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『少囉唸!先應付完我這一劍再說!』"}]}, {"sub": 3, "sp": [{"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『.這些卑賤的蟲蟻.為何會如此厲害..主人..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『唉!又失手了,本來這回我有更多話想問他..』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『沒關係,我們得到了這傳送法杖,只要啟動他們布下的這個魔法陣,就可以直接傳送到他們的根據地了。』"}]}, {"sub": 4, "sp": [{"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『希爾法,這種單程傳送很可能一去不回,你不覺得太冒險了嗎？』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『沒辦法,眼看著敵人就要大舉進攻了,只有前往他們的根據地做個徹底解決,才有可能阻止他們。為了保護精靈族和整個馬拉大陸,我已有犧牲的決心。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『這樣嗎..』"}]}, {"sub": 5, "sp": [{"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『等一下我就啟動傳送場,想去的就自行走進這魔法陣中,我絕不強迫。』"}]}, {"sub": 6, "sp": [{"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『你.你們..』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『希爾法,如果就這樣讓你一個人去,我約拿的名字會被今後的世人所恥笑。我可不是個貧生怕死的人,更不會在危難時拋棄朋友!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『既然都到了這裡,那還有什麼好怕的!我們相信,幾位前葷的智慧和知識,一定能帶領我們度過難關的。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『就是說啊!馬拉大陸上的強者在此濟濟一堂,要擊潰敵人根據地有什麼問題!希爾法大師,你要對我們自己有信心才對!』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『謝謝.謝謝大家這麼相信我!既然如此,我這就啟動傳送魔法!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『哎,我等不及想看看我們會去的是個怎麼樣的地方!』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『馬那德拉、亞布利加、艾米西德拉、伊多卡那瓦!..』"}]}]}, {"res": 23, "n": 18, "head": "呼!難過死了.唉!這裡是.敵人的根據地嗎？為何看起來", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『呼!難過死了.唉!這裡是.敵人的根據地嗎？為何看起來一點都不像？』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『在傳送魔法啟動後,我感覺到有極強的魔力從中干擾,傳送魔法的作用因此發生了錯亂.希爾法,我說得沒錯吧？』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『是的,傳送過程受到這種干擾,我們沒有全部嵌到岩壁裏去就該慶幸不已了。不過這裡應該離原來的目的地不遠,這個我大概可以確定..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『可惡,原來又是敵人搞的鬼!』"}]}, {"sub": 1, "sp": [{"k": "id", "name": "卡里斯", "hint": "角色 id 22（卡里斯）", "ck": 22, "t": "『唉？什麼時候多了好大一票人出來？他們是怎麼來到這裡的,我們居然毫無知覺？』"}]}, {"sub": 2, "sp": [{"k": "id", "name": "羅德曼", "hint": "角色 id 19（羅德曼）", "ck": 19, "t": "『什麼？是敵人嗎？』"}, {"k": "id", "name": "卡里斯", "hint": "角色 id 22（卡里斯）", "ck": 22, "t": "『看起來不像,還是先過去打個照面再說!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『哎呀,有人比我們先來了呢!』"}, {"k": "id", "name": "巴拿羅西亞", "hint": "角色 id 27（巴拿羅西亞）", "ck": 27, "t": "『敵人這麼快就來了嗎？』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『不像,對方只有兩個人而已.好像想和我們談話的樣子。』"}]}, {"sub": 3, "sp": [{"k": "id", "name": "卡里斯", "hint": "角色 id 22（卡里斯）", "ck": 22, "t": "『不知各位為何跋涉千里,來到這沙漠之中的廢墟？是和我們一樣為了研究遺跡而來的嗎？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『啊!你不是.卡里斯叔叔嗎？』"}, {"k": "id", "name": "卡里斯", "hint": "角色 id 22（卡里斯）", "ck": 22, "t": "『你說什麼？你怎麼知道我叫卡里斯？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『卡里斯叔叔,我是索爾啊!小時候你經常帶我出去玩,還教我武術的..』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『你這麼一說,我也想起來了!他的確是曾經教過我們武術的卡里斯叔叔!』"}, {"k": "id", "name": "卡里斯", "hint": "角色 id 22（卡里斯）", "ck": 22, "t": "『你是.索爾王子嗎？那你就是巴拉多的兒子亞雷斯了!我記得你們從小就在一起的。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『答對啦!卡里斯叔叔,你果然還記得我們!真是好久不見了。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『聽父王說你到海外來探險,我們都神往不已呢!真沒想到會在這裡遇到您。』"}, {"k": "id", "name": "卡里斯", "hint": "角色 id 22（卡里斯）", "ck": 22, "t": "『時間過的真快,你們都長大啦!雷特王子..,陛下這些日子還好嗎？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『父王母后都很安健,不過老嫌生活平淡了些,大概是等著要聽卡里斯叔叔您的冒險故事吧!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『哪!又遇見了一個熟人,這可不是羅德曼嗎？你一個好好的邊防將軍不做,又跑來這裡考古啦？』"}, {"k": "id", "name": "羅德曼", "hint": "角色 id 19（羅德曼）", "ck": 19, "t": "『果然是約拿你這把老骨頭,世界上就你最清楚我的習性。你怎麼也捨得跑到這荒山野外來了？』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『我倒忘了問你,這裡到底是哪裡？我們是被魔法傳送來的。』"}, {"k": "id", "name": "羅德曼", "hint": "角色 id 19（羅德曼）", "ck": 19, "t": "『喲,這趙路可真遠了!這裡是大陸西北方的沙漠中央的一個綠洲,我一直對這綠洲中的廢墟感興趣,所以和這朋友一起來調查。』"}, {"k": "id", "name": "卡里斯", "hint": "角色 id 22（卡里斯）", "ck": 22, "t": "『不瞞各位,最近有一位學者幫我解讀了一篇上古經典的記載,我正在追查其中一些古物的下落,所以碰巧來到這裡..』"}]}, {"sub": 4, "sp": [{"k": "id", "name": "機甲隊長", "hint": "角色 id 116（機甲隊長）", "ck": 116, "t": "『嗶,發現入侵者!指令：保護飛行岩,交戰並殲滅入侵者。』"}, {"k": "id", "name": "機甲兵", "hint": "角色 id 111（機甲兵）", "ck": 111, "t": "『嗶,指令確認!開始動作!』"}, {"k": "id", "name": "羅德曼", "hint": "角色 id 19（羅德曼）", "ck": 19, "t": "『嘿,那是什麼怪東西？』"}, {"k": "id", "name": "卡里斯", "hint": "角色 id 22（卡里斯）", "ck": 22, "t": "『那是典籍中所記載的古代機兵,他們負責保護所有古代人所留下來的建築和設施,會將入侵者殺戮殆盡..現在沒時間說明了,準備應付這些傢伙吧!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『說到打架,我精神就來了!我們上!』"}]}, {"sub": 5, "sp": [{"k": "slot", "name": "場景#18", "hint": "場景記錄表槽位 18（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『嗶,指令系統失效.任務中止.指令傳輸關閉..』"}]}, {"sub": 6, "sp": [{"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『我怎能.在這種時候.倒下..』"}]}, {"sub": 7, "sp": [{"k": "slot", "name": "場景#17", "hint": "場景記錄表槽位 17（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『可惡.我還沒.這廢墟的秘密..』"}]}, {"sub": 8, "sp": [{"k": "id", "name": "卡里斯", "hint": "角色 id 22（卡里斯）", "ck": 22, "t": "『不愧是古代人建造的機兵,應付起來真是棘手的很.幸好大家都能獨當一面,才能順利消滅這些敵人。』"}, {"k": "id", "name": "羅德曼", "hint": "角色 id 19（羅德曼）", "ck": 19, "t": "『危機已過,現在我們可以仔細研究這個遺跡了。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『卡里斯叔叔,這遺跡到底有什麼秘密,你還沒告訴我們呢!』"}, {"k": "id", "name": "卡里斯", "hint": "角色 id 22（卡里斯）", "ck": 22, "t": "『是這樣嗎？其實我也是從古籍上看來的。據說眼前這個小丘是古代人所造的飛行用具,經由一支傳送法杖的力量,可以把擁有「天空之鑰」的人帶到黃金的城堡上去。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『天空之鑰？那不就在我們手上嗎？』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『「傳送之杖」也有啊!我們就是被它傳送到這裡來的。』"}, {"k": "id", "name": "卡里斯", "hint": "角色 id 22（卡里斯）", "ck": 22, "t": "『真的？那真是太巧了!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『我一直認為,最近大陸上的天地異變和神秘敵人都和這「黃金城」有關。在古代傳說中,黃金城總和戰爭、災厄等脫不了關係,所以我們一直都在追查這其中的關聯。』"}, {"k": "id", "name": "卡里斯", "hint": "角色 id 22（卡里斯）", "ck": 22, "t": "『這確是有加以查明的必要。索爾殿下,既然這兩件東西都已到手,可以讓我和你們一起去看看嗎？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『當然可以!有卡里斯叔叔同行,什麼對手都不足為懼了!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『是呀!』"}]}, {"sub": 9, "sp": [{"k": "id", "name": "卡里斯", "hint": "角色 id 22（卡里斯）", "ck": 22, "t": "『不愧是古代人建造的機兵,應付起來真是棘手的很.幸好大家都能獨當一面,才能順利消滅這些敵人。』"}, {"k": "id", "name": "羅德曼", "hint": "角色 id 19（羅德曼）", "ck": 19, "t": "『危機已過,現在我們可以仔細研究這個遺跡了。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『卡里斯叔叔,這遺跡到底有什麼秘密,你還沒告訴我們呢!』"}, {"k": "id", "name": "卡里斯", "hint": "角色 id 22（卡里斯）", "ck": 22, "t": "『是這樣嗎？其實我也是從古籍上看來的,據說此地可能藏有「天空之鑰」。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『我聽過這東西,據說它是通往黃金城堡的唯一方法。』"}, {"k": "id", "name": "卡里斯", "hint": "角色 id 22（卡里斯）", "ck": 22, "t": "『我們並未遇料到會有敵人出現,這回算是相當的驚險.不過,我想我還是先回城休養一下好了,將軍殿下,這裡就先交給你了。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『卡里斯叔叔,你要多保重喔!』"}, {"k": "id", "name": "卡里斯", "hint": "角色 id 22（卡里斯）", "ck": 22, "t": "『索爾殿下,您和亞雷斯也要多小心!不過以你們的表現看來,我想我是可以放心了。我們後會有期!』"}]}, {"sub": 10, "sp": [{"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『羅德曼,那你打算怎麼辦呢？我很希望能有像你這樣的武士加入,這對我們的戰力有很大的提昇。』"}, {"k": "id", "name": "羅德曼", "hint": "角色 id 19（羅德曼）", "ck": 19, "t": "『我.唉,我想.我還是不太適合。老友,我也要回城了,希望你們此行順利,都能平安歸來。..』"}]}, {"sub": 11, "sp": [{"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『唉,都是因為我的關係..』"}, {"k": "id", "name": "萊汀", "hint": "角色 id 6（萊汀）", "ck": 6, "t": "『前葷,這怎麼說？』"}, {"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『這是一件很久以前的往事了..那時羅德曼將軍還在禁衛軍統領任內,而我才剛成為禁衛軍騎士不久..』"}, {"k": "id", "name": "萊汀", "hint": "角色 id 6（萊汀）", "ck": 6, "t": "『啊!我想起來了!那時前葷妳向將軍他..』"}, {"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『是的,那時還年輕的我被感情沖昏了頭,在大庭廣眾面前向將軍表明愛意。但是將軍的夫人妮莉公主是陛下最小的妹妹,我這麼做讓他非常為難,結果將軍向陛下請調邊疆,就只為了避開我..』"}, {"k": "id", "name": "萊汀", "hint": "角色 id 6（萊汀）", "ck": 6, "t": "『原來是這樣..。』"}, {"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『那時的我傷心欲絕,雖把全部心思用在劍術上,仍然忘不了這件事,因此才又離開騎士團到深山中修練.這麼多年以後,我已經不再釋懷,但將軍還這麼在乎這件事,你們就可以知道當年我讓他多麼困擾了。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『沒關係!密蒂前葷,將軍的份就算是由妳代替了,今後妳不但是為了大家而戰,也是為了將軍而戰,過去的遺憾和感傷,就讓它在戰陣中煙消雲散!』"}, {"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『.索爾,謝謝你。我會記住這句話的。』"}]}, {"sub": 12, "sp": [{"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『羅德曼,那你打算怎麼辦呢？我很希望能有像你這樣的武士加入,這對我們的戰力有很大的提昇。』"}, {"k": "id", "name": "羅德曼", "hint": "角色 id 19（羅德曼）", "ck": 19, "t": "『老友,我很希望能與你們同行,可是我是受陛下的任命,在此擔任邊防將軍,除非有陛下的諭命,否則擅離職守視同抗命。』"}, {"k": "id", "name": "蜜蒂", "hint": "角色 id 18（蜜蒂）", "ck": 18, "t": "『是這樣嗎？.真是遺憾,我本來以為可以再看到你昔日的英姿呢..』"}, {"k": "id", "name": "羅德曼", "hint": "角色 id 19（羅德曼）", "ck": 19, "t": "『這也是件沒辦法的事.老友,保重!我得回城了。願你們此行順利,平安歸來。』"}]}, {"sub": 13, "sp": [{"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『羅德曼,那你打算怎麼辦呢？我很希望能有像你這樣的武士加入,這對我們的戰力有很大的提昇。』"}, {"k": "id", "name": "羅德曼", "hint": "角色 id 19（羅德曼）", "ck": 19, "t": "『是嗎？難得聽你這樣誇讚我,如果我這把老骨頭還能派得上用場,那當然是樂意之至。哈哈哈!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『太好啦!我知道羅德曼將軍的戰技一直都是沒話說的!』"}, {"k": "id", "name": "羅德曼", "hint": "角色 id 19（羅德曼）", "ck": 19, "t": "『唉,妳不是.妳不是希莉亞公主嗎？為何殿下.會在這裡？』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『將軍你都可以蹺班來考古了,我怎麼可以待在宮裏發呆呢？』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『好啦,別大驚小怪了,為了解決這件事情,王國的強者勇士幾乎都到齊了,我們先想想接下來要怎麼辦吧!』"}]}, {"sub": 14, "sp": [{"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『.我試了一下,這小丘上的法陣好像對這法杖上的魔力有反應,所以我想實驗看看,看能不能讓它飛起來.。』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『快試,快試!我等不及要看了!』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『好吧,那我現在就開始.米洛耶爾•希里卡恩•耶•哈洛納!』"}]}, {"sub": 15, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『地震了!』"}]}, {"sub": 16, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『哇啊啊,好可怕!』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『可能要起飛了,大家站穩!』"}]}, {"sub": 17, "sp": [{"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『哇!飛了,飛了!』"}, {"k": "id", "name": "巴拿羅西亞", "hint": "角色 id 27（巴拿羅西亞）", "ck": 27, "t": "『真是神奇!古代人的智慧和力量,果然不是我們所能想像的。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『這飛行岩開始高速飛行了.希爾法,你知道它是要飛到哪裡去嗎？』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『嗄？這.我也太不清楚,我只有使用這法杖啟動它而已,現在.現在它是在飛它自己的。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『那.那怎麼辦？我們總不能就這樣一直飛下去吧!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『別緊張..這飛天丘總會飛到一個目的地的,這是在很久以前就已經決定好了的..』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『悠妮小姐,妳知道和這飛行岩有關的事嗎？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『.好像有點印象..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『既然悠妮這麼說,我們就靜鶴其變吧!看看這玩意到底會把我們帶到哪裡去!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『呀呼!這樣飛真是過癲呢!』"}]}]}, {"res": 24, "n": 4, "head": "啊,無聊得要命.到底還要飛多久啊!", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『啊,無聊得要命.到底還要飛多久啊!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『真神奇,我們一天內就飛過了大陸西北部.從方向看來,現在應該是在前往邊界的山脈吧!』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『你是說「惡魔之山」嗎？那一帶全是未熄滅的火山啊!聽說那裡也是惡魔族的根據地.難道惡魔族也和這件事有關？』"}, {"k": "id", "name": "凱拉斯", "hint": "角色 id 16（凱拉斯）", "ck": 16, "t": "『那倒不奇怪,惡魔族本來就棲息在黑暗和地獄般的炎熱中,和其他種族向不往來,誰曉得它們暗地裡會搞出些什麼!』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『瞧,有人來迎接我們了!』"}]}, {"sub": 1, "sp": [{"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『那.那是什麼？飛行的大岩石,上面有人？』"}, {"k": "slot", "name": "場景#17", "hint": "場景記錄表槽位 17（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『笨!那是魔法驅動的飛行裝置,那些人是乘坐在上面的乘客!』"}, {"k": "slot", "name": "場景#18", "hint": "場景記錄表槽位 18（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『他們想幹什麼？想突破這裡的空域前往火焰之谷嗎？』"}, {"k": "slot", "name": "場景#19", "hint": "場景記錄表槽位 19（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『陛下吩咐過我們,絕不可讓任何人從空中或地下經過此地的!』"}, {"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『所以現在我們要宰了那些傢伙!上吧!』"}, {"k": "id", "name": "凱拉斯", "hint": "角色 id 16（凱拉斯）", "ck": 16, "t": "『哇!對方來意不善呢!好像想要動手了!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『要在這種地方打嗎？好像對我們很不利吧!』"}, {"k": "id", "name": "莎拉", "hint": "角色 id 20（莎拉）", "ck": 20, "t": "『我們的伙伴中還有幾個會飛的,勉強可以牽制敵方的攻勢,你們只要在地上確實消滅敵人就可以了!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『對方不過是會飛而已,有什麼好怕的!我們先打了再說!』"}]}, {"sub": 2, "sp": [{"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『敵軍似乎是負責鎮守這一帶的空域,以防止他人侵入.看來在惡魔之山一定有什麼事發生,大家要有心理準備,準備面對非常的狀況.』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『約拿老頭,我們的高度好像開始下降了耶!』"}, {"k": "id", "name": "莎拉", "hint": "角色 id 20（莎拉）", "ck": 20, "t": "『的確,而且越來越快了..』"}]}, {"sub": 3, "sp": [{"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『哇啊啊啊!索爾,我好怕!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『希莉亞,抓緊我!悠妮,妳也過來!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『.好!』"}, {"k": "id", "name": "洛娜", "hint": "角色 id 5（洛娜）", "ck": 5, "t": "『...!啊,亞雷斯,我頭好昏,..』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『不要緊吧？來,抓緊我!』"}, {"k": "id", "name": "洛娜", "hint": "角色 id 5（洛娜）", "ck": 5, "t": "『謝謝.,亞雷斯,你真好..』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『約拿老頭啊,我就說嘛,現在的女孩子要比以前大膽多了,連現在這種狀況都可以拿來作調情的機會,看來我們都落伍噫!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『希爾法,如果你不想被她們一腳踹下這飛行岩的話,我建議你在我們著陸前最好保持安靜..』"}]}]}, {"res": 25, "n": 8, "head": "是誰..打擾了我的睡眠..!", "blocks": [{"sub": 0, "sp": [{"k": "slot", "name": "場景#17", "hint": "場景記錄表槽位 17（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『是誰..打擾了我的睡眠..!』"}]}, {"sub": 1, "sp": [{"k": "id", "name": "火魔神", "hint": "角色 id 125（火魔神）", "ck": 125, "t": "『果然不愧是龍人族之長,終於讓你找到這裡了!』"}, {"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『你竟敢利用惡魔族來逞一己的野心私欲,實在是不可原諒!』"}, {"k": "id", "name": "火魔神", "hint": "角色 id 125（火魔神）", "ck": 125, "t": "『惡魔族本來就是我們創造的,要如何使用他們是我們的事!而且,你既然知道了這些事,我就不會讓你活著離開這裡..』"}, {"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『我手下的援軍馬上就趕到了,今天要讓你看看龍人族戰士的力量...!』"}]}, {"sub": 2, "sp": [{"k": "id", "name": "火魔神", "hint": "角色 id 125（火魔神）", "ck": 125, "t": "『真驚人的聲勢,你到底派來了什麼援軍？』"}, {"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『這.好像不是.』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『終於停了..』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『嗚.真爛的著陸法!還沒和敵人交戰就摔掉半條命了..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮,悠妮!妳沒有受傷吧？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『還好,一點傷都沒有.索爾你也還好吧？』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『哼..差別待遇喔!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『別吵了,大家都沒事吧!這裡好像就是敵方的根據地之一,我們要特別小心..』"}, {"k": "id", "name": "凱拉斯", "hint": "角色 id 16（凱拉斯）", "ck": 16, "t": "『唉!那邊有人在對峙著.好像有我們一族的龍人呢!』"}, {"k": "id", "name": "巴拿羅西亞", "hint": "角色 id 27（巴拿羅西亞）", "ck": 27, "t": "『真的？那陛下人一定在裡面!聖寇拉斯陛下!』"}, {"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『有人認識我嗎？啊!是巴拿羅西亞和凱拉斯!』"}, {"k": "id", "name": "凱拉斯", "hint": "角色 id 16（凱拉斯）", "ck": 16, "t": "『陛下,我們總算找到您了!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『聖寇拉斯,好久不見了,沒想到會和你在這裡會師!』"}, {"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『啊!原來是約拿先生,好極啦,有你手下這批生力軍,這下子就沒問題了!』"}, {"k": "id", "name": "火魔神", "hint": "角色 id 125（火魔神）", "ck": 125, "t": "『哼,果然是你找來的援軍沒錯,你們都準備死在這裡吧!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這怪傢伙還真寬張,亞雷斯,我們合力宰了他!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『對!送他去和他的前三個伙伴相會!』"}, {"k": "id", "name": "火魔神", "hint": "角色 id 125（火魔神）", "ck": 125, "t": "『什麼!難道.難道地水風三個魔神都已經被你們打倒了？可惡,我火魔神要替他們一併把這筆血債討回來!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『少囉唸!有種就放馬過來吧!』"}]}, {"sub": 3, "sp": [{"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『約拿.你要代替我.打倒這幫傢伙,要不然.這世界會..』"}]}, {"sub": 4, "sp": [{"k": "slot", "name": "場景#61", "hint": "場景記錄表槽位 61（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『.可惡,主人不會放過你們的..到時候你們就會和這世界一起毀滅..』"}]}, {"sub": 5, "sp": [{"k": "slot", "name": "場景#62", "hint": "場景記錄表槽位 62（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『聖寇拉斯陛下,我們來遲了!』"}, {"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『還不睌,先把火魔神打倒再說吧!』"}, {"k": "slot", "name": "場景#62", "hint": "場景記錄表槽位 62（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『遵命!』"}]}, {"sub": 6, "sp": [{"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『真是驚險的一戰!約拿老頭,你從哪裡找來這些生力軍？如果沒有他們,這一戰的結果就會改鶴了。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『他們是一群富正義感的年輕勇士,因為機緣巧合同聚一堂,之後為了打倒暗中威脅這整個大陸的敵人而和我一起奮戰至今。』"}, {"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『好極了,我正愁來不及召集一支夠強的軍隊!據我調查的結果,這熔岩洞窟中有通道通往一個古代人的遺跡,據說從那裡可以直達黃金的城堡。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『所謂黃金的城堡,就是指敵人的根據地嗎？』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『很難說,我們要去確認之後才知道。』"}, {"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『敵人似乎怕我們發現這一點,所以剛才那傢伙企圖施用魔法讓火山爆發,徹底毀滅這條通道,但這樣也會毀了惡魔族的棲息之地.幸好你們及時抵達,才沒有讓那傢伙得逞。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『好極了,咱們趕快前往遺跡吧,這次絕不能再讓敵人搶先了!』"}]}, {"sub": 7, "sp": [{"k": "id", "name": "亞齊梅吉", "hint": "角色 id 29（亞齊梅吉）", "ck": 29, "t": "『等等!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『唉,敵方還有漏網之魚嗎？』"}, {"k": "id", "name": "亞齊梅吉", "hint": "角色 id 29（亞齊梅吉）", "ck": 29, "t": "『別誤會,我是來加入你們一行的。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『你會說人類的語言？這可有趣了。』"}, {"k": "id", "name": "亞齊梅吉", "hint": "角色 id 29（亞齊梅吉）", "ck": 29, "t": "『我是當今惡魔族之王卡爾根的弟弟,王家魔法師亞奇梅吉。我平日對人類和大陸上的其他種族有很深的研究,所以通曉你們的語言。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『你的種族剛剛才聯合火魔神與我們為敵,為何現在你又要加入我們？』"}, {"k": "id", "name": "亞齊梅吉", "hint": "角色 id 29（亞齊梅吉）", "ck": 29, "t": "『我族並不是故意要與你們為敵,因為敵人以邪法控制了王兄的神智,藉以命令我族的戰士來抵擋你們的攻勢。我看穿這一點之後,敵人便假王兄之手將我軟禁起來,還好你們阻止了他們,不然整個惡魔族可能會就此滅亡。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『原來如此,你對敵人的所知有多少？』"}, {"k": "id", "name": "亞齊梅吉", "hint": "角色 id 29（亞齊梅吉）", "ck": 29, "t": "『我相信他們和古代人的遺跡以及黃金城絕對有關連,他們可能是從附近的遺跡來到這個世界的,所以當務之急是經由本地的通道前往遺跡,以免他們再度增援。』"}, {"k": "id", "name": "凱拉斯", "hint": "角色 id 16（凱拉斯）", "ck": 16, "t": "『好極了,那接下來便由你來帶路了。』"}, {"k": "id", "name": "亞齊梅吉", "hint": "角色 id 29（亞齊梅吉）", "ck": 29, "t": "『樂意之至!我們這就走吧!』"}]}]}, {"res": 26, "n": 12, "head": "嘿,這是什麼怪地方？.這種景色以前從沒看過!", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『嘿,這是什麼怪地方？.這種景色以前從沒看過!』"}, {"k": "id", "name": "亞齊梅吉", "hint": "角色 id 29（亞齊梅吉）", "ck": 29, "t": "『這條通道據說是古代人所建造的,歷代的惡魔族之王都禁止族人進入此地,似乎踏進這通道就會招來可怕的災禍..』"}, {"k": "id", "name": "聖寇拉斯", "hint": "角色 id 26（聖寇拉斯）", "ck": 26, "t": "『我感到災禍好像已經在眼前了,那些看起來像玩偶的東西是什麼？』"}, {"k": "id", "name": "機甲隊長", "hint": "角色 id 116（機甲隊長）", "ck": 116, "t": "『入侵者發現!指令：防衛及消除威脅的存在,方法：接戰並消滅。』"}, {"k": "id", "name": "機甲兵", "hint": "角色 id 111（機甲兵）", "ck": 111, "t": "『命令確認!目標分析完畢!啟動!執行接戰指令!』"}, {"k": "id", "name": "聖寇拉斯", "hint": "角色 id 26（聖寇拉斯）", "ck": 26, "t": "『那是什麼？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『簡單的說,那是古代人建造的機器守衛,用來防守他們的遺跡和據點的.沒時間解釋了,我們準備動手吧!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『小心!它們要衝過來了!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『敵人的數量比上次更多了,大家小心應戰!』"}]}, {"sub": 1, "sp": [{"k": "slot", "name": "場景#16", "hint": "場景記錄表槽位 16（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『.嚴重受損,指揮控制不能.系統關閉..』"}]}, {"sub": 2, "sp": [{"k": "plain", "t": "『那是什麼奇怪的東西？\n 頭部還開著？』"}]}, {"sub": 3, "sp": [{"k": "plain", "t": "『這機兵的頭部怎麼開著？這\n 個金屬盒子.好像滿適合的\n ,應該是這樣放進去...\n 唉!』"}]}, {"sub": 4, "sp": [{"k": "id", "name": "渥德", "hint": "角色 id 31（渥德）", "ck": 31, "t": "『系統啟始,請指示操作碼及行動模式。』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『這.好像是01E0C244-FE2C51932。』"}, {"k": "id", "name": "渥德", "hint": "角色 id 31（渥德）", "ck": 31, "t": "『確認。主人,01279943渥德,回復到正常操作狀態,請指示。』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『我為什麼記得這些東西？.好吧,幫我們打倒那些機兵!能理解嗎？』"}, {"k": "id", "name": "渥德", "hint": "角色 id 31（渥德）", "ck": 31, "t": "『理解,指令內容確認,系統資料重設.待命狀態完成。完畢。』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『目標清除後即解除一級戰鬥狀態,並確認所有我方目標。等待下一次戰鬥指示碼。』"}, {"k": "id", "name": "渥德", "hint": "角色 id 31（渥德）", "ck": 31, "t": "『了解。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮,妳在那邊做什麼？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『沒.沒什麼,我說服了這個機甲兵幫我們作戰。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『哇塞,悠妮妳真厲害!』"}]}, {"sub": 5, "sp": [{"k": "id", "name": "亞齊梅吉", "hint": "角色 id 29（亞齊梅吉）", "ck": 29, "t": "『好極了,我們迅速擊潰了敵方機甲兵,現在可以馬上前往遺跡,不過我們還是對敵人的底細一無所知..悠妮小姐,妳的護衛也是古代人所造的機甲兵吧？』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『是的,她初次和我們相遇時就帶著蓋亞。』"}, {"k": "id", "name": "亞齊梅吉", "hint": "角色 id 29（亞齊梅吉）", "ck": 29, "t": "『是這樣嗎？.悠妮小姐,我看妳一定知道些什麼,有關古代人和這批機甲兵的秘密..是吧？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『古代人？機甲兵？..那是什麼東西？我不知道!』"}]}, {"sub": 6, "sp": [{"k": "id", "name": "亞齊梅吉", "hint": "角色 id 29（亞齊梅吉）", "ck": 29, "t": "『好極了,我們迅速擊潰了敵方機甲兵,現在可以馬上前往遺跡.嘿,隊伍裏怎麼有個敵方機甲兵？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『那是悠妮幫我們拉進伙的,她和機甲兵一直很有緣。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『是啊,她初次和我們相遇時就帶著蓋亞。』"}, {"k": "id", "name": "亞齊梅吉", "hint": "角色 id 29（亞齊梅吉）", "ck": 29, "t": "『是這樣嗎？.悠妮小姐,我看妳好像知道機甲兵的啟動碼,是吧？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『啊？啟動碼.那是什麼東西？我不知道!』"}]}, {"sub": 7, "sp": [{"k": "id", "name": "亞齊梅吉", "hint": "角色 id 29（亞齊梅吉）", "ck": 29, "t": "『是嗎？悠妮小姐,我看妳一定知道!妳到底是從哪裡來的？妳絕不是一般人類!為了我們大家,把話說個清楚吧!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『.不.不要再說了!.我什麼都不知道..』"}]}, {"sub": 8, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『亞奇梅吉,夠了!你要是把她弄哭了,我絕不斃你!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『.算啦,不要逼問她了,反正上了黃金城,相信一切的謎題自然都會解開的!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『好,那就一鼓作氣衝過去,我們這就走吧!悠妮,跟著我!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『...』"}]}, {"sub": 9, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『亞奇梅吉,夠了!你要是把她弄哭了,我絕不斃你!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『.算啦,不要逼問她了,問這個機甲兵也是一樣..喂,那個機甲兵。』"}, {"k": "id", "name": "渥德", "hint": "角色 id 31（渥德）", "ck": 31, "t": "『01279943渥德,命令確認。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『你叫渥德嗎？請回答我的問題。』"}, {"k": "id", "name": "渥德", "hint": "角色 id 31（渥德）", "ck": 31, "t": "『了解,記憶庫連接,資料載入待命。請指示。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『你們的種族來自何方？領導者又是誰？』"}, {"k": "id", "name": "渥德", "hint": "角色 id 31（渥德）", "ck": 31, "t": "『記憶庫搜尋,資料#73324：01279943渥德隸屬第六機甲戰鬥團第三戰鬥中隊,全師團由第一空中要塞建造,在執行第七號戰鬥防衛命令時,經由轉送站送到地表。我們的領導者是全能的創造者,他可以任意創造機械和生命,是這個大地的主宰者,我們並不知道領導者的名字,那不在我們的記憶庫領域之內。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『.從未聽過這種事.好吧,那你們為何要攻擊這個大陸？』"}, {"k": "id", "name": "渥德", "hint": "角色 id 31（渥德）", "ck": 31, "t": "『資料庫搜尋,資料#2074213：第六機甲戰鬥團奉命執行第七號戰鬥防衛命令,主要目標：絕滅X-07地區的敵方生命體,防止任何敵方單位進入轉送站;但就最後的記錄,本次作戰已告中止,而01279943渥德在遭受敵方攻擊之後,誤動安全裝置導致能源單位彈出,系統中斷至今,並未再接到過任何更新的作戰命令。』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『這傢伙的話還真是難懂.約拿老頭,你聽懂了多少？』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『我只知道這位渥德老兄好像並未參與這次的攻擊,不過一切麻煩的根源似乎都來自所謂的「第一空中要塞」,它也可能就是「黃金的城堡」,由古代人所建造的.飛行堡壘,兼具建造機甲兵的能力..』"}, {"k": "id", "name": "聖寇拉斯", "hint": "角色 id 26（聖寇拉斯）", "ck": 26, "t": "『古代人不是早在數萬年前的最終戰爭中就死光了嗎？為什麼這個要塞還能發動攻擊？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這個「黃金城」會不會是由類似的機甲兵所控制,由於沒有收到所謂的中止作戰指令,所以仍在執行以前的作戰行動？』"}, {"k": "id", "name": "萊汀", "hint": "角色 id 6（萊汀）", "ck": 6, "t": "『很有可能,古代人建造這種飛行要塞,主要目的應該就是空中制壓和對地攻擊,但最終戰爭早在數萬年前就已經結束了,為何到現在才又開始行動？』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『看來只有上黃金城一趙,這一切的謎題才能夠解開!渥德,你所說的轉送站在哪裡？』"}, {"k": "id", "name": "渥德", "hint": "角色 id 31（渥德）", "ck": 31, "t": "『就位在這地下通道的出口處。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『好,那就一鼓作氣衝過去,我們這就走吧!悠妮,跟著我!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『...』"}]}, {"sub": 10, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮,怎麼了？是不是.我的口氣太粗魯了？對不起!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『不是的,索爾,我好迷惑..我到底是誰？這一切.到底和我有什麼關連？我真的不知道.我好怕我會給你帶來災禍,也許一開始你就不該救我的..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮,我永遠都會相信妳的!只要有妳和我在一起,我什麼也不怕!我們不是都來到這裡了嗎？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『可是.可是.』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『剛才的事就當它沒發生過,來,我們一起走過去!』"}]}, {"sub": 11, "sp": [{"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『其實亞奇梅吉說的也沒錯.這樣子好嗎？』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『這個年輕人得到神的庇佑,我想我們應該尊重他的決定.不多說了,我們走吧!』"}, {"k": "id", "name": "亞齊梅吉", "hint": "角色 id 29（亞齊梅吉）", "ck": 29, "t": "『也只能這樣了!』"}]}]}, {"res": 27, "n": 24, "head": "這裡就是遺跡了嗎？果然是個很詭異的地方!", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這裡就是遺跡了嗎？果然是個很詭異的地方!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『此地不僅詭異,還有大批敵人呢!準備迎敵吧!』"}]}, {"sub": 1, "sp": [{"k": "id", "name": "機甲隊長", "hint": "角色 id 116（機甲隊長）", "ck": 116, "t": "『嗶!緊集狀況,請求支援!』"}]}, {"sub": 2, "sp": [{"k": "id", "name": "機甲隊長", "hint": "角色 id 116（機甲隊長）", "ck": 116, "t": "『.擎告,任務中止.ASR-07出現異常現象,原因無法解析..』"}]}, {"sub": 3, "sp": [{"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『中央的平台似乎就是傳送的地點,就看「天空之鑰」能否發生作用了!』"}]}, {"sub": 4, "sp": [{"k": "slot", "name": "場景#36", "hint": "場景記錄表槽位 36（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『嗶!敵人及目標出現,準備進行第6號戰鬥指令。』"}, {"k": "slot", "name": "場景#37", "hint": "場景記錄表槽位 37（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『命令確認。目標位置標定,系統作用功率全開。2秒後動作開始。』"}]}, {"sub": 5, "sp": [{"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『呀———』"}]}, {"sub": 6, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮!可惡.竟敢對她下手!我斃不了你們!』"}, {"k": "slot", "name": "場景#36", "hint": "場景記錄表槽位 36（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『制御及管理中樞ASR-07,完成記憶庫連接。進行控制程式更新及損壞資料排除。』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『啊!我的頭!.我的頭好像要炸開來了..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮!』"}]}, {"sub": 7, "sp": [{"k": "slot", "name": "場景#36", "hint": "場景記錄表槽位 36（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『故障排除完成,初步檢查對應：各系統完好無損。ASR-07,繼續執行你的任務。完畢。』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『我.我.為什麼..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮!悠妮!妳還好吧!..唉,妳.妳為什麼哭了？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『索爾,別管我,.不管怎樣,先打倒這些傢伙,別的以後再說..』"}, {"k": "slot", "name": "場景#36", "hint": "場景記錄表槽位 36（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『ASR-07,你有敵對反應!你是我們的中樞之一,不該對我們有敵對意志!』"}, {"k": "slot", "name": "場景#37", "hint": "場景記錄表槽位 37（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『緊急狀況,ASR-07出現預期外現象,快通知最高控制中樞..』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『敵人就在眼前了,趕快發動攻擊啊!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『對啊!我在發什麼呆,大家上!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『一切的謎底就在眼前了!』"}]}, {"sub": 8, "sp": [{"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『就是這個了,轉送站.好久沒看到這種東西了..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮？妳還好吧？』"}]}, {"sub": 9, "sp": [{"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『索爾,所有過去的事,我都想起來了。請原諒我騙了你,可是那時我真的不知道..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮,不管是為了什麼事,我都不會怪妳。我只是想送妳回家.就這樣而已,相信我吧!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『好,那麼.我的家就在這上面,你願意.送我回家嗎？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『當然!這不是我們的約定嗎？』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『索爾,你要小心!這女孩變得很奇怪,說不定她原本是敵方的人..』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『約拿先生,希爾法大師,你們所謂的敵人就在這轉送站之後,被你們稱為「黃金城」的第一空中要塞上..如果你們想打倒他,就跟著我來,不然的話,就我和索爾上去也可以..你們意下如何呢？』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『..悠妮小姐,妳的記憶全部甦醒了嗎？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『是的。我在受到剛才那個機兵的傳導衝擊之後,受損的記憶部份強制還原了,它們認為我會回到它們那一方,可惜的是,我這段日子以來的記憶並沒有因此消失..我已經不是以前的我了。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『為什麼？.我知道妳並不是這個世界的人,但為何妳會為了我們..』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『.自私一點來說,我並不是為了你們,我是為了一個一直保護我、照顧我的人..像我這樣的人是很悲哀的,我們擁有人的一切,郎不能做任何平凡人所能做的事情,所以,我很珍惜這次的經歷..我不容許那個無視這一切的傢伙傷害他和他所愛的這個世界。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『.我明白了。悠妮小姐,我很高興妳自始至終都會是我們的伙伴.要對付那個傢伙,光妳和索爾是不行的,就讓我們大家一起來吧!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『約拿先生,謝謝你..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮,你們在說些什麼啊!我怎麼聽不太懂.』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『.索爾,等到上了黃金之城,我會讓你知道所有你想知道的,在此之前就不要再問起這些事情了.答應我好嗎？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『當.當然!我也只是隨口問問而已,就當我沒說好啦!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『好啦!大家可以整裝待發了,準備迎向最後的敵人!悠妮小姐,請妳啟動轉送裝置吧!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『好的,請大家在這平台上站好,索爾,請把「天空之鑰」給我。』"}]}, {"sub": 10, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『是這個吧!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『謝謝。大家站好了.』"}]}, {"sub": 11, "sp": [{"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『.01327--344621073。識別碼辨識完成.第一空中要塞,請解除出入區防護障壁,預定五秒後啟動轉送程序。』"}]}, {"sub": 12, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『唔哇啊啊啊!..』"}]}, {"sub": 13, "sp": [{"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『索爾,所有過去的事,我都想起來了。請原諒我騙了你,可是那時我真的不知道..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮,不管是為了什麼事,我都不會怪妳,我只是想送妳回家.相信我吧!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『.索爾,謝謝你.一路從羅特帝亞到這裡,你一直都那麼照顧我、保護我..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這是我該做的,你知道.我一直對妳.對妳..』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『我明白。索爾,但現在是我們分離的時刻了,如果我現在不走,就會太遲了..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『為什麼？不是約好要我送你回家的嗎？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『沒有天空之鑰,只有我能直接從此地前往黃金城。索爾,請忘了我吧,我並不是一般的人類,既不能也沒有資格接受你的感情,這是命運的安排吧..』"}]}, {"sub": 14, "sp": [{"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『系統權限強制插入,A1型分解傳送啟動待命,座標1-1-72.』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮!不要做傻事!』"}]}, {"sub": 15, "sp": [{"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『索爾,不要過來!為了你,也為了這個世界..讓我為你做這最後的一件事吧!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『悠妮小姐!有關這一切事件的來龍去脈,我們還需要向妳請教..』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『沒有必要了,我會帶走這代表災厄的黃金之城,就像很久很久以前一般,讓它沉睡在一個誰也找不到的地方.時間的洪流會把它的痕跡從人們的記憶中抹去,我想,這會是最好的結果吧..』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『這樣嗎？.也許妳的決定是對的,但沒有其他方法了嗎？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『沒有,我必須自己去面對最後的一戰.各位,再見了,和大家這段日子的相處,讓我永難忘懷.』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮!不要!不要走!讓我幫妳..』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『索爾,永別了,我永遠永遠也不會忘記你的,希望你以後幸福快樂..』"}]}, {"sub": 16, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮!悠妮!..』"}]}, {"sub": 17, "sp": [{"k": "plain", "t": "『看!是.是黃金城!』"}]}, {"sub": 18, "sp": [{"k": "plain", "t": "『啊!又.又消失了!』"}]}, {"sub": 19, "sp": [{"k": "plain", "t": "『這次.是永遠的消失了吧!\n 』"}]}, {"sub": 20, "sp": [{"k": "plain", "t": "『是的!就像她所承諾的,到\n 一個沒有人找得到的地方去\n 了.』"}]}, {"sub": 21, "sp": [{"k": "plain", "t": "『黃金城傳說.看來永遠都會\n 是個解不開的謎了..』"}]}, {"sub": 22, "sp": [{"k": "plain", "t": "『索爾..』"}]}, {"sub": 23, "sp": [{"k": "plain", "t": "『.再見了,悠妮!雖然妳的\n 離去只留下了更多的謎題,\n 但在未來的歲月中,我仍會\n 永遠記得妳.和這段非凡的\n 冒險..』"}]}]}, {"res": 28, "n": 8, "head": "這裏就是黃金城嗎？好奇怪的建築,這哪像什麼城堡!", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這裏就是黃金城嗎？好奇怪的建築,這哪像什麼城堡!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『說是一座金屬作成的要塞還差不多,從外面的雲海看來,我們好像是在很高的地方!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『這裡是用來傳送機甲兵團到地上用的轉送站,由此就可以進入黃金城內部。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『看來古代人必定擁有極高度的文明..這種冶金和構築的技術,絕對不是現有的文明或魔法所能做到的。』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『如果有時間的話,真希望能好好的研究一下此地。』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『可惜我們沒什麼時間了,我怕那傢伙會啟動最終兵器「黑暗之焰」,無論如何我們要趕快找到他才行..』"}]}, {"sub": 1, "sp": [{"k": "slot", "name": "場景#20", "hint": "場景記錄表槽位 20（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『注意!發現並確認敵單位!』"}, {"k": "slot", "name": "場景#21", "hint": "場景記錄表槽位 21（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『一級擎告!敵單位與ASR-07從轉送站進入C-01地區,本地區防衛部隊立刻進入防衛體勢,座標0177-03-42。重複一次,敵單位已進入要塞,立刻採取防衛體勢。』"}, {"k": "slot", "name": "場景#20", "hint": "場景記錄表槽位 20（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『本區防衛隊立刻開始防衛行動,交戰並殲滅敵目標。』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『有麻煩了,我們趕快解決這些防衛隊,在這裡作戰無險可守。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『這些機甲衛兵還不都是一些老貨色,相信很快就可以解決掉。我們上吧!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『我們身處敵境,大家要特別小心些!』"}]}, {"sub": 2, "sp": [{"k": "id", "name": "機甲隊長", "hint": "角色 id 116（機甲隊長）", "ck": 116, "t": "『.嚴重受損,指揮控制不能.系統關閉..』"}]}, {"sub": 3, "sp": [{"k": "id", "name": "機甲隊長", "hint": "角色 id 116（機甲隊長）", "ck": 116, "t": "『C-02地區,第一防衛隊抵達。轉送辨識及接戰資料。』"}]}, {"sub": 4, "sp": [{"k": "id", "name": "機甲隊長", "hint": "角色 id 116（機甲隊長）", "ck": 116, "t": "『C-02地區,第二防衛隊抵達。轉送辨識及接戰資料。』"}]}, {"sub": 5, "sp": [{"k": "id", "name": "機甲隊長", "hint": "角色 id 116（機甲隊長）", "ck": 116, "t": "『C-02地區,第三防衛隊抵達。轉送辨識及接戰資料。』"}]}, {"sub": 6, "sp": [{"k": "id", "name": "機甲隊長", "hint": "角色 id 116（機甲隊長）", "ck": 116, "t": "『轉送完成。目標及命令確認,防衛行動開始。』"}]}, {"sub": 7, "sp": [{"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『大家都沒事吧？我們趕快離開這裡,要不然敵方防衛隊會不斷向這裡湧來。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『接下來要往哪裡呢？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『到黃金城的核心區域,我必須奪回中樞系統的控制權,這樣我就可以解除要塞中大部份防衛部隊的戰鬥狀態。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『.聽不懂。就照妳說的吧!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『嘻,聽不懂是正常的!我來帶路,往這邊走!』"}]}]}, {"res": 29, "n": 16, "head": "..,這是什麼？還是要悠妮來才行!", "blocks": [{"sub": 0, "sp": [{"k": "plain", "t": "『..,這是什麼？\n 還是要悠妮來才行!』"}]}, {"sub": 1, "sp": [{"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『就是這裡了!系統識別碼.0370425188.啊,這是.』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮,怎樣？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『中樞撤銷最高級系統防護需要一些時間,我想還要再等一會兒!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『沒關係!倒是妳自己可要多小心些!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『好的!』"}]}, {"sub": 2, "sp": [{"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『奇怪,終端竟然抗拒我的命令,有人對防衛系統動了手腳!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮,怎樣了？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『糟糕,系統進入了最終防衛狀態!這.』"}]}, {"sub": 3, "sp": [{"k": "id", "name": "火龍", "hint": "角色 id 104（火龍）", "ck": 104, "t": "『擎告!中樞部有敵人侵入!』"}]}, {"sub": 4, "sp": [{"k": "id", "name": "火龍", "hint": "角色 id 104（火龍）", "ck": 104, "t": "『最終防衛狀態啟動!』"}]}, {"sub": 5, "sp": [{"k": "id", "name": "火龍", "hint": "角色 id 104（火龍）", "ck": 104, "t": "『對外系統連結閉鎖!自我防護裝置啟動!』"}]}, {"sub": 6, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮,小心!那三條龍是..』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『事到如今,也只能這樣做了.大家聽著,這三條巨龍形狀的東西是黃金城的防衛中樞,由於敵人的干擾,我們現在已經無法控制防衛中樞,必須集合大家的力量來把它們徹底摧毀!』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『怎麼摧毀？用武器砍爛嗎？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『是的,直接攻擊它們就行了!不過它們都有防衛裝置保護,防衛裝置的威力極為強大,千萬不可大意!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『知道了!大家上吧!』"}]}, {"sub": 7, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『好累,拐了半天路,頭都快暈了..』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『沒辦法,為了少打一些無謂的仗以保留大家的實力,盡量避開其它的守衛隊是必須的。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『唔!這地方蘊含著極強大的能量,其威力之強是我前所未見的.』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『是的,這裡就是黃金城的核心,次元反應爐。這反應爐不但產生整個要塞所需的動力,以某種方法將它的反應逆轉,也可以讓它成為恐怖的最終兵器..』"}, {"k": "id", "name": "貝克威", "hint": "角色 id 13（貝克威）", "ck": 13, "t": "『那我們現在該怎麼辦？破壞它嗎？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『不!並不需要破壞它,在這核心區的北方,就是要塞的中樞控制系統,只要有這天空之鑰,我就可以接管要塞的中樞系統,經由我的終端連接內部網路來控制整個要塞。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮,想不到妳有這種能力,我好佩服妳!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『是嗎？想要有這種能力,可是要付出可怕的代價的.不多說了,我們這就過去吧。』"}]}, {"sub": 8, "sp": [{"k": "slot", "name": "場景#54", "hint": "場景記錄表槽位 54（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『嗶,目標發現並確認!執行作戰指令!間接座標傳輸完成,防衛用障壁啟動!各單位,確實殲滅所有敵目標!不需顧慮ASR-07!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『哼,有埋伏!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『地形差了一點是真的,但要戰勝應該還不是難事。』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『這裡現在還完全在敵方的控制之下,我們千萬不能掉以輕心。大家設法護送我到前面的控制盤去就可以了,只要讓我有機會把「天空之鑰」安裝好,我就能讓這些防衛部隊全部變成廢鐵。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『沒問題,包在我身上!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『我們趕快動手吧,可別讓敵人搶了先機!』"}]}, {"sub": 9, "sp": [{"k": "slot", "name": "場景#1", "hint": "場景記錄表槽位 1（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『.不.我不能輸給那傢伙.索爾.索..』"}]}, {"sub": 10, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『成了!』"}]}, {"sub": 11, "sp": [{"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『好極了,防衛中樞已經完全停止,雖然我們失去了指揮其他防衛部隊的能力,但往後敵人也無法再利用防衛部隊來阻止我們。多謝大家的幫忙,現在只要再接管剩下的系統,便可以防止對方使用最終兵器。』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『好極了,那我們接下來要怎麼做？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『找出最後的敵人,我相信他是這一切事件的背後主使者,他是.』"}, {"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『是指我嗎？』"}]}, {"sub": 12, "sp": [{"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『是.是你!真的是你!』"}, {"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『ASR-07,妳的系統真的受損這麼重嗎？居然認敵為友,實在令我無法理解.不過,還是很感激妳幫我送回這單元計算晶片,有了它,一直處在中止狀況的「黑暗之焰」計畫就可以繼續下去了..』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『為何你始終不肯放棄這個瘋狂的計畫？!』"}, {"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『這些地上的螻蟻,有什麼留存的必要!我們當初接到的命令不就是毀滅牠們嗎？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『但我們最後接到了中止命令!「黑暗之焰」作戰已經中止了!』"}, {"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『是中止,不是取消!那些傢伙命令我們進行最終計畫,把我們留在這個該死的星球上,然後自己就逃到外太空去了!想想我們已經等了多久!已經多久了!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『ASR-06,看來你的系統果然故障了!在上一次的意外中.你一直沒有試著去自我修復嗎？』"}, {"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『沒有必要!我的使命就是執行作戰計畫。現在我終於可以開始履行我的職務了..』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『不可能的,我已成功的和最高命令系統連接,現在整個要塞的中樞都在我的控制之下!』"}, {"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『別傻了,妳忘了我身為軟視暨戰鬥系統,在使用武器上有最高的優先權限嗎？即使妳掌握著整個系統中樞,攻擊電腦仍然會接受我的命令..』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『你..』"}, {"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『黑暗之焰系統三十秒後啟動,目標馬拉大陸!哇哈哈哈,我等這一刻好久了!』"}]}, {"sub": 13, "sp": [{"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『.好,既然如此,我只有用最後一著了!..』"}]}, {"sub": 14, "sp": [{"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『妳想幹什麼？妳阻止不了我的..不,不,妳不能這樣做!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『你啟動了黑暗之焰,我就讓反應爐逆轉!等到能量積蓄突破亞空間障壁的負荷量,引發空間扭曲,我們就一起和這黃金城在超空間中永恆的漂流吧!』"}, {"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『.妳這樣做,這些人也難逃一劫!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『若讓你啟動了「黑暗之焰」,會有更多無辜的人因此喪命!為了保護這個大家所珍惜愛護的世界,相信.相信大家不會怪我的!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『悠妮,做得好!無論如何,我們都不能和邪惡之徒妥協!』"}, {"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『我們這些老頭子早就都已經活得膩了,只可惜了這些前途大好的年輕人們..』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『我們的傳奇會留在羅特帝亞和馬拉大陸的歷史上吧!身為一個武士,這就是最高的的回報了!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『對不起,如果.如果今天我沒有把大家帶到這黃金城上來,或許就不會這樣了.』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮,我自始至終都相信妳的抉擇,今天會有這種結果全是這傢伙的錯,不管怎樣,我要先劈他兩劍再說!』"}, {"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『笨蛋,來送死吧!』"}]}, {"sub": 15, "sp": [{"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『反、反應爐超過負荷了!.』"}]}]}, {"res": 30, "n": 11, "head": "唔.我們還活著嗎？", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『唔.我們還活著嗎？』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『好強烈的震動!不過我沒有感覺到什麼異狀..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『嘿,這是怎麼回事？』"}, {"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『哼,我們的命真大.看來次元反應爐並未完全失效,雖然超荷的磁界能量爆發造成了部份的空間扭曲,不過這應該是暫時性的,影響並不很大。哼哼哼..』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『ASR-06,我們才剛撿回一條命難道你還.？』"}, {"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『ASR-07,我偉大的計畫差點毀在你手裏,這次我不會再重蹈覆轍了,我要先把你和這幫螻蟻徹底消滅掉,再重新開始執行計畫..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『欠揍的傢伙,到現在你居然還不死心,你真的把我給搞火了..今天非宰了你不可!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『來吧!伙伴們,我們一起消滅這個萬惡的原凶!』"}, {"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『哄哄哄...一群不知死活的傢伙。』"}, {"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『都出來吧!』"}]}, {"sub": 1, "sp": [{"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『唉!這些傢伙不是早就被我們擺平了？怎麼又.』"}, {"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『ASR-07,你不在的這段時間我致力於發展生化合成人,這四個魔神就是我的得意傑作!它們不過我製造出來的生命體,所以損失了隨時可以再造.這一批是我最新的改良版本,絕對不會再輸給你們!』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『.哼,等一下!』"}, {"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『你還有什麼遺言嗎？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『身為這個要塞的兩大中樞,我們本來應該協力共事的,很遺憾我們今天必須傾力對決..所以我也不需再隱藏了,就讓你看看第一空中要塞控制暨管理中樞真正的力量吧!』"}]}, {"sub": 2, "sp": [{"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『唉,上一場仗中身上受的傷都痊癒了!』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『.,我覺得身上重新充滿了力量!』"}, {"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『哼哼.想不到你還有這種能力,這樣不過能讓這些螻蟻撐久一點而已.勝利仍將會屬於我!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『少囉唸了,要打架就過來啊!』"}, {"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『大地的代言者,讓這些愚者知道創造者的威嚴!』"}, {"k": "id", "name": "地魔神", "hint": "角色 id 122（地魔神）", "ck": 122, "t": "『地魔神領命!』"}]}, {"sub": 3, "sp": [{"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『水與冰的女王,將這些傢伙冰封在永恆的死之牢獄中!』"}, {"k": "id", "name": "水魔神", "hint": "角色 id 123（水魔神）", "ck": 123, "t": "『水魔神領命!』"}]}, {"sub": 4, "sp": [{"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『狂風的吟唱者,用你的利刃將他們撕裂成血肉的飛霧!』"}, {"k": "id", "name": "風魔神", "hint": "角色 id 124（風魔神）", "ck": 124, "t": "『風魔神領命!』"}]}, {"sub": 5, "sp": [{"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『烈焰的主宰,燃起你的地獄之火,把他們燒得連灰都不剩!』"}, {"k": "id", "name": "火魔神", "hint": "角色 id 125（火魔神）", "ck": 125, "t": "『火魔神領命!』"}]}, {"sub": 6, "sp": [{"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『遺憾得很,不識抬舉的你們竟然選擇接受終末的天罰.膽敢違抗神的意志的螻蟻們迎接你們的最後一刻吧!』"}]}, {"sub": 7, "sp": [{"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『.我不能就這樣倒下.控制系統.索爾..』"}]}, {"sub": 8, "sp": [{"k": "id", "name": "空魔神", "hint": "角色 id 126（空魔神）", "ck": 126, "t": "『這怎麼可能.我是至高無上的創造者和支配者.竟然會被這些卑微的螻蟻給打倒..不..』"}]}, {"sub": 9, "sp": [{"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『總算結束了..這個很久以前就鑄成的錯誤,終於就此消失在時間的洪流之中了..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『.我們終於打贏了這場仗!悠妮,真是太好了!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『很高興我們終於解決了這件事情..不過,身為一個學者,我總想知道這一切的來龍去脈.悠妮小姐,妳能給我們一個說明嗎？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『...我就簡短的說明吧。這個空中要塞,以及我和空魔神,都是古代人所製造的惡魔族也是古代人發展出來的戰鬥用生物。..那時古代人正在互相爭戰,為了獲取勝利,雙方製造出無數的恐怖武器,這個要塞就是其中一個..』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『自古流傳的「審判之日」戰爭嗎？據說那場戰爭毀滅了天空與大地,直到數萬年後萬物才再次復興..』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『是的。雙方使用最終武器互相攻擊,最後只有少數古代人的領袖乘著飛行器離開了這個星球,其他的都死在這場戰爭中..這個要塞是為了對地壓制攻擊而建造的,我和空魔神是負責控制這要塞的中樞,我控制和維持要塞的運行,空魔神——不,ASR-06則負責對地面的軟視和武器的使用,換言之,這個要塞是由我和空魔神所一起指揮的。』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『真令人難以想像..』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『我們都以人的肉體接受過特殊的再造和強化手術,能夠直接以意志和系統連接並傳達各項命令,而且能以休眠的方式來防止肉體上的衰老所以,在理論上我們可以永生不死,永遠擔任空中要塞的控制工作。』"}]}, {"sub": 10, "sp": [{"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『就在殘餘的古代人要撤離此地的時候,我們收到攻擊指令,命令我們用最終兵器「黑暗之焰」轟炸地表。可是就在執行命令的前一刻,郎又收到模糊的訊號,命令我們中止攻擊。之後我們再也沒有收到過任何訊號,我們就這樣等待著永遠也不會再有的戰鬥命令,和這座孤伶伶的要塞在天空中飄盪了三萬年的時光。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『三.三萬年!妳不會覺得很寂寞嗎？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『不。我們都處在休眠狀態,有狀況通訊系統會自動叫醒我們,所以三萬年的時間並不算久。我們一直沉睡到不久之前..』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『原本處在沉睡狀況下的要塞為何會再次甦醒？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『要塞發生了一次意外,安全系統誤報要塞遭受攻擊..ASR-06認為那是來自地面上的攻擊,堅持要繼續以前的攻擊命令,我和他發生很大的爭執。由於我醒來後曾對地表做過鶴察,發現陸地上已再次出現生命和文明,所以就把攻擊電腦所不可或缺的單元計算晶片拿出來,從要塞上丟了下去。三萬年前的戰爭已經夠了,我不想看到再一次的慘劇.....結果ASR-06發現了我的意圖在爭奪晶片的途中,我失足跌了下去..』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『結果.妳就掉到羅特帝亞來了。』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『.剛醒來的時候,我的系統受到嚴重衝擊,部份記憶無法存取,所以我忘記了以往的一切。那時無心的說出想回家的話,索爾你們才和我一路來到這裡,.這是命運之神的安排吧!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『真是令人難以置信....我想,這一切都是神的旨意現在我們已打倒了最後的敵人,悠妮小姐,往後...妳打算怎麼辦呢？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『我會用空間轉送裝置送你們回馬拉大陸,然後我會把要塞帶到超空間中,讓它永遠永遠的從這個世界上消失.一切就讓它就此結束吧!』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮,妳不和我們一起走嗎？』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『不。我本來就是這個要塞的一部份,而為了保證這種事不會再發生,我也必須待在這個要塞上.我想這是和大家說再見的時刻了,這些日子來的冒險與種種回憶..我會永遠記在心裡..』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮!妳真的要留在這兒？..』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『索爾,我真的很感激你,你已經實現了諾言,將我送回家了。你對我來說是很特別的,在記憶甦醒的剎那,我為了自己將選擇哪一方而迷亂,然而.是你讓我做了最後的決定。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『.不能為了我..』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『索爾,我睬解你的心情,但是.我並不是一般的女子,也不屬於這個新的世界..就讓我留在這裡吧,這也是我的職責..』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『索爾,你要諒解悠妮的立場而且,在將來的歲月中,你也一定會再遇到適合你的女孩子,更何況你身為羅特帝亞的王子,有美好的將來和前程,別辜負了悠妮的心意。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『....我明白了。悠妮,妳要多保重.』"}, {"k": "id", "name": "悠妮", "hint": "角色 id 9（悠妮）", "ck": 9, "t": "『謝謝...我會永遠永遠記得你的,索爾.在我的生命中..』"}]}]}, {"res": 31, "n": 46, "head": "這是馬拉大陸的土地!我們終於又回到家園了。哈,多踩幾", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "哈瓦特", "hint": "角色 id 3（哈瓦特）", "ck": 3, "t": "『這是馬拉大陸的土地!我們終於又回到家園了。哈,多踩幾下這堅實的土地!』"}, {"k": "id", "name": "洛娜", "hint": "角色 id 5（洛娜）", "ck": 5, "t": "『啊~涼爽的微風,和煦的陽光!還是這個世界比較美好!』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『很高興我們解決了一切的事端,並且保住了這個世界。大家都做得很好!』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『我會叫父王辦個盛大的慶功宴,我們大家好好慶祝慶祝!這可是連王國禁衛軍都做不到的偉大成就哦!』"}, {"k": "id", "name": "洛娜", "hint": "角色 id 5（洛娜）", "ck": 5, "t": "『亞雷斯,到時候我們痛快的喝一杯!你會陪我的吧？』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『這個.我負責在旅途中侍衛索爾王子,如今事情已經圓滿解決,為了避免陛下和皇后擔憂,我想還是早點回羅特帝亞比較好..』"}, {"k": "id", "name": "洛娜", "hint": "角色 id 5（洛娜）", "ck": 5, "t": "『這樣嗎.可是,可是...留下來玩個幾天不行嗎？』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『洛娜,既然你捨不得亞雷斯可以和他一起回羅特帝亞啊過幾天我也要以正式身份前往羅特帝亞拜訪,那時候妳再和我一起去不就好了。』"}, {"k": "id", "name": "洛娜", "hint": "角色 id 5（洛娜）", "ck": 5, "t": "『.,這樣的話,那....亞雷斯,那我們到時候見了!』"}, {"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『嘿,好.好啊!唉!這下頭大了..』"}, {"k": "id", "name": "約拿", "hint": "角色 id 21（約拿）", "ck": 21, "t": "『看到這些年輕人的樣子,真讓我想起自己年輕的時候。呵呵呵..』"}, {"k": "id", "name": "索菲亞", "hint": "角色 id 11（索菲亞）", "ck": 11, "t": "『是啊!打贏了這麼一場仗,輕鬆輕鬆也是應該的.唉？索爾呢？』"}, {"k": "id", "name": "希爾法", "hint": "角色 id 24（希爾法）", "ck": 24, "t": "『怪了,剛剛還在這裡的..啊,在那邊!』"}]}, {"sub": 1, "sp": [{"k": "id", "name": "亞雷斯", "hint": "角色 id 4（亞雷斯）", "ck": 4, "t": "『索爾,怎麼了？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『悠妮.悠妮在那裡,在天空之中..』"}, {"k": "id", "name": "希莉亞", "hint": "角色 id 8（希莉亞）", "ck": 8, "t": "『有嗎？我什麼都沒看到.』"}]}, {"sub": 2, "sp": [{"k": "plain", "t": "『那是.那是黃金城!』"}]}, {"sub": 3, "sp": [{"k": "plain", "t": "『這就是幾百年來,從未有人\n 見到過其廬山真面目的黃金\n 城嗎？』"}]}, {"sub": 4, "sp": [{"k": "plain", "t": "『..有著神與天空的威嚴,\n 郎只能帶來死亡和毀滅的傳\n 說之城..』"}]}, {"sub": 5, "sp": [{"k": "plain", "t": "『..索爾..永遠再見了,\n 你要好好保重..』"}]}, {"sub": 6, "sp": [{"k": "plain", "t": "『是悠妮的聲音!悠妮..』"}]}, {"sub": 7, "sp": [{"k": "plain", "t": "『那是..悠妮最後的道別吧\n ？』"}]}, {"sub": 8, "sp": [{"k": "plain", "t": "『..謝謝妳,悠妮!在往後\n 的歲月中,我仍會永遠記得\n 妳..和這段非凡的冒險旅\n 程..』"}]}, {"sub": 9, "sp": [{"k": "plain", "t": "『是的,一切就到此結束了。\n 黃金城的傳說..』"}]}, {"sub": 10, "sp": [{"k": "plain", "t": "姓名："}]}, {"sub": 11, "sp": [{"k": "plain", "t": "職業："}]}, {"sub": 12, "sp": [{"k": "plain", "t": "在回程的路上,索爾默默的下了決心。為了\n悠妮的遺願,為了希莉亞的衷情,他要繼任\n羅特帝亞的王位,成為一個偉大的帝王。這\n是屬於他的宿命,不管自己的心中是多麼空\n虛.."}]}, {"sub": 13, "sp": [{"k": "plain", "t": "和索爾一夥人度過無數艱險的哈諾,現在已\n被其父哈瓦那承認為一個真正的戰士了。據\n說父子倆正在建造船塢,準備一起前往某個\n傳說中的島嶼進行冒險。"}]}, {"sub": 14, "sp": [{"k": "plain", "t": "在索爾一行的協助下,鐵諾終於化解了和王\n國軍的恩怨。心願已了之後,他決定離開這\n個傷心地繼續浪跡天涯。直到再有一天.."}]}, {"sub": 15, "sp": [{"k": "plain", "t": "老而彌堅的哈瓦那是個閒不住的冒險者,聽\n說他最近找到一張祖傳的地圖,雀躍不已的\n準備要出海去尋寶。當然了,他的兒子哈諾\n會是他最得力的助手和伙伴。"}]}, {"sub": 16, "sp": [{"k": "plain", "t": "完成了保護王子的使命之後,亞雷斯光榮的\n和索爾一起回國,隨即繼任禁衛騎士團長一\n職。他預期洛娜必會很快就追到這裡來,而\n且索爾會願意當這個現成的介紹人.."}]}, {"sub": 17, "sp": [{"k": "plain", "t": "在索爾等人回國之後,身為騎士團代表的洛\n娜也喜孜孜的準備行李,等著和希莉亞一起\n前往羅特帝亞訪問。她身上帶著國王的親筆\n介紹信,這回亞雷斯是劫數難逃了.."}]}, {"sub": 18, "sp": [{"k": "plain", "t": "萊汀仍任王國禁衛軍隊長一職。瑪爾的死解\n開了他心裏的死結,而莎拉的英姿則讓他找\n到了生命的另一個目標.這是讓眾人深深祝\n福的一對,雖然他們至今仍不肯承認。"}]}, {"sub": 19, "sp": [{"k": "plain", "t": "這位沉默的騎士幾乎已被視為約拿的伙伴,\n所以當約拿在一個多霧的早晨飄然離去時,\n蘭斯洛特也隨著離開了。他的過去與一切,\n似乎比約拿還要神秘.."}]}, {"sub": 20, "sp": [{"k": "plain", "t": "希莉亞雖然獲得了父王的應允,但索爾才剛\n受到悠妮離去的打擊,因此這回她出使羅特\n帝亞,將不會提起婚事。她相信,只要耐心\n的等,索爾總有一天會明白她的心意."}]}, {"sub": 21, "sp": [{"k": "plain", "t": "在漂浮在另一個時空的黃金城裏,悠妮在休\n眠艙裡沉睡著.等待著她的是另一段長久的\n沉眠,連她也不知道自己何時會再醒來。"}]}, {"sub": 22, "sp": [{"k": "plain", "t": "自小嬌生慣養的瑪琳在這一番冒險之後,也\n終於有了些成長,現在她已是家中的乖女兒\n,不再恃嬌惹事,除了繼續僧侶神術的修行\n之外,她也已開始學著做些女紅家事。"}]}, {"sub": 23, "sp": [{"k": "plain", "t": "身為大祭司的索菲亞在事件結束之後,還是\n回到了她所崇信的神的身邊。在亞克斯王國\n王城的神殿之中,光之神卡爾汀的祭壇之前\n,始終迴盪著她沉靜輕柔的祈禱聲.."}]}, {"sub": 24, "sp": [{"k": "plain", "t": "在師兄賽可邦勒回到豹人族之後,就只剩凱\n麗陪在武神卡里斯身邊。她最近正因要與師\n父前往羅特帝亞而興奮不已,但若她知道師\n父此行的目的,可能就高興不起來了."}]}, {"sub": 25, "sp": [{"k": "plain", "t": "在事件之後,年輕的貝克威變得更加成熟了\n。他不願蟄居於故居的精靈族森林中,想要\n出去看看廣大的世界,因此事件結束後他就\n離開了,只有珊知道他的去處.."}]}, {"sub": 26, "sp": [{"k": "plain", "t": "有感於在戰陣中自己在魔法技能上的不足,\n珊決定努力修習魔法。據說她和貝克威相約\n,當貝克威從外面歷練回來時,她就要成為\n一名真正的大法師。"}]}, {"sub": 27, "sp": [{"k": "plain", "t": "告別了恩師卡里斯之後,賽可邦德回到了豹\n人族中,他現在不但是豹人族自衛隊的總教\n練,負責訓練年輕的豹人武士,也已經結婚\n生子,生活幸福美滿。"}]}, {"sub": 28, "sp": [{"k": "plain", "t": "在與眾伙伴們打倒所有魔王後,凱拉斯終於\n報了昔日死在黑暗軍手下的部下們的血仇。\n在聖寇拉斯遷都平地之後,凱拉斯一直追隨\n其後,現在他擔任新都城守備軍的隊長。"}]}, {"sub": 29, "sp": [{"k": "plain", "t": "憑著在激戰中所獲得的經驗與能力,米亞斯\n多德得以正式成為龍人族衛隊的一個隊長,\n他雖不時惦念過去自由的生活,但郎也能安\n於自己的新職位。"}]}, {"sub": 30, "sp": [{"k": "plain", "t": "告別了眾位伙伴之後,密蒂回到了她的隱居\n之所,繼續劍術和心靈的修練。那個年輕人\n又在她沉靜的心湖裏掀起了一陣波瀾.但她\n相信,絕不會再有第三次了.."}]}, {"sub": 31, "sp": [{"k": "plain", "t": "羅德曼在事件後便悄悄回到領地,以免擅離\n職守參與冒險之事被國王得知。但在希莉亞\n的多嘴之下,羅德曼仍被邀請往王城一行,\n痛快的和眾人舉行了一場慶功宴。"}]}, {"sub": 32, "sp": [{"k": "plain", "t": "在宴會結束之後,莎拉迅即向眾人道別,然\n後乘上飛龍離去。她說她是要去尋找散落在\n大陸上的族人們,重新復興龍騎士一族。然\n而.."}]}, {"sub": 33, "sp": [{"k": "plain", "t": "這位始終充滿了神秘的賢者在亞克斯王國作\n了幾天客之後,便向他的老友大法師希爾法\n道別,又開始了另一次新的旅程。當然,這\n次還是沒有人知道他們要到哪裡去.."}]}, {"sub": 34, "sp": [{"k": "plain", "t": "武神卡里斯正準備結束多年來在馬拉大陸的\n旅程,返回故居羅特帝亞。據說他此行除了\n回故鄉定居外還另有目的,至於究竟是什麼\n目的就不得而知了。"}]}, {"sub": 35, "sp": [{"k": "plain", "t": "身為精靈族的一員,羅蘭也隨著其他的族人\n們回到了森林中,她最近成為大法師希爾法\n的助手,大概是基於昔日的經驗,想在幫忙\n之餘順便學一些戰鬥用的魔法吧!"}]}, {"sub": 36, "sp": [{"k": "plain", "t": "希爾法在事件結束後又開始了他的新課題,\n整天待在位於哈斯米爾的的新研究所裏,據\n說他正致力於時空魔法的研究,希望能再把\n黃金城帶回到這世界上來。"}]}, {"sub": 37, "sp": [{"k": "plain", "t": "在戰鬥結束後,謝多又回到了黑森林,過著\n隱居的清閒生活。由於萊汀不時委託北上的\n商隊為他送去各種生活用品,謝多睌年的日\n子過得愉快而愜意。"}]}, {"sub": 38, "sp": [{"k": "plain", "t": "為了興旺龍人一族,身為龍人族之王的聖寇\n拉斯決定將首都由高山遷到平地,並在亞克\n斯王國的協助下建立新的城市,相信龍人族\n必定會很快的昌盛起來。"}]}, {"sub": 39, "sp": [{"k": "plain", "t": "由於他優越的武術和人品,禁衛軍隊長萊汀\n特地留巴拿羅西亞在亞克斯王國住下,平時\n他是龍人族在亞克斯王國的使節,也兼任禁\n衛軍的武術教練,和萊汀相處甚歡。"}]}, {"sub": 40, "sp": [{"k": "plain", "t": "由於到亞齊梅吉的賞識,達克塞回到惡魔族\n王國之後便被任命為禁衛軍隊長,把守惡魔\n族的邊界。由於他對人類的睬解與好感,在\n與人類文明接觸之初解決了不少紛爭。"}]}, {"sub": 41, "sp": [{"k": "plain", "t": "戰爭結束後,惡魔族之王也恢復了正常。亞\n奇梅吉回到了宰相的位子,在他的一生中,\n始終致力於與其他人類國家的和平相處與友\n誼。"}]}, {"sub": 42, "sp": [{"k": "plain", "t": "失去了悠妮的意念控制,蓋亞的機能已經完\n全休止。雖然如此,索爾仍執意要把它運回\n羅特帝亞,因為這是悠妮留給他的唯一的紀\n念品.."}]}, {"sub": 43, "sp": [{"k": "plain", "t": "渥德在悠妮和黃金城離開之後,失去了控制\n聯壑的中樞,竟然就此不再動彈。但萊汀仍\n將它好好的保存在王宮禁衛隊的寶庫中,希\n望有天能再得到它的效力。"}]}, {"sub": 44, "sp": [{"k": "plain", "t": "  在亞克斯王國宮廷中\n 盛大的慶祝宴會結束之後,\n  離別的時刻終於來到了。\n昔日的戰友們自此將互道珍重,\n    各奔前程。\n   在往日的回憶中,\n   在未來的歲月裏,\n 或許很難有再相見的機會,\n 但這段冒險的回憶仍會長存,\n  在每個人的心裡..."}]}, {"sub": 45, "sp": [{"k": "plain", "t": "但她相信,三千年也好,三萬年也好,她一\n定會再那個叫做索爾的年輕人在夢中相聚,\n她相信,這樣就已經足夠了..."}]}]}, {"res": 32, "n": 11, "head": "亞雷斯,趕快再來比一場!昨天輸給你,我越想越不甘心!", "blocks": [{"sub": 0, "sp": [{"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『亞雷斯,趕快再來比一場!昨天輸給你,我越想越不甘心!』"}, {"k": "slot", "name": "場景#1", "hint": "場景記錄表槽位 1（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『贏了就是贏了,何況你已經打贏我十幾場,讓我一場有什麼關係!』"}, {"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『這可不一樣!我老爸說過,劍技要不斷磨練才會進步..』"}, {"k": "slot", "name": "場景#1", "hint": "場景記錄表槽位 1（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『拜託,今天休息吧!風和日麗的日子,躺在草地上曙曙太陽,不是也很愜意？』"}, {"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『好吧,既然如此,我回去找侍衛們練習也可以!』"}]}, {"sub": 1, "sp": [{"k": "slot", "name": "場景#1", "hint": "場景記錄表槽位 1（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『唉,那是什麼東西？』"}]}, {"sub": 2, "sp": [{"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『怎麼了？』"}]}, {"sub": 3, "sp": [{"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『好像是人昏倒在地呢!』"}, {"k": "slot", "name": "場景#1", "hint":
