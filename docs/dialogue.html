 "場景記錄表槽位 1（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『是啊,旁邊那個大傢伙又是什麼？』"}]}, {"sub": 4, "sp": [{"k": "slot", "name": "場景#3", "hint": "場景記錄表槽位 3（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『不要再接近!否則我將照規定採取防衛行動!』"}, {"k": "slot", "name": "場景#1", "hint": "場景記錄表槽位 1（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『搞什麼嘛!』"}]}, {"sub": 5, "sp": [{"k": "slot", "name": "場景#4", "hint": "場景記錄表槽位 4（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『.,好痛..』"}, {"k": "slot", "name": "場景#1", "hint": "場景記錄表槽位 1（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『是女孩子呢!』"}, {"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『我去看看!』"}]}, {"sub": 6, "sp": [{"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『小.小姐,你沒事吧!』"}, {"k": "slot", "name": "場景#4", "hint": "場景記錄表槽位 4（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『你.你是誰？這裡是哪裡？』"}, {"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『這裡是羅特帝亞,我叫索爾請問小姐你的芳名？』"}, {"k": "slot", "name": "場景#4", "hint": "場景記錄表槽位 4（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『我叫.我叫.悠妮吧。我怎麼會來到這裡的？』"}, {"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『悠妮？好名字。悠妮小姐,妳怎麼會記不得怎麼來到這裡的？』"}, {"k": "slot", "name": "場景#4", "hint": "場景記錄表槽位 4（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『..真的想不起來了,只記得.只記得我好像是從很遠很遠的地方來的。蓋亞？』"}]}, {"sub": 7, "sp": [{"k": "slot", "name": "場景#3", "hint": "場景記錄表槽位 3（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『是的,主人。有何吩咐？』"}, {"k": "slot", "name": "場景#4", "hint": "場景記錄表槽位 4（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『我們.是從哪裡來的？』"}]}, {"sub": 8, "sp": [{"k": "slot", "name": "場景#3", "hint": "場景記錄表槽位 3（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『據我的慣性導航系統顯示,是在那個方位。』"}, {"k": "slot", "name": "場景#1", "hint": "場景記錄表槽位 1（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『啊!我知道了,你們是從馬拉大陸來的,我聽老爸說過,那的確是個很遙遠的地方。』"}, {"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『悠妮小姐,妳是從那個馬.馬拉大陸來的嗎？』"}, {"k": "slot", "name": "場景#4", "hint": "場景記錄表槽位 4（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『我記不得了,只記得.好可怕的惡夢.好可怕.不!不要!』"}, {"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『悠.悠妮小姐!』"}, {"k": "slot", "name": "場景#4", "hint": "場景記錄表槽位 4（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『我好怕.帶我回家.帶我回家,好嗎？求求你..』"}, {"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『.好!好!別怕,有我在.放心,我一定帶妳回家!』"}, {"k": "slot", "name": "場景#1", "hint": "場景記錄表槽位 1（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『哎喲喂!這小子該不會想要..』"}]}, {"sub": 9, "sp": [{"k": "slot", "name": "場景#1", "hint": "場景記錄表槽位 1（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『喂!你真的要去？你瘋了!聽說那裡是與羅特帝亞完全不一樣的地方,為了一個女孩子去冒這種險,未免.』"}, {"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『我一定要去!亞雷斯,你知不知道怎麼去？』"}, {"k": "slot", "name": "場景#1", "hint": "場景記錄表槽位 1（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『這？好.好吧,我回去問問老爹,我想他應該會知道..』"}, {"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『好極了,我們整理一些輕便行李,我再向父王橐告一下,就可以出發了。』"}, {"k": "slot", "name": "場景#1", "hint": "場景記錄表槽位 1（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『我也去好了!誰叫我們是從小打架打到大的朋友？總不能就這樣讓你一個人到馬拉大陸去!』"}, {"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『亞雷斯,謝謝你!』"}, {"k": "slot", "name": "場景#1", "hint": "場景記錄表槽位 1（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『不用謝了,你先帶悠妮小姐回去休養吧!陛下那邊和借船的事我來辦就好了。』"}]}, {"sub": 10, "sp": [{"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『悠妮小姐,妳就先和我回去吧!幾天後我們就啟程回馬拉大陸,妳放心,我一定平安的送妳回家。』"}, {"k": "slot", "name": "場景#4", "hint": "場景記錄表槽位 4（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『謝.謝謝你。』"}, {"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『嘿,我們這就走吧!還有不少事要忙呢!』"}]}]}, {"res": 33, "n": 6, "head": "兒臣索爾,晉見父王陛下。", "blocks": [{"sub": 0, "sp": [{"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『兒臣索爾,晉見父王陛下。』"}, {"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『你來啦!起來起來,這裡沒有別人,不用多禮。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『多謝父王。』"}, {"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『到這裡來,讓父王好好看看你。這一陣子國務繁忙,我們父子兩個也很久沒聚聚了。』"}, {"k": "slot", "name": "場景#1", "hint": "場景記錄表槽位 1（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『是啊!我們一家人,難得這樣在一起。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『是。』"}]}, {"sub": 1, "sp": [{"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『索爾,時間過得真快,你已經長得這麼高了。大臣和將領們對你的武藝和能力也讚譽有加,我想,也該是決定王位繼承人的時候了。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『是的,父王,想必是由皇弟迪恩接任王位,兒臣不勝欣喜。』"}, {"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『錯了,索爾,朕希望能由你來接任羅特帝亞的王位。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『啊？兒.兒臣我來接任王位？』"}, {"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『是的,索爾。你對朕的決定有什麼疑問嗎？』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『兒臣不敢。但...但是,父王,兒臣並未繼承羅特帝亞王家的血脈,照理來說,兒臣以為應該由皇弟迪恩來繼承王位..』"}, {"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『索爾,這是一個屬於強者的時代。只有強者才能掌握軍隊、統治國家,維持世界的和平和人民的福祉。羅特帝亞需要一個強有力的統治者我相信你能接替我繼承王位——而且也只有你才能繼承王位。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『可是,皇弟他..』"}, {"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『迪恩他和你不一樣。迪恩是個聰明的孩子,可以成為賢明的君主,但是他長得太文弱了,無法穿著重甲、統率大軍在戰場上奔馳。我還記得當我還是個孩子時所發生的事情,所以.為了羅特帝亞王族,為了羅特帝亞王國的人民,我希望你能成為王位繼承人。』"}, {"k": "slot", "name": "場景#1", "hint": "場景記錄表槽位 1（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『是的。索爾,這些年來,我們把你當成自己親生的孩子撫養長大,這件事也是經過慎重考慮之後才決定的,希望你能夠答應。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『兒臣.兒臣.』"}, {"k": "slot", "name": "場景#0", "hint": "場景記錄表槽位 0（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『我就知道你會一時無法接受這樣吧,三天之後,你再給我考慮的結果,當然了,我希望能夠聽到肯定的答覆。你先回去休息吧。』"}, {"k": "id", "name": "索爾", "hint": "角色 id 0（索爾）", "ck": 0, "t": "『.是的。兒臣告退。』"}]}, {"sub": 2, "sp": [{"k": "slot", "name": "場景#4", "hint": "場景記錄表槽位 4（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『哈!找你找了半天,居然是躲在這裡打瞌睡,真是一點都不像你的作風。』"}, {"k": "slot", "name": "場景#3", "hint": "場景記錄表槽位 3（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『..』"}, {"k": "slot", "name": "場景#4", "hint": "場景記錄表槽位 4（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『怎麼啦？你今天好像有點不太對勁？』"}, {"k": "slot", "name": "場景#3", "hint": "場景記錄表槽位 3（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『..唉!』"}, {"k": "slot", "name": "場景#4", "hint": "場景記錄表槽位 4（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『嘿!待會兒是不是要打雷了你居然在嘆氣!我看我們得好好談一談了!』"}]}, {"sub": 3, "sp": [{"k": "slot", "name": "場景#4", "hint": "場景記錄表槽位 4（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『索爾,到底是發生什麼事了？』"}, {"k": "slot", "name": "場景#3", "hint": "場景記錄表槽位 3（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『.其實也沒什麼啦。』"}, {"k": "slot", "name": "場景#4", "hint": "場景記錄表槽位 4（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『少裝啦!這世界上能讓你嘆氣的事絕對不會超過十件。說來聽聽吧!』"}, {"k": "slot", "name": "場景#3", "hint": "場景記錄表槽位 3（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『.父王要我繼承王位。』"}]}, {"sub": 4, "sp": [{"k": "slot", "name": "場景#4", "hint": "場景記錄表槽位 4（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『嗄？』"}]}, {"sub": 5, "sp": [{"k": "slot", "name": "場景#3", "hint": "場景記錄表槽位 3（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『沒聽清楚嗎？父王要我繼承王位。』"}, {"k": "slot", "name": "場景#4", "hint": "場景記錄表槽位 4（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『嗄？.這.這有什麼好嘆氣的？羅特帝亞的准王位繼承人..這要好好慶祝一下才是啊!』"}, {"k": "slot", "name": "場景#3", "hint": "場景記錄表槽位 3（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『笨蛋!枉費我們從小一起長大,你竟然一點都不睬解我!』"}, {"k": "slot", "name": "場景#4", "hint": "場景記錄表槽位 4（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『啊？這怎麼說呢？』"}, {"k": "slot", "name": "場景#3", "hint": "場景記錄表槽位 3（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『我怎麼會喜歡國王一職!整天待在王城裏哪裡也不能去還得管理繁瑣的政務、應付囉唸的大臣和官員..那有什麼樂趣!』"}, {"k": "slot", "name": "場景#4", "hint": "場景記錄表槽位 4（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『以你的個性來說.這樣講也沒錯。』"}, {"k": "slot", "name": "場景#3", "hint": "場景記錄表槽位 3（同一槽位在不同場景是不同人）", "ck": "slot", "t": "『我從小想做的事,就是到外地去做幾次轟轟烈烈的冒險絕對不是枯坐在王位上終老一生!我只是父王的養子,和羅特帝亞王家沒有血緣關係,所以我一直以為會由皇弟迪恩繼承王位,我就可以落得輕鬆,那知.唉!』"}, const PAL = ["#c62828", "#1565c0", "#2e7d32", "#6a1b9a", "#ef6c00", "#00838f", "#ad1457", "#4e342e", "#546e7a", "#b71c1c", "#283593", "#1b5e20", "#0277bd", "#8e24aa", "#5d4037", "#00695c"];
const color = ck => (typeof ck === "number") ? PAL[ck % PAL.length] : "#9e9e9e";
let onlySpeaker = null, kw = "";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* ---- sidebar: speakers ---- */
const spBox = document.getElementById("speakers");
const order = Object.keys(DATA.speakers).map(Number).sort((a,b)=>a-b);
spBox.innerHTML = "<h4>说话人（点选筛选）</h4>";
order.forEach(id=>{
  const s = DATA.speakers[id];
  const d = document.createElement("div");
  d.className = "sp"; d.dataset.sp = id;
  d.innerHTML = `<span class="badge" style="background:${color(id)}">${esc(s.name)}</span><span class="n">${s.n}</span>`;
  d.onclick = ()=>{ onlySpeaker = (onlySpeaker===id)?null:id; apply(); };
  spBox.appendChild(d);
});

/* ---- sidebar: scenes ---- */
const nav = document.getElementById("nav");
DATA.scenes.forEach(sc=>{
  const a=document.createElement("a");
  a.className="nav"; a.href="#res"+sc.res;
  a.innerHTML=`res${sc.res} <span class="n">${sc.n}</span>`;
  nav.appendChild(a);
});

/* ---- content ---- */
const content = document.getElementById("content");
DATA.scenes.forEach(sc=>{
  const sec=document.createElement("div"); sec.className="scene"; sec.id="res"+sc.res;
  sec.innerHTML=`<h2>res${sc.res} <span style="color:var(--muted);font-size:12px;font-weight:400">${sc.n} 段</span></h2>`;
  sc.blocks.forEach(b=>{
    const d=document.createElement("div"); d.className="block"; d.dataset.res=sc.res; d.dataset.sub=b.sub;
    let h=`<div class="id">sub${b.sub}</div>`;
    b.sp.forEach(s=>{
      if(s.k==="plain"){ h+=`<div class="row"><span class="txt plain">${esc(s.t)}</span></div>`; return; }
      const cls = (s.k==="slot")?"slot":(s.k==="keep"?"keep":"");
      h+=`<div class="row"><span class="badge ${cls}" style="background:${color(s.ck)}" title="${esc(s.hint)}" data-sp="${s.k==='id'?s.ck:''}">${esc(s.name)}</span><span class="txt">${esc(s.t)}</span></div>`;
    });
    d.innerHTML=h; sec.appendChild(d);
  });
  content.appendChild(sec);
});
/* clicking a badge filters to that speaker */
content.addEventListener("click", e=>{
  const b = e.target.closest(".badge");
  if(!b || b.dataset.sp==="") return;
  const id = Number(b.dataset.sp);
  onlySpeaker = (onlySpeaker===id)?null:id; apply();
});

/* ---- terms ---- */
const terms=document.createElement("div"); terms.className="scene"; terms.id="res0";
let th='<h2>附：res0 字符串表 <span style="color:var(--muted);font-size:12px;font-weight:400">'
      + DATA.terms.length + ' 条（名字表 = [id+1]，高 id 为单位/职业名）</span></h2><table class="terms">';
DATA.terms.forEach(t=>{ th+=`<tr><td>${t.sub}</td><td>${esc(t.t)}</td></tr>`; });
terms.innerHTML=th+"</table>"; content.appendChild(terms);

/* ---- filter ---- */
const q=document.getElementById("q"), cnt=document.getElementById("cnt"), clr=document.getElementById("clear");
function clearMarks(){ document.querySelectorAll("mark").forEach(m=>{ m.outerHTML = m.innerHTML; }); }
function apply(){
  clearMarks();
  document.querySelectorAll(".sp").forEach(e=>e.classList.toggle("on", onlySpeaker!==null && +e.dataset.sp===onlySpeaker));
  const active = kw!=="" || onlySpeaker!==null;
  let hit=0, total=0;
  document.querySelectorAll(".block").forEach(bl=>{
    total++;
    let ok = true;
    if(onlySpeaker!==null){
      ok = [...bl.querySelectorAll(".badge")].some(x=>x.dataset.sp!=="" && +x.dataset.sp===onlySpeaker);
    }
    if(ok && kw!=="") ok = bl.textContent.includes(kw);
    bl.classList.toggle("hidden", !ok);
    if(ok){
      hit++;
      if(kw!==""){
        const re=new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"g");
        bl.querySelectorAll(".txt").forEach(t=>{
          if(t.innerHTML.includes(kw)) t.innerHTML=t.innerHTML.replace(re,"<mark>"+kw+"</mark>");
        });
      }
    }
  });
  document.querySelectorAll(".scene").forEach(sec=>{
    const any = [...sec.querySelectorAll(".block")].some(b=>!b.classList.contains("hidden"));
    sec.classList.toggle("hidden", active && !any);
  });
  cnt.textContent = active ? `${hit}/${total} 段命中` : "";
  clr.style.display = active ? "inline" : "none";
}
q.addEventListener("input", ()=>{ kw=q.value.trim(); apply(); });
clr.onclick = ()=>{ q.value=""; kw=""; onlySpeaker=null; apply(); };
</script>
